<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuro'Mania</title>
<meta name="description" content="Neuro'Mania : la porte d'entrée de nos jeux. Choisissez un chapitre : chaque jeu a sa propre entrée.">
<meta name="theme-color" content="#120F2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lilita+One&display=swap">
<!--
  ════════════════════════════════════════════════════════════════════
   NEURO'MANIA — la porte d'entrée commune de nos jeux
  ════════════════════════════════════════════════════════════════════

  On arrive sur un SOMMAIRE (Jeu 1, Jeu 2…). Chaque jeu ouvre sa propre
  page, séparée des autres (#labo-des-savoirs, #guerre-des-neurones…),
  avec son lien unique et ses QR codes. Les jeux eux-mêmes tournent
  chacun sur leur propre service : rien ne se mélange.

  La liste des jeux est écrite dans catalogue.json, à côté de cette page.
  La page la relit toute seule toutes les 30 secondes (et quand on revient
  sur l'onglet) : un jeu ajouté apparaît sans que personne ne rafraîchisse.

  Les jeux hébergés gratuitement « s'endorment » après 15 minutes sans
  visite. Dès qu'on ouvre la page d'un jeu, Neuro'Mania le réveille et
  affiche « Réveil en cours… » puis « Prêt ! ».
-->
<style>
  /* Une porte d'entrée : un grand titre, puis un sommaire de livre ; chaque chapitre ouvre sa salle. */
  :root {
    --nuit: #120F2E;
    --nuit-2: #1C1844;
    --nuit-3: #2A2563;
    --trait: #3B3580;
    --papier: #F5F3FF;
    --brume: #B3ADDF;
    --rose: #FF5FA2;
    --cyan: #3DE0F0;
    --tournesol: #FFC93C;
    --menthe: #3DD6B5;
    --police-titre: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --police-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { overflow-x: clip; }
  body {
    margin: 0; min-height: 100vh; background: var(--nuit); color: var(--papier);
    font-family: var(--police-texte); font-size: 18px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { font-family: var(--police-titre); font-weight: 400; line-height: 1.05; margin: 0; text-wrap: balance; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 10px; }
  .page { width: min(1080px, 100%); margin-inline: auto; }

  .bandeau { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: max(18px, env(safe-area-inset-top, 0px)) 18px; }
  .marque { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--police-titre); font-size: 1.4rem; }
  .marque b { color: var(--rose); font-weight: 400; }
  .direct { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--trait); color: var(--brume); font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .direct i { width: 8px; height: 8px; border-radius: 50%; background: var(--menthe); }

  /* ─── L'accueil ─── */
  .entree { position: relative; padding-block: clamp(28px, 6vw, 70px) clamp(24px, 4vw, 44px); isolation: isolate; overflow: clip; }
  .reseau { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .5; pointer-events: none; }
  .reseau line { stroke: var(--trait); stroke-width: 1.3; }
  .reseau circle { fill: var(--nuit-3); stroke: #9B8CFF; stroke-width: 1.3; }
  .reseau .influx { fill: var(--cyan); stroke: none; }
  .surtitre { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; }
  .entree h1 { font-size: clamp(3.2rem, 12vw, 7.4rem); }
  .entree h1 .ap { color: var(--rose); }
  .entree h1 .mania { background: linear-gradient(100deg, var(--tournesol), var(--rose) 55%, #9B8CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .accroche { font-family: var(--police-titre); font-size: clamp(1.4rem, 3.6vw, 2.1rem); line-height: 1.15; margin: 16px 0 0; max-width: 24ch; }
  .accroche em { font-style: normal; color: var(--tournesol); }
  .sous { color: var(--brume); max-width: 46ch; margin: 14px 0 0; font-size: 1.05rem; }

  /* ─── Le sommaire : une table des matières, un chapitre par jeu ─── */
  .sommaire { padding-block: 10px 40px; }
  .sommaire-titre { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--trait); }
  .sommaire-titre h2 { font-size: 1.9rem; }
  .sommaire-titre span { color: var(--brume); font-size: .95rem; }
  .chapitres { list-style: none; margin: 0; padding: 0; }
  .chapitre a { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: clamp(12px, 3vw, 26px); padding: 22px 6px; border-bottom: 1px dashed var(--trait); text-decoration: none; transition: background .2s, padding .2s; }
  .chapitre a:hover { background: color-mix(in srgb, var(--c) 9%, transparent); padding-inline: 16px; }
  .numero { font-family: var(--police-titre); font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
  .numero b { display: block; font-size: 2.6rem; line-height: 1; letter-spacing: 0; font-weight: 400; }
  .chapitre-icone { width: 64px; height: 64px; display: grid; place-items: center; font-size: 2rem; border-radius: 18px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 16%, var(--nuit-2)); }
  .chapitre-texte { min-width: 0; }
  .chapitre h3 { font-size: clamp(1.5rem, 3.6vw, 2.1rem); }
  .chapitre p { margin: 4px 0 0; color: var(--brume); }
  .chapitre .fleche { font-family: var(--police-titre); font-size: 1rem; color: var(--c); white-space: nowrap; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--c); }
  .chapitre.vient-d-arriver a { animation: arrivee 1.4s ease-out; }
  @keyframes arrivee { from { background: color-mix(in srgb, var(--c) 30%, transparent); } }

  /* ─── La salle d'un jeu, séparée des autres ─── */
  .salle { padding-block: 10px 50px; }
  .retour { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--trait); text-decoration: none; font-weight: 700; color: var(--brume); }
  .retour:hover { color: var(--papier); border-color: var(--c); }
  .salle-tete { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; margin-top: 22px; padding: clamp(20px, 4vw, 34px); border-radius: 26px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 26%, var(--nuit-2)), var(--nuit-2) 70%); border: 1px solid color-mix(in srgb, var(--c) 50%, var(--trait)); }
  .salle-tete .chapitre-icone { width: 84px; height: 84px; font-size: 2.8rem; border-radius: 22px; }
  .salle-tete > div { min-width: 0; }
  .salle .numero { display: block; margin-bottom: 4px; }
  .salle h1 { font-size: clamp(2.2rem, 7vw, 3.8rem); }
  .salle .petit-surtitre { margin: 6px 0 0; font-weight: 700; color: var(--c); letter-spacing: .04em; font-size: .9rem; overflow-wrap: anywhere; }
  .salle .devise { margin: 6px 0 0; font-size: 1.15rem; }
  .salle .public { margin: 10px 0 0; color: var(--brume); font-size: .95rem; }
  .salle .description { margin: 20px 0 0; max-width: 62ch; color: var(--brume); }
  .reveil { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; padding: 10px 16px; border-radius: 14px; background: var(--nuit-2); border: 1px solid var(--trait); font-weight: 700; }
  .reveil i { width: 10px; height: 10px; border-radius: 50%; background: var(--tournesol); animation: clignote 1s infinite alternate; }
  .reveil.pret i { background: var(--menthe); animation: none; }
  @keyframes clignote { to { opacity: .25; } }
  .lien-unique { margin-top: 26px; display: grid; gap: 8px; }
  .lien-unique label { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brume); }
  .lien-ligne { display: flex; flex-wrap: wrap; gap: 8px; }
  .lien-ligne input { flex: 1 1 260px; min-width: 0; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--trait); background: var(--nuit); color: var(--papier); font: 700 1rem var(--police-texte); }
  .bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 14px; border: 2px solid var(--trait); background: transparent; color: var(--papier); font: 700 1rem var(--police-texte); text-decoration: none; cursor: pointer; }
  .bouton:hover { border-color: var(--c); }
  .bouton.principal { background: var(--c); border-color: var(--c); color: var(--nuit); }
  .entrees { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; margin-top: 26px; }
  .porte { display: grid; gap: 12px; align-content: start; padding: 20px; border-radius: 20px; background: var(--nuit-2); border: 1px solid var(--trait); }
  .porte h3 { font-size: 1.3rem; }
  .porte p { margin: 0; color: var(--brume); font-size: .95rem; }
  .porte code { font-size: .85rem; color: var(--papier); overflow-wrap: anywhere; }
  .qr { width: min(220px, 100%); aspect-ratio: 1; padding: 8px; border-radius: 14px; background: #fff; justify-self: center; }
  .qr svg { display: block; width: 100%; height: 100%; }

  .cadenas { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; padding: 2px 10px; border-radius: 999px; font-family: var(--police-texte); font-size: .78rem; font-weight: 700; letter-spacing: .04em; vertical-align: middle; border: 1px solid var(--trait); color: var(--brume); }
  .cadenas.prive { border-color: var(--rose); color: var(--rose); }
  .etat { padding: 50px 0; color: var(--brume); text-align: center; }
  .pied { padding-block: 30px max(40px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--trait); color: var(--brume); font-size: .92rem; }
  .pied p { margin: 0; }
  .annonce { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 160%); width: max-content; max-width: calc(100% - 32px); padding: 14px 20px; border-radius: 16px; background: var(--papier); color: var(--nuit); font-weight: 700; box-shadow: 0 14px 40px rgba(0, 0, 0, .45); transition: transform .4s ease; z-index: 10; }
  .annonce.visible { transform: translate(-50%, 0); }
  .annonce:not(.visible) { visibility: hidden; transition: transform .4s ease, visibility 0s .4s; }

  @media (max-width: 640px) {
    .chapitre a { grid-template-columns: auto 1fr; }
    .chapitre .chapitre-icone { display: none; }
    .chapitre .fleche { grid-column: 1 / -1; justify-self: start; }
    .salle-tete { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="page bandeau">
    <a class="marque" href="#" aria-label="Neuro'Mania, retour au sommaire"><span aria-hidden="true">🧠</span><span>Neuro<b>'</b>Mania</span></a>
    <span class="direct" title="La page se met à jour toute seule"><i aria-hidden="true"></i>Toujours à jour</span>
  </header>

  <main id="contenu" class="page"><p class="etat">Ouverture des portes…</p></main>

  <footer class="page pied"><p><strong>Neuro'Mania</strong> · chaque jeu a sa propre entrée. De nouveaux chapitres apparaissent ici dès qu'ils sont prêts, sans recharger la page.</p></footer>
  <div class="annonce" id="annonce" role="status" aria-live="polite"></div>

<script src="qrcode.js"></script>
<script>
'use strict';

/* Une petite fabrique d'éléments : tout le texte passe par textContent. */
function h(nom, attributs, ...enfants) {
  const el = document.createElement(nom);
  Object.entries(attributs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'style') el.style.cssText = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  });
  enfants.flat().forEach((e) => { if (e != null && e !== false) el.append(e instanceof Node ? e : document.createTextNode(String(e))); });
  return el;
}
const couleurSure = (c) => (/^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#FF5FA2');
const adresseSure = (a) => (/^https:\/\/[a-z0-9.-]+(:\d+)?$/i.test(a || '') ? a : null);
const lien = (jeu, chemin) => adresseSure(jeu.adresse) + (chemin && chemin !== '/' ? chemin : '/');

let catalogue = { jeux: [] };
let dejaVus = null;

/* ═══════════ L'accueil et son sommaire ═══════════ */

function pageAccueil(nouveaux) {
  const jeux = catalogue.jeux.filter((j) => adresseSure(j.adresse));
  return h('div', {},
    h('section', { class: 'entree' },
      h('svg', { class: 'reseau', id: 'reseau', 'aria-hidden': 'true', preserveAspectRatio: 'xMidYMid slice' }),
      h('span', { class: 'surtitre' }, 'Le repaire des esprits curieux'),
      h('h1', {}, 'Neuro', h('span', { class: 'ap' }, '\''), h('span', { class: 'mania' }, 'Mania')),
      h('p', { class: 'accroche' }, 'Derrière chaque porte, un jeu. ', h('em', {}, 'Laquelle oserez-vous ouvrir ?')),
      h('p', { class: 'sous' }, 'Choisissez un chapitre : chaque jeu a sa propre entrée et son propre lien, sans rien mélanger.')),
    h('section', { class: 'sommaire', 'aria-labelledby': 'titre-sommaire' },
      h('div', { class: 'sommaire-titre' }, h('h2', { id: 'titre-sommaire' }, 'Sommaire'), h('span', {}, jeux.length + (jeux.length > 1 ? ' jeux' : ' jeu'))),
      h('ol', { class: 'chapitres' }, jeux.map((j, i) => h('li', { class: 'chapitre' + (nouveaux.has(j.id) ? ' vient-d-arriver' : ''), style: '--c:' + couleurSure(j.couleur) },
        h('a', { href: '#' + j.id },
          h('span', { class: 'numero' }, 'Jeu', h('b', {}, String(i + 1))),
          h('span', { class: 'chapitre-icone', 'aria-hidden': 'true' }, j.icone || '✨'),
          h('span', { class: 'chapitre-texte' }, h('h3', {}, j.nom, badge(j)), h('p', {}, j.devise || j.public || '')),
          h('span', { class: 'fleche' }, 'Entrer →')))))));
}

/* ═══════════ La salle d'un jeu ═══════════ */

function qr(texte) {
  try { const q = qrcode(0, 'M'); q.addData(texte); q.make(); const d = h('div', { class: 'qr', role: 'img', 'aria-label': 'QR code vers ' + texte }); d.innerHTML = q.createSvgTag({ margin: 2 }); return d; }
  catch (e) { return null; }
}

function pageJeu(jeu, index) {
  const c = couleurSure(jeu.couleur);
  const principale = (jeu.entrees || []).find((e) => e.principal) || (jeu.entrees || [])[0] || { chemin: '/' };
  const unique = lien(jeu, principale.chemin);
  const champ = h('input', { id: 'lien-' + jeu.id, value: unique, readonly: 'readonly', 'aria-label': 'Le lien unique de ' + jeu.nom, onfocus: (ev) => ev.target.select() });
  const copier = h('button', { class: 'bouton', type: 'button', onclick: () => {
    const fini = () => annoncer('🔗 Lien copié');
    if (navigator.clipboard) navigator.clipboard.writeText(unique).then(fini, () => { champ.select(); });
    else champ.select();
  } }, 'Copier');
  const reveil = h('div', { class: 'reveil', role: 'status' }, h('i', { 'aria-hidden': 'true' }), h('span', {}, 'Réveil du jeu en cours… (jusqu\'à 1 minute)'));
  reveiller(jeu, reveil);

  return h('section', { class: 'salle', style: '--c:' + c, 'aria-labelledby': 'titre-jeu' },
    h('a', { class: 'retour', href: '#' }, '← Retour au sommaire'),
    h('div', { class: 'salle-tete' },
      h('span', { class: 'chapitre-icone', 'aria-hidden': 'true' }, jeu.icone || '✨'),
      h('div', {},
        h('span', { class: 'numero' }, 'Jeu ' + (index + 1)),
        h('h1', { id: 'titre-jeu' }, jeu.nom, badge(jeu, true)),
        jeu.surtitre ? h('p', { class: 'petit-surtitre' }, jeu.surtitre) : null,
        jeu.devise ? h('p', { class: 'devise' }, jeu.devise) : null,
        jeu.public ? h('p', { class: 'public' }, jeu.public) : null)),
    jeu.description ? h('p', { class: 'description' }, jeu.description) : null,
    reveil,
    h('div', { class: 'lien-unique' },
      h('label', { for: 'lien-' + jeu.id }, 'Le lien unique de ce jeu'),
      h('div', { class: 'lien-ligne' }, champ, copier, h('a', { class: 'bouton principal', href: unique, target: '_blank', rel: 'noopener' }, (principale.texte || 'Entrer') + ' ↗'))),
    h('div', { class: 'entrees' }, (jeu.entrees || []).filter((e) => !e.principal).map((e) => {
      const adresse = lien(jeu, e.chemin);
      return h('article', { class: 'porte' },
        h('h3', {}, e.texte),
        e.qr ? qr(adresse) : null,
        e.aide ? h('p', {}, e.aide) : null,
        h('code', {}, adresse.replace(/^https:\/\//, '')),
        h('a', { class: 'bouton', href: adresse, target: '_blank', rel: 'noopener' }, 'Ouvrir ↗'));
    })));
}

/*
 * Le cadenas : chaque jeu dit lui-même s'il est privé (/api/acces). Le code
 * n'est jamais écrit ici : il est demandé par le jeu, à son entrée.
 */
const acces = new Map(); // id du jeu → true (privé) / false (ouvert)
function badge(jeu, detail) {
  const el = h('span', { class: 'cadenas', 'data-acces': jeu.id, hidden: !acces.has(jeu.id) ? 'hidden' : null });
  peindre(el, jeu.id, detail);
  if (!acces.has(jeu.id)) demanderAcces(jeu);
  return el;
}
function peindre(el, id, detail) {
  if (!acces.has(id)) return;
  const prive = acces.get(id);
  el.hidden = false;
  el.classList.toggle('prive', prive);
  el.textContent = prive ? (detail ? '🔒 Privé : code demandé à l\'entrée' : '🔒 Privé') : '🔓 Ouvert';
}
const enCours = new Set();
function demanderAcces(jeu) {
  if (enCours.has(jeu.id)) return;
  enCours.add(jeu.id);
  fetch(lien(jeu, '/api/acces'), { cache: 'no-store' }).then((r) => r.json()).then((d) => {
    acces.set(jeu.id, !!(d && d.prive));
    document.querySelectorAll('[data-acces="' + jeu.id + '"]').forEach((el) => peindre(el, jeu.id, el.closest('.salle')));
  }).catch(() => {}).finally(() => enCours.delete(jeu.id));
}
setInterval(() => { acces.clear(); catalogue.jeux.forEach((j) => adresseSure(j.adresse) && demanderAcces(j)); }, 60000);

/* Les jeux hébergés gratuitement s'endorment : on les réveille dès qu'on entre dans leur salle. */
const reveilles = new Set();
function reveiller(jeu, etiquette) {
  const fini = () => { reveilles.add(jeu.id); etiquette.classList.add('pret'); etiquette.lastChild.textContent = 'Prêt ! Le jeu est réveillé.'; };
  if (reveilles.has(jeu.id)) return fini();
  const cible = lien(jeu, jeu.sante || '/');
  const essai = (n) => fetch(cible + (cible.includes('?') ? '&' : '?') + 't=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
    .then(fini).catch(() => { if (n < 6) setTimeout(() => essai(n + 1), 8000); else etiquette.lastChild.textContent = 'Le jeu ne répond pas encore : réessayez dans un instant.'; });
  essai(0);
}

/* ═══════════ L'aiguillage et la mise à jour automatique ═══════════ */

function afficher(nouveaux) {
  const id = location.hash.replace('#', '');
  const index = catalogue.jeux.findIndex((j) => j.id === id && adresseSure(j.adresse));
  const zone = document.getElementById('contenu');
  if (index >= 0) {
    zone.replaceChildren(pageJeu(catalogue.jeux[index], index));
    document.title = catalogue.jeux[index].nom + ' · Neuro\'Mania';
  } else {
    zone.replaceChildren(pageAccueil(nouveaux || new Set()));
    document.title = 'Neuro\'Mania';
    dessinerReseau();
  }
}
window.addEventListener('hashchange', () => { afficher(); window.scrollTo(0, 0); });

let dernierTexte = null;
function charger() {
  return fetch('catalogue.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.text()).then((texte) => {
    if (texte === dernierTexte) return;
    let lu;
    try { lu = JSON.parse(texte); } catch (e) { return; } // un catalogue mal écrit : on garde l'affichage actuel
    if (!lu || !Array.isArray(lu.jeux)) return;
    dernierTexte = texte;
    catalogue = lu;
    const ids = new Set(lu.jeux.map((j) => j.id));
    const nouveaux = new Set(dejaVus ? [...ids].filter((i) => !dejaVus.has(i)) : []);
    // Dans la salle d'un jeu, on ne redessine pas tout (le lien ou les QR codes restent en place) ; on prévient seulement.
    const dansUneSalle = dejaVus && lu.jeux.some((j) => j.id === location.hash.slice(1));
    if (!dansUneSalle) afficher(nouveaux);
    if (nouveaux.size) annoncer('✨ Nouveau chapitre : ' + lu.jeux.filter((j) => nouveaux.has(j.id)).map((j) => j.nom).join(', '));
    dejaVus = ids;
  }).catch(() => {});
}
charger().then(() => { if (!dejaVus) document.getElementById('contenu').replaceChildren(h('p', { class: 'etat' }, 'Impossible de lire la liste des jeux pour le moment. Réessayez dans un instant.')); });
setInterval(charger, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') charger(); });

let minuterie;
function annoncer(texte) {
  const el = document.getElementById('annonce');
  el.textContent = texte; el.classList.add('visible');
  clearTimeout(minuterie); minuterie = setTimeout(() => el.classList.remove('visible'), 5000);
}

/* Le réseau de neurones derrière le grand titre (dessin fixe, quelques influx qui courent). */
let animation = null;
function dessinerReseau() {
  const svg = document.getElementById('reseau');
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const L = 1100, H = 480;
  svg.setAttribute('viewBox', '0 0 ' + L + ' ' + H);
  let graine = 11;
  const alea = () => ((graine = (graine * 16807) % 2147483647) / 2147483647);
  const points = Array.from({ length: 24 }, () => ({ x: 30 + alea() * (L - 60), y: 24 + alea() * (H - 48) }));
  const liens = [];
  points.forEach((a, i) => points.map((b, j) => ({ j, d: Math.hypot(a.x - b.x, a.y - b.y) })).filter((o) => o.j > i).sort((u, v) => u.d - v.d).slice(0, 2).forEach((o) => liens.push([a, points[o.j]])));
  const el = (nom, at) => { const e = document.createElementNS(NS, nom); Object.entries(at).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
  liens.forEach(([a, b]) => svg.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y })));
  points.forEach((p, i) => svg.appendChild(el('circle', { cx: p.x, cy: p.y, r: i % 5 === 0 ? 6 : 3.5 })));
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const influx = Array.from({ length: 5 }, () => { const c = el('circle', { r: 3.2, class: 'influx' }); svg.appendChild(c); return { c, t: 1 }; });
  cancelAnimationFrame(animation);
  (function anime() {
    if (!svg.isConnected) return;
    if (!document.hidden) influx.forEach((f) => {
      if (f.t >= 1) { f.lien = liens[Math.floor(Math.random() * liens.length)]; f.t = 0; f.v = .004 + Math.random() * .006; }
      f.t += f.v; const [a, b] = f.lien;
      f.c.setAttribute('cx', a.x + (b.x - a.x) * f.t); f.c.setAttribute('cy', a.y + (b.y - a.y) * f.t);
    });
    animation = requestAnimationFrame(anime);
  })();
}
</script>
