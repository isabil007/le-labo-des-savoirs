<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuro'Mania</title>
<meta name="description" content="Neuro'Mania : des jeux et des programmes pour faire travailler les neurones, en famille.">
<meta name="theme-color" content="#120F2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lilita+One&display=swap">
<!--
  ════════════════════════════════════════════════════════════════════
   NEURO'MANIA — la page d'accueil de tous les programmes
  ════════════════════════════════════════════════════════════════════

  Cette page ne contient AUCUN programme elle-même : elle lit la liste
  dans neuromania/catalogue.json (via /api/catalogue), puis reste à
  l'écoute (/api/catalogue/flux). Quand le catalogue change — un thème
  ou un programme ajouté, le site republié —, le serveur prévient toutes
  les pages ouvertes, qui se redessinent seules : personne n'a besoin
  de rafraîchir. Un programme qui vient d'apparaître est mis en avant.
-->
<style>
  :root {
    --nuit: #120F2E;
    --nuit-2: #1C1844;
    --nuit-3: #2A2563;
    --trait: #3B3580;
    --papier: #F5F3FF;
    --brume: #B3ADDF;
    --tournesol: #FFC93C;
    --corail: #FF6B5B;
    --menthe: #3DD6B5;
    --lilas: #9B8CFF;
    --rose: #FF5FA2;
    --cyan: #3DE0F0;
    --sur-couleur: #120F2E;
    --police-titre: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --police-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --rayon: 22px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; overflow-x: clip; }
  body {
    margin: 0; min-height: 100vh; background: var(--nuit); color: var(--papier);
    font-family: var(--police-texte); font-size: 18px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  h1, h2, h3 { font-family: var(--police-titre); font-weight: 400; line-height: 1.08; margin: 0; letter-spacing: .01em; text-wrap: balance; }
  a { color: inherit; }
  .page { width: min(1180px, 100% - 32px); margin-inline: auto; }
  :focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 10px; }

  /* ─── Le bandeau du haut ─── */
  .bandeau { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
  .marque { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--police-titre); font-size: 1.5rem; }
  .marque b { color: var(--rose); font-weight: 400; }
  .direct { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--nuit-2); border: 1px solid var(--trait); color: var(--brume); font-size: .85rem; font-weight: 700; white-space: nowrap; }
  .direct i { width: 9px; height: 9px; border-radius: 50%; background: #6E68A8; }
  .direct.allume i { background: var(--menthe); box-shadow: 0 0 0 0 rgba(61, 214, 181, .7); animation: battement 2.2s infinite; }
  @keyframes battement { 0% { box-shadow: 0 0 0 0 rgba(61, 214, 181, .6); } 70% { box-shadow: 0 0 0 9px rgba(61, 214, 181, 0); } 100% { box-shadow: 0 0 0 0 rgba(61, 214, 181, 0); } }

  /* ─── Le grand titre, sur un réseau de neurones qui s'allume ─── */
  .entree { position: relative; overflow: clip; padding: clamp(36px, 7vw, 84px) 0 clamp(30px, 5vw, 56px); isolation: isolate; }
  .reseau { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
  .reseau line { stroke: var(--trait); stroke-width: 1.4; }
  .reseau circle { fill: var(--nuit-3); stroke: var(--lilas); stroke-width: 1.4; }
  .reseau .influx { fill: var(--cyan); stroke: none; filter: drop-shadow(0 0 6px var(--cyan)); }
  .surtitre { display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; }
  .entree h1 { font-size: clamp(3rem, 11vw, 7.2rem); }
  .entree h1 .apostrophe { color: var(--rose); }
  .entree h1 .mania { background: linear-gradient(100deg, var(--tournesol), var(--rose) 55%, var(--lilas)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .accroche { max-width: 40ch; font-size: clamp(1.1rem, 2.4vw, 1.4rem); color: var(--brume); margin: 18px 0 0; }

  /* ─── Les pastilles des thèmes (pour sauter directement à l'un d'eux) ─── */
  .sommaire { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .sommaire a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; text-decoration: none; font-weight: 700; background: var(--nuit-2); border: 1px solid var(--trait); transition: border-color .2s, transform .2s; }
  .sommaire a:hover { border-color: var(--c); transform: translateY(-2px); }
  .sommaire small { color: var(--brume); font-weight: 400; }

  /* ─── Les thèmes et leurs cartes ─── */
  .theme { padding-block: 34px; border-top: 1px solid var(--trait); scroll-margin-top: 12px; }
  .theme-tete { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .theme-icone { width: 62px; height: 62px; flex: none; display: grid; place-items: center; font-size: 2rem; border-radius: 18px; background: color-mix(in srgb, var(--c) 18%, var(--nuit-2)); border: 2px solid var(--c); }
  .theme h2 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); color: var(--c); }
  .theme-tete p { margin: 4px 0 0; color: var(--brume); }
  .cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
  .carte { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; padding: 24px; border-radius: var(--rayon); background: var(--nuit-2); border: 1px solid var(--trait); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: transform .25s, border-color .25s; }
  .carte:hover { transform: translateY(-3px); border-color: var(--c); }
  .carte-tete { display: flex; align-items: center; gap: 14px; }
  .carte-icone { font-size: 2.6rem; line-height: 1; }
  .carte h3 { font-size: 1.55rem; }
  .devise { margin: 2px 0 0; color: var(--c); font-weight: 700; font-size: .95rem; }
  .carte > p { margin: 0; color: var(--brume); }
  .etiquettes { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .etiquettes li { padding: 3px 10px; border-radius: 999px; background: var(--nuit-3); font-size: .82rem; font-weight: 700; color: var(--papier); }
  .liens { display: flex; flex-wrap: wrap; gap: 8px; align-self: end; }
  .bouton { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 16px; border-radius: 14px; text-decoration: none; font-weight: 700; border: 2px solid var(--trait); transition: background .2s, border-color .2s; }
  .bouton:hover { border-color: var(--c); }
  .bouton.principal { background: var(--c); border-color: var(--c); color: var(--sur-couleur); }
  .bouton.principal:hover { filter: brightness(1.08); }
  .badge-nouveau { position: absolute; top: -11px; right: 18px; padding: 4px 12px; border-radius: 999px; background: var(--rose); color: #fff; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 4px 12px rgba(255, 95, 162, .45); }
  .carte.vient-d-arriver { animation: arrivee 1.4s cubic-bezier(.2, 1.4, .4, 1); border-color: var(--rose); }
  @keyframes arrivee { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: none; } }
  .bientot { display: grid; place-items: center; text-align: center; min-height: 180px; padding: 24px; border-radius: var(--rayon); border: 2px dashed var(--trait); color: var(--brume); }
  .bientot span { font-size: 2rem; display: block; margin-bottom: 6px; }

  /* ─── Messages ─── */
  .etat { padding: 60px 0; text-align: center; color: var(--brume); }
  .annonce { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); width: max-content; max-width: calc(100% - 32px); padding: 14px 20px; border-radius: 16px; background: var(--papier); color: var(--sur-couleur); font-weight: 700; box-shadow: 0 14px 40px rgba(0, 0, 0, .45); transition: transform .45s cubic-bezier(.2, 1.4, .4, 1); z-index: 10; }
  .annonce.visible { transform: translate(-50%, 0); }
  .pied { padding: 40px 0 56px; border-top: 1px solid var(--trait); color: var(--brume); font-size: .95rem; }
  .pied p { margin: 0; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
  <header class="page bandeau">
    <a class="marque" href="/" aria-label="Neuro'Mania, accueil"><span aria-hidden="true">🧠</span><span>Neuro<b>'</b>Mania</span></a>
    <span class="direct" id="direct" role="status"><i aria-hidden="true"></i><span>Connexion…</span></span>
  </header>

  <main>
    <section class="page entree">
      <svg class="reseau" id="reseau" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
      <span class="surtitre">Jeux &amp; programmes</span>
      <h1>Neuro<span class="apostrophe">'</span><span class="mania">Mania</span></h1>
      <p class="accroche">Des jeux et des programmes pour faire travailler les neurones, en famille. Choisissez un thème et lancez-vous !</p>
      <nav class="sommaire" id="sommaire" aria-label="Les thèmes"></nav>
    </section>
    <div class="page" id="themes"><p class="etat">Chargement des thèmes…</p></div>
  </main>

  <footer class="page pied">
    <p><strong>Neuro'Mania</strong> · cette page se met à jour toute seule : un nouveau programme apparaît dès qu'il est publié.</p>
  </footer>

  <div class="annonce" id="annonce" role="status" aria-live="polite"></div>

<script>
'use strict';

/* Une petite fabrique d'éléments : tout le texte passe par textContent (jamais de HTML injecté). */
function h(nom, attributs, ...enfants) {
  const el = document.createElement(nom);
  Object.entries(attributs || {}).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'style') el.style.cssText = v; else el.setAttribute(k, v);
  });
  enfants.flat().forEach((e) => { if (e != null && e !== false) el.append(e instanceof Node ? e : document.createTextNode(String(e))); });
  return el;
}

const COULEURS = ['tournesol', 'rose', 'menthe', 'lilas', 'cyan', 'corail'];
const couleurDe = (theme, i) => 'var(--' + (COULEURS.includes(theme.couleur) ? theme.couleur : COULEURS[i % COULEURS.length]) + ')';
// Seules les adresses du site lui-même (/…) et les liens https sont acceptés.
const adresseSure = (a) => (typeof a === 'string' && (/^\/(?!\/)/.test(a) || /^https:\/\//.test(a)) ? a : null);

/* ═══════════ Le dessin des thèmes ═══════════ */

let dejaVus = null; // les programmes déjà affichés : pour repérer les nouveaux

function carte(p, couleur, vientDArriver) {
  const liens = (p.liens || []).map((l) => {
    const adresse = adresseSure(l.adresse);
    if (!adresse) return null;
    const dehors = adresse.startsWith('https://');
    return h('a', { class: 'bouton' + (l.principal ? ' principal' : ''), href: adresse, target: dehors ? '_blank' : null, rel: dehors ? 'noopener' : null }, l.texte || 'Ouvrir');
  });
  return h('article', { class: 'carte' + (vientDArriver ? ' vient-d-arriver' : ''), style: '--c:' + couleur, id: 'programme-' + p.id },
    p.nouveau ? h('span', { class: 'badge-nouveau' }, 'Nouveau') : null,
    h('div', { class: 'carte-tete' },
      h('span', { class: 'carte-icone', 'aria-hidden': 'true' }, p.icone || '✨'),
      h('div', {}, h('h3', {}, p.nom || 'Programme'), p.devise ? h('p', { class: 'devise' }, p.devise) : null)),
    p.description ? h('p', {}, p.description) : h('span'),
    h('div', { style: 'display:grid;gap:14px' },
      (p.etiquettes || []).length ? h('ul', { class: 'etiquettes' }, p.etiquettes.map((e) => h('li', {}, e))) : null,
      h('div', { class: 'liens' }, liens)));
}

function dessiner(catalogue) {
  const themes = Array.isArray(catalogue && catalogue.themes) ? catalogue.themes : [];
  const nouveaux = [];
  const vus = new Set();
  const zone = document.getElementById('themes');
  const sommaire = document.getElementById('sommaire');

  const sections = themes.map((t, i) => {
    const couleur = couleurDe(t, i);
    const programmes = Array.isArray(t.programmes) ? t.programmes : [];
    const cartes = programmes.map((p) => {
      const cle = t.id + '/' + p.id;
      vus.add(cle);
      const neuf = dejaVus && !dejaVus.has(cle);
      if (neuf) nouveaux.push(p);
      return carte(p, couleur, neuf);
    });
    return h('section', { class: 'theme', id: 'theme-' + t.id, style: '--c:' + couleur, 'aria-labelledby': 'titre-' + t.id },
      h('div', { class: 'theme-tete' },
        h('span', { class: 'theme-icone', 'aria-hidden': 'true' }, t.icone || '✨'),
        h('div', {}, h('h2', { id: 'titre-' + t.id }, t.nom || 'Thème'), t.description ? h('p', {}, t.description) : null)),
      h('div', { class: 'cartes' }, cartes.length ? cartes : h('div', { class: 'bientot' }, h('p', {}, h('span', { 'aria-hidden': 'true' }, '🌱'), 'Bientôt de nouveaux programmes ici…'))));
  });

  zone.replaceChildren(...(sections.length ? sections : [h('p', { class: 'etat' }, 'Les premiers thèmes arrivent bientôt…')]));
  sommaire.replaceChildren(...themes.map((t, i) => h('a', { href: '#theme-' + t.id, style: '--c:' + couleurDe(t, i) },
    h('span', { 'aria-hidden': 'true' }, t.icone || '✨'), t.nom || 'Thème',
    h('small', {}, String((t.programmes || []).length)))));

  if (nouveaux.length) annoncer('✨ Nouveau sur Neuro\'Mania : ' + nouveaux.map((p) => (p.icone ? p.icone + ' ' : '') + p.nom).join(', '));
  else if (dejaVus) annoncer('🔄 Neuro\'Mania vient d\'être mis à jour');
  dejaVus = vus;
}

let minuterieAnnonce;
function annoncer(texte) {
  const el = document.getElementById('annonce');
  el.textContent = texte;
  el.classList.add('visible');
  clearTimeout(minuterieAnnonce);
  minuterieAnnonce = setTimeout(() => el.classList.remove('visible'), 6000);
}

/* ═══════════ L'écoute en direct ═══════════ */

let dernierTexte = null;
function recevoir(texte) {
  if (texte === dernierTexte) return; // rien n'a changé (par exemple après une simple reconnexion)
  dernierTexte = texte;
  try { dessiner(JSON.parse(texte)); } catch (e) { /* message abîmé : on garde l'affichage actuel */ }
}

function etatDirect(allume) {
  const el = document.getElementById('direct');
  el.classList.toggle('allume', allume);
  el.lastElementChild.textContent = allume ? 'En direct' : 'Reconnexion…';
  el.title = allume ? 'Cette page se met à jour toute seule' : 'La page essaie de se reconnecter';
}

function ecouter() {
  if (!('EventSource' in window)) return sonder();
  const flux = new EventSource('/api/catalogue/flux');
  flux.addEventListener('catalogue', (ev) => { etatDirect(true); recevoir(ev.data); });
  flux.onopen = () => etatDirect(true);
  flux.onerror = () => etatDirect(false); // le navigateur se reconnecte tout seul (le site en ligne peut redémarrer)
}

/* Pour les très vieux navigateurs : on redemande la liste toutes les 30 secondes. */
function sonder() {
  const demander = () => fetch('/api/catalogue', { cache: 'no-store' })
    .then((r) => r.text()).then((t) => { etatDirect(true); recevoir(t); })
    .catch(() => etatDirect(false));
  demander();
  setInterval(demander, 30000);
}

// Quand on revient sur l'onglet après un long moment, on vérifie aussitôt.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetch('/api/catalogue', { cache: 'no-store' }).then((r) => r.text()).then(recevoir).catch(() => {});
});

if (location.protocol === 'file:') {
  document.getElementById('themes').replaceChildren(h('p', { class: 'etat' }, 'Cette page doit être ouverte depuis le site Neuro\'Mania (ou le jeu lancé sur l\'ordinateur), pas directement depuis le dossier.'));
} else {
  ecouter();
}

/* ═══════════ Le réseau de neurones du grand titre ═══════════ */

(function reseau() {
  const svg = document.getElementById('reseau');
  const NS = 'http://www.w3.org/2000/svg';
  const L = 1200, H = 520;
  svg.setAttribute('viewBox', '0 0 ' + L + ' ' + H);
  // Des points répartis toujours de la même façon (pas de hasard : le dessin reste stable).
  let graine = 7;
  const alea = () => ((graine = (graine * 16807) % 2147483647) / 2147483647);
  const points = Array.from({ length: 26 }, () => ({ x: 40 + alea() * (L - 80), y: 30 + alea() * (H - 60) }));
  const liens = [];
  points.forEach((a, i) => {
    points.map((b, j) => ({ j, d: Math.hypot(a.x - b.x, a.y - b.y) })).filter((o) => o.j > i).sort((u, v) => u.d - v.d).slice(0, 2)
      .forEach((o) => liens.push([a, points[o.j]]));
  });
  const el = (nom, at) => { const e = document.createElementNS(NS, nom); Object.entries(at).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
  liens.forEach(([a, b]) => svg.appendChild(el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y })));
  points.forEach((p, i) => svg.appendChild(el('circle', { cx: p.x, cy: p.y, r: i % 5 === 0 ? 7 : 4 })));
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // Quelques influx nerveux qui courent le long des connexions.
  const influx = Array.from({ length: 5 }, () => { const c = el('circle', { r: 3.5, class: 'influx' }); svg.appendChild(c); return { c, lien: null, t: 1 }; });
  (function anime() {
    if (!document.hidden) influx.forEach((f) => {
      if (f.t >= 1) { f.lien = liens[Math.floor(Math.random() * liens.length)]; f.t = 0; f.v = .004 + Math.random() * .006; }
      f.t += f.v;
      const [a, b] = f.lien;
      f.c.setAttribute('cx', a.x + (b.x - a.x) * f.t);
      f.c.setAttribute('cy', a.y + (b.y - a.y) * f.t);
    });
    requestAnimationFrame(anime);
  })();
})();
</script>
</body>
</html>
