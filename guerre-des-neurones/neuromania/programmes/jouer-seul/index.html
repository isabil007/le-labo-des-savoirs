        finale, multiplicateur: salle.multiplicateur, prime: PRIME_DEFI * salle.multiplicateur,
        inattendu: salle.inattendu
      };
      this.ecranTablette(salle, 'intro', Object.assign({}, commun, { finA, dureeMs: this.introMs, defis: Array.from(salle.defis.values()) }));
      salle.joueurs.forEach((j) => this.ecranJoueur(salle, j.id, 'intro', Object.assign({}, commun, {
        defi: salle.defis.get(j.id) || null, gage: j.gage || null, premiereManche: salle.index === 0,
        // « moi » : le défi inattendu me concerne-t-il ? (désigné, ou adversaire du duel)
        inattenduPourMoi: salle.inattendu && (salle.inattendu.joueur.id === j.id || (salle.inattendu.adversaire && salle.inattendu.adversaire.id === j.id)) ? true : false
      })));
      if (salle.inattendu) {
        const ids = [salle.inattendu.joueur.id].concat(salle.inattendu.adversaire ? [salle.inattendu.adversaire.id] : []);
        ids.forEach((id) => salle.ctx.evenementJoueur(id, 'inattendu', salle.inattendu));
      }
      this.diffuserEtat(salle);
      salle.minuteurIntro = setTimeout(() => this.demarrerJeu(salle), this.introMs);
    }

    demarrerJeu(salle) {
      clearTimeout(salle.minuteurIntro);
      if (salle.etat !== 'intro') return;
      const Classe = JEUX[salle.programme[salle.index]];
      salle.etat = 'jeu';
      salle.joueurs.forEach((j) => { j.scoreAvant = j.score; });
      salle.jeu = new Classe(salle.ctx);
      salle.jeu.demarrer();
      this.diffuserEtat(salle);
    }

    estFinale(salle, index) {
      return salle.finaleIndex !== null && salle.finaleIndex !== undefined && index === salle.finaleIndex;
    }

    /*
     * La fabrique des défis. On range les joueurs du meilleur score au
     * moins bon, puis on donne à chacun sa mission :
     *   « depasser » : doubler le joueur le plus proche devant soi ;
     *   « couronne » : rester (ou devenir) seul en tête ;
     *   « manche »   : quand tout le monde est à égalité, finir dans la
     *                  moitié haute des scores de la manche.
     * Le texte du défi est préparé ici, pour que téléphones et tablette
     * affichent exactement la même phrase.
     */
    preparerDefis(salle) {
      const defis = new Map();
      const presents = this.joueursPresents(salle);
      if (presents.length < 2) return defis;
      const tousEgaux = presents.every((j) => j.score === presents[0].score);
      const rangVise = Math.max(1, Math.floor(presents.length / 2));
      presents.forEach((j) => {
        let defi;
        if (tousEgaux) {
          defi = { type: 'manche', rangVise, texte: rangVise === 1 ? 'Fais le meilleur score de cette manche !' : 'Termine dans les ' + rangVise + ' meilleurs de cette manche !' };
        } else {
          // Le plus proche devant moi : le plus petit score qui reste strictement supérieur au mien.
          const devant = presents.filter((x) => x.score > j.score).sort((a, b) => a.score - b.score)[0];
          if (devant) {
            const ecart = devant.score - j.score;
            defi = { type: 'depasser', cibleId: devant.id, cibleNom: devant.nom, cibleAvatar: devant.avatar, ecart, texte: 'Dépasse ' + devant.avatar + ' ' + devant.nom + ' : ' + ecart + ' points d\'écart !' };
          } else {
            const exAequo = presents.some((x) => x.id !== j.id && x.score === j.score);
            defi = { type: 'couronne', texte: exAequo ? 'Prends seul·e la tête de la table !' : 'Défends ta couronne : reste en tête !' };
          }
        }
        defis.set(j.id, Object.assign({ joueurId: j.id, nom: j.nom, avatar: j.avatar, enAvance: false }, defi));
      });
      return defis;
    }

    /*
     * Pendant le jeu, après chaque gain de points, on regarde qui vient
     * de passer devant sa cible (ou de se faire rattraper). On attend un
     * court instant avant de vérifier : quand un quiz distribue les points
     * de toute la table d'un coup, on ne veut annoncer que le résultat
     * final, pas une cascade de dépassements qui s'annulent.
     */
    prevoirVerificationDefis(salle) {
      if (salle.verificationPrevue || salle.etat !== 'jeu') return;
      salle.verificationPrevue = true;
      setTimeout(() => { salle.verificationPrevue = false; if (salle.etat === 'jeu') this.verifierDefis(salle); }, 50);
    }

    verifierDefis(salle) {
      salle.defis.forEach((defi) => {
        if (defi.type !== 'depasser') return;
        const j = salle.joueurs.get(defi.joueurId);
        const cible = salle.joueurs.get(defi.cibleId);
        if (!j || !cible) return;
        const devant = j.score > cible.score;
        if (devant === defi.enAvance) return;
        defi.enAvance = devant;
        const ctx = salle.ctx;
        if (devant) {
          ctx.evenementJoueur(j.id, 'cible-depassee', { cibleNom: cible.nom, cibleAvatar: cible.avatar });
          ctx.evenementJoueur(cible.id, 'depasse-par', { nom: j.nom, avatar: j.avatar });
          ctx.evenementTablette('cible-depassee', { nom: j.nom, avatar: j.avatar, cibleNom: cible.nom, cibleAvatar: cible.avatar });
        } else {
          ctx.evenementJoueur(j.id, 'cible-reprise', { cibleNom: cible.nom, cibleAvatar: cible.avatar });
        }
      });
    }

    /*
     * À la fin de la manche, on juge chaque défi et on verse les primes
     * (doublées en finale). Le résultat part avec le classement.
     */
    jugerDefis(salle) {
      const resultats = new Map();
      const presents = this.joueursPresents(salle);
      const gain = (j) => j.score - (j.scoreAvant || 0);
      const prime = PRIME_DEFI * salle.multiplicateur;
      salle.defis.forEach((defi) => {
        const j = salle.joueurs.get(defi.joueurId);
        if (!j) return;
        let reussi = false;
        if (defi.type === 'depasser') {
          const cible = salle.joueurs.get(defi.cibleId);
          reussi = !!cible && j.score > cible.score;
        } else if (defi.type === 'couronne') {
          reussi = presents.every((x) => x.id === j.id || x.score < j.score);
        } else if (defi.type === 'manche') {
          const devant = presents.filter((x) => gain(x) > gain(j)).length;
          reussi = gain(j) > 0 && devant < defi.rangVise;
        }
        if (reussi) j.defisReussis = (j.defisReussis || 0) + 1;
        resultats.set(j.id, { joueurId: j.id, nom: j.nom, avatar: j.avatar, texte: defi.texte, reussi, prime: reussi ? prime : 0 });
      });
      // Les primes sont versées après le jugement de tous, pour que l'ordre n'avantage personne.
      resultats.forEach((r) => { if (r.reussi) salle.joueurs.get(r.joueurId).score += r.prime; });
      salle.defis = new Map();
      return resultats;
    }

    /* ═══════════ Le tribunal des gages ═══════════ */

    gagesEnAttente(salle) {
      return !salle.gagesJuges && this.joueursPresents(salle).filter((j) => j.gage).length >= 2;
    }

    /* Après la dernière manche : le tribunal des gages s'il y a lieu, sinon directement le podium. */
    finDePartie(salle) {
      this.arreterJeu(salle);
      if (!this.gagesEnAttente(salle)) return this.podium(salle);
      salle.etat = 'gages';
      salle.multiplicateur = 1;
      salle.fileGages = outils.melanger(this.joueursPresents(salle).filter((j) => j.gage).map((j) => j.id));
      salle.indexGage = -1;
      this.gageSuivant(salle);
    }

    /* On révèle le gage suivant ; tous les autres votent. */
    gageSuivant(salle) {
      clearTimeout(salle.minuteurGage);
      salle.indexGage++;
      if (salle.indexGage >= salle.fileGages.length) return this.podium(salle);
      const accuse = salle.joueurs.get(salle.fileGages[salle.indexGage]);
      if (!accuse) return this.gageSuivant(salle);
      salle.phaseGage = 'vote';
      salle.votes = new Map();
      const votants = this.joueursPresents(salle).filter((j) => j.id !== accuse.id);
      const finA = Date.now() + this.voteMs;
      const commun = { accuse: { id: accuse.id, nom: accuse.nom, avatar: accuse.avatar }, gage: accuse.gage, numero: salle.indexGage + 1, total: salle.fileGages.length, finA, dureeMs: this.voteMs, prime: PRIME_GAGE };
      this.ecranTablette(salle, 'gages-vote', Object.assign({}, commun, { nbVotes: 0, nbVotants: votants.length }));
      this.joueursPresents(salle).forEach((j) => this.ecranJoueur(salle, j.id, j.id === accuse.id ? 'gage-accuse' : 'gage-vote', commun));
      this.diffuserEtat(salle);
      salle.minuteurGage = setTimeout(() => this.jugerGage(salle), this.voteMs + 200);
    }

    voterGage(salle, joueurId, d) {
      if (salle.phaseGage !== 'vote' || !d || d.type !== 'vote') return;
      const accuseId = salle.fileGages[salle.indexGage];
      if (joueurId === accuseId || salle.votes.has(joueurId)) return;
      salle.votes.set(joueurId, !!d.reussi);
      this.ecranJoueur(salle, joueurId, 'info', { titre: 'A voté ! 🗳️', texte: 'Le verdict tombe dans un instant… Regarde la tablette.' });
      const votants = this.joueursPresents(salle).filter((j) => j.id !== accuseId).length;
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'evenement', { type: 'vote-gage', donnees: { nbVotes: salle.votes.size, nbVotants: votants } });
      if (salle.votes.size >= votants) { clearTimeout(salle.minuteurGage); salle.minuteurGage = setTimeout(() => this.jugerGage(salle), 600); }
    }

    /* Le verdict : majorité de « réussi » → la prime, et le classement bouge sous les yeux de tous. */
    jugerGage(salle) {
      if (salle.etat !== 'gages' || salle.phaseGage !== 'vote') return;
      clearTimeout(salle.minuteurGage);
      salle.phaseGage = 'verdict';
      const accuse = salle.joueurs.get(salle.fileGages[salle.indexGage]);
      const votes = Array.from(salle.votes.values());
      const oui = votes.filter(Boolean).length, non = votes.length - oui;
      const reussi = !!accuse && oui > non;
      const rangAvant = accuse ? this.classement(salle).findIndex((c) => c.id === accuse.id) + 1 : 0;
      if (reussi) { accuse.score += PRIME_GAGE; accuse.gageReussi = true; accuse.gageOui = oui; }
      const classement = this.classement(salle);
      const rangApres = accuse ? classement.findIndex((c) => c.id === accuse.id) + 1 : 0;
      const dernier = salle.indexGage + 1 >= salle.fileGages.length;
      this.ecranTablette(salle, 'gages-verdict', {
        accuse: accuse ? { id: accuse.id, nom: accuse.nom, avatar: accuse.avatar } : null, gage: accuse ? accuse.gage : '',
        reussi, oui, non, prime: PRIME_GAGE, classement, rangAvant, rangApres, dernier, numero: salle.indexGage + 1, total: salle.fileGages.length
      });
      this.joueursPresents(salle).forEach((j) => {
        if (accuse && j.id === accuse.id) this.ecranJoueur(salle, j.id, 'info', reussi
          ? { titre: '🎉 Gage validé ! +' + PRIME_GAGE, texte: rangApres < rangAvant ? 'Tu passes ' + (rangApres === 1 ? '1er' : rangApres + 'e') + ' ! Quel agent secret…' : 'La table a reconnu ton talent.', score: j.score }
          : { titre: '😅 Gage refusé…', texte: oui === non && votes.length ? 'Égalité des votes : le doute ne profite à personne !' : 'La table n\'a rien vu… ou fait semblant.', score: j.score });
        else this.ecranJoueur(salle, j.id, 'info', { titre: reussi ? '✅ Gage réussi pour ' + accuse.avatar + ' ' + accuse.nom : '❌ Gage raté pour ' + (accuse ? accuse.avatar + ' ' + accuse.nom : '…'), texte: oui + ' oui · ' + non + ' non', score: j.score });
      });
      this.diffuserEtat(salle);
      salle.minuteurGage = setTimeout(() => this.gageSuivant(salle), this.verdictMs);
    }

    arreterJeu(salle) {
      clearTimeout(salle.minuteurClassement);
      clearTimeout(salle.minuteurGage);
      clearTimeout(salle.minuteurIntro);
      if (salle.jeu) { salle.jeu.arreter(); salle.jeu = null; }
    }

    classement(salle) {
      return Array.from(salle.joueurs.values())
        .map((j) => ({ id: j.id, nom: j.nom, avatar: j.avatar, score: j.score, gain: j.score - (j.scoreAvant || 0), connecte: j.connecte }))
        .sort((a, b) => b.score - a.score);
    }

    finJeu(salle) {
      this.arreterJeu(salle);
      salle.etat = 'classement';
      const defis = this.jugerDefis(salle);
      const resultatInattendu = this.resoudreInattendu(salle);
      const classement = this.classement(salle);
      // On retient la plus belle manche de chacun, pour les prix du podium.
      classement.forEach((c) => { const j = salle.joueurs.get(c.id); if (j && c.gain > (j.meilleureManche || 0)) j.meilleureManche = c.gain; });

      // Partie surprise : faut-il déclencher la Grande Finale ? Puis on tire le jeu suivant.
      let annonceFinale = null;
      if (salle.mode === 'surprise' && salle.index !== salle.finaleIndex) {
        const manchesJouees = salle.index + 1;
        const tete = classement[0];
        if (tete && tete.score >= salle.objectif && manchesJouees >= MANCHES_AVANT_FINALE) {
          annonceFinale = { type: 'objectif', texte: this.remplir(outils.tirer(COMMENTAIRES.finaleObjectif, 1)[0], this.variables(salle, classement)) };
        } else if (manchesJouees >= MANCHES_MAX - 1) {
          annonceFinale = { type: 'limite', texte: this.remplir(outils.tirer(COMMENTAIRES.finaleLimite, 1)[0], this.variables(salle, classement)) };
        }
        if (annonceFinale) salle.finaleIndex = salle.index + 1;
        salle.programme.push(this.tirerJeu(salle));
      }

      const dernier = salle.index + 1 >= salle.programme.length;
      const prochain = dernier ? null : JEUX[salle.programme[salle.index + 1]].fiche;
      const prochainFinale = !dernier && this.estFinale(salle, salle.index + 1);
      const reussis = Array.from(defis.values()).filter((r) => r.reussi);
      const commentaires = this.commenter(salle, classement);
      const surprise = salle.mode === 'surprise';
      this.ecranTablette(salle, 'classement', {
        classement, numero: salle.index + 1, total: surprise ? null : salle.programme.length, dernier, prochain: surprise ? null : prochain,
        prochainFinale, defisReussis: reussis, nbDefis: defis.size,
        surprise, objectif: salle.objectif, annonceFinale, commentaires,
        tribunal: dernier && this.gagesEnAttente(salle),
        resultatInattendu,
        // L'enchaînement automatique : la suite démarre toute seule à cette heure-là.
        autoFinA: Date.now() + this.classementMs, autoMs: this.classementMs
      });
      const top = classement.slice(0, 3).map((c) => ({ nom: c.nom, avatar: c.avatar, score: c.score }));
      classement.forEach((c, rang) => this.ecranJoueur(salle, c.id, 'classement', {
        top, commentaires, prochainNom: prochain && !surprise ? prochain.icone + ' ' + prochain.nom : null,
        rang: rang + 1, score: c.score, gain: c.gain, nbJoueurs: classement.length, defi: defis.get(c.id) || null, prochainFinale,
        objectif: salle.objectif, annonceFinale: annonceFinale ? annonceFinale.texte : null,
        gage: (salle.joueurs.get(c.id) || {}).gage || null,
        resultatInattendu: resultatInattendu && resultatInattendu.concerne.includes(c.id) ? resultatInattendu : null
      }));
      this.diffuserEtat(salle);
      salle.enPause = false;
      salle.minuteurClassement = setTimeout(() => { if (salle.etat === 'classement') this.jeuSuivant(salle); }, this.classementMs);
    }

    /* L'animateur veut souffler : le classement reste affiché jusqu'à ce qu'il touche « suivant ». */
    /*
     * LA VRAIE PAUSE ⏸ : le jeu en cours se fige (voir Jeu.figer), tout
     * comme l'attente de l'intro ou du classement. À la reprise, chaque
     * écran est renvoyé avec son compte à rebours décalé de la durée de
     * la pause : le joueur retrouve exactement le temps qu'il lui restait.
     */
    figer(salle) {
      if (salle.figeA || !['intro', 'jeu', 'classement'].includes(salle.etat)) return;
      salle.figeA = Date.now();
      clearTimeout(salle.minuteurIntro);
      clearTimeout(salle.minuteurClassement);
      if (salle.etat === 'jeu' && salle.jeu && salle.jeu.figer) salle.jeu.figer();
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'evenement', { type: 'fige', donnees: {} });
      salle.joueurs.forEach((j) => salle.ctx.evenementJoueur(j.id, 'fige', {}));
    }

    relancer(salle) {
      if (!salle.figeA) return;
      const duree = Date.now() - salle.figeA;
      salle.figeA = null;
      if (salle.etat === 'jeu' && salle.jeu && salle.jeu.relancer) salle.jeu.relancer(duree);
      if (salle.etat === 'intro') salle.minuteurIntro = setTimeout(() => this.demarrerJeu(salle), this.introMs);
      if (salle.etat === 'classement' && !salle.enPause) salle.minuteurClassement = setTimeout(() => { if (salle.etat === 'classement') this.jeuSuivant(salle); }, this.classementMs);
      // Les écrans gardés en mémoire : on décale leurs heures de fin, et on les renvoie.
      const decaler = (ecran) => {
        if (!ecran || !ecran.donnees) return;
        ['finA', 'autoFinA', 'debut'].forEach((cle) => { if (typeof ecran.donnees[cle] === 'number') ecran.donnees[cle] += duree; });
      };
      decaler(salle.dernierEcranTablette);
      if (salle.etat === 'intro' && salle.dernierEcranTablette && salle.dernierEcranTablette.donnees) salle.dernierEcranTablette.donnees.finA = Date.now() + this.introMs;
      if (salle.dernierEcranTablette && salle.tabletteId) this.envoyer(salle.tabletteId, 'ecran', Object.assign({ horloge: Date.now() }, salle.dernierEcranTablette));
      salle.joueurs.forEach((j) => {
        decaler(j.dernierEcran);
        if (j.dernierEcran && j.connecte) this.envoyer(j.connexionId, 'ecran', Object.assign({ horloge: Date.now() }, j.dernierEcran));
        salle.ctx.evenementJoueur(j.id, 'reprise', {});
      });
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'evenement', { type: 'reprise', donnees: {} });
    }

    mettreEnPause(salle) {
      if (salle.etat !== 'classement') return;
      clearTimeout(salle.minuteurClassement);
      salle.enPause = true;
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'evenement', { type: 'pause', donnees: {} });
    }

    /* ═══════════ Le défi inattendu 🎰 ═══════════ */

    /* Le sort décide s'il y a un défi inattendu, pour qui, et lequel. */
    tirerInattendu(salle) {
      const presents = this.joueursPresents(salle);
      if (presents.length < 2 || Math.random() >= this.probaInattendu) return null;
      // Jamais deux fois de suite le même joueur désigné.
      const candidats = presents.filter((j) => j.id !== salle.dernierDesigne);
      const elu = outils.tirer(candidats.length ? candidats : presents, 1)[0];
      salle.dernierDesigne = elu.id;
      const type = this.typeInattendu || outils.tirer(TYPES_INATTENDUS, 1)[0];
      const qui = (j) => ({ id: j.id, nom: j.nom, avatar: j.avatar });
      const base = { type, joueur: qui(elu), adversaire: null };
      if (type === 'quitte') return Object.assign(base, { icone: '🎰', titre: 'Quitte ou double !', texte: 'Fais le meilleur score de cette manche et tes points de la manche DOUBLENT. Sinon… tu en perds la moitié !' });
      if (type === 'trefle') return Object.assign(base, { icone: '🍀', titre: 'Trèfle à quatre feuilles !', texte: 'La chance te sourit : tous tes points de cette manche comptent double !' });
      const adversaire = outils.tirer(presents.filter((j) => j.id !== elu.id), 1)[0];
      return Object.assign(base, { icone: '⚔️', titre: 'Duel éclair !', adversaire: qui(adversaire), texte: 'Duel contre ' + adversaire.avatar + ' ' + adversaire.nom + ' : celui qui marque le plus pendant cette manche vole ' + ENJEU_DUEL + ' points à l\'autre !' });
    }

    /* À la fin de la manche : on règle les comptes du défi inattendu. */
    resoudreInattendu(salle) {
      const d = salle.inattendu;
      salle.inattendu = null;
      if (!d) return null;
      const j = salle.joueurs.get(d.joueur.id);
      if (!j) return null;
      const gain = (x) => x.score - (x.scoreAvant || 0);
      const nom = (x) => x.avatar + ' ' + x.nom;
      const r = { icone: d.icone, titre: d.titre, concerne: [j.id], reussi: false, texte: '' };
      if (d.type === 'trefle') {
        r.reussi = gain(j) > 0;
        r.texte = r.reussi ? nom(j) + ' a profité du trèfle : +' + gain(j) + ' points sur la manche !' : 'Même avec un trèfle, ' + nom(j) + ' est resté bredouille… La chance, ça se travaille.';
      } else if (d.type === 'quitte') {
        const g = gain(j);
        const meilleur = this.joueursPresents(salle).every((x) => x.id === j.id || gain(x) < g);
        if (meilleur && g > 0) { j.score += g; r.reussi = true; r.texte = 'DOUBLE ! ' + nom(j) + ' a fait la meilleure manche : +' + g + ' points en bonus !'; }
        else { const perte = Math.min(j.score, Math.floor(Math.max(0, g) / 2)); j.score -= perte; r.texte = 'QUITTE… ' + nom(j) + ' n\'a pas fait la meilleure manche' + (perte ? ' et perd ' + perte + ' points.' : ', mais n\'avait rien à perdre !'); }
      } else if (d.type === 'duel') {
        const a = salle.joueurs.get(d.adversaire && d.adversaire.id);
        if (!a) return null;
        r.concerne.push(a.id);
        const gj = gain(j), ga = gain(a);
        if (gj === ga) r.texte = 'Duel nul entre ' + nom(j) + ' et ' + nom(a) + ' ! Chacun garde ses points… et sa dignité.';
        else {
          const vainqueur = gj > ga ? j : a, vaincu = gj > ga ? a : j;
          const butin = Math.min(ENJEU_DUEL, vaincu.score);
          vaincu.score -= butin; vainqueur.score += butin;
          r.reussi = vainqueur.id === j.id;
          r.vainqueurId = vainqueur.id;
          r.texte = nom(vainqueur) + ' remporte le duel et vole ' + butin + ' points à ' + nom(vaincu) + ' !';
        }
      }
      return r;
    }

    /* ═══════════ Le commentateur et les prix (humour garanti) ═══════════ */

    variables(salle, classement) {
      const nom = (c) => (c ? c.avatar + ' ' + c.nom : '');
      const premier = classement[0], deuxieme = classement[1] || classement[0], dernier = classement[classement.length - 1];
      const remonteur = classement.slice().sort((a, b) => b.gain - a.gain)[0];
      const chiffre = (n) => String(Math.max(0, Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return {
        premier: nom(premier), deuxieme: nom(deuxieme), dernier: nom(dernier), remonteur: nom(remonteur),
        ecart: chiffre(premier && deuxieme ? premier.score - deuxieme.score : 0), gain: chiffre(remonteur ? remonteur.gain : 0),
        objectif: chiffre(salle.objectif || 0), reste: chiffre((salle.objectif || 0) - (premier ? premier.score : 0)),
        _premier: premier, _deuxieme: deuxieme, _dernier: dernier, _remonteur: remonteur
      };
    }

    remplir(modele, v) {
      return modele.replace(/\{(\w+)\}/g, (tout, cle) => (v[cle] !== undefined ? v[cle] : tout));
    }

    /*
     * Une ou deux phrases sur la course : d'abord la tête (serrée, large,
     * égalité…), puis selon les cas la ligne d'arrivée qui approche, la
     * plus belle remontée de la manche, ou un mot tendre pour le dernier.
     */
    commenter(salle, classement) {
      if (classement.length < 2) return [];
      const v = this.variables(salle, classement);
      const tirer = (famille) => this.remplir(outils.tirer(COMMENTAIRES[famille], 1)[0], v);
      const ecart = v._premier.score - v._deuxieme.score;
      const phrases = [];
      phrases.push(tirer(ecart === 0 ? 'egalite' : ecart < 600 ? 'serre' : ecart > 3500 ? 'large' : 'tete'));
      const reste = (salle.objectif || 0) - v._premier.score;
      if (salle.mode === 'surprise' && salle.finaleIndex === null && reste > 0 && reste <= 3000) phrases.push(tirer('objectifProche'));
      else if (v._remonteur && v._remonteur.gain > 0 && v._remonteur.id !== v._premier.id && Math.random() < 0.6) phrases.push(tirer('remontee'));
      else if (classement.length >= 3 && v._dernier.id !== v._premier.id) phrases.push(tirer('dernier'));
      return phrases;
    }

    /* Les prix du podium : la plus belle manche, le roi des défis, et un prix tendre pour le dernier. */
    decernerPrix(salle, classement) {
      if (classement.length < 2) return [];
      const joueurs = classement.map((c) => salle.joueurs.get(c.id)).filter(Boolean);
      const qui = (j) => ({ id: j.id, nom: j.nom, avatar: j.avatar });
      const prix = [];
      const feu = joueurs.slice().sort((a, b) => (b.meilleureManche || 0) - (a.meilleureManche || 0))[0];
      if (feu && feu.meilleureManche > 0) prix.push(Object.assign(qui(feu), { icone: '🚀', titre: 'La manche de feu', texte: 'La plus belle manche de la soirée : +' + feu.meilleureManche + ' points.' }));
      const tireur = joueurs.slice().sort((a, b) => (b.defisReussis || 0) - (a.defisReussis || 0))[0];
      if (tireur && tireur.defisReussis > 0) prix.push(Object.assign(qui(tireur), { icone: '🎯', titre: 'Œil de lynx', texte: tireur.defisReussis + ' défi' + (tireur.defisReussis > 1 ? 's' : '') + ' réussi' + (tireur.defisReussis > 1 ? 's' : '') + '. Redoutable.' }));
      const agent = joueurs.filter((j) => j.gageReussi).sort((a, b) => (b.gageOui || 0) - (a.gageOui || 0))[0];
      if (agent) prix.push(Object.assign(qui(agent), { icone: '🤫', titre: 'Agent très secret', texte: 'Gage accompli sous le nez de tout le monde.' }));
      const tortue = joueurs[joueurs.length - 1];
      prix.push(Object.assign(qui(tortue), { icone: '🐢', titre: 'Le prix de la tortue', texte: 'Lentement, mais sûrement… La revanche s\'annonce terrible !' }));
      return prix;
    }

    podium(salle) {
      this.arreterJeu(salle);
      salle.etat = 'podium';
      salle.gagesJuges = true;
      salle.multiplicateur = 1;
      salle.defis = new Map();
      const classement = this.classement(salle);
      const prix = this.decernerPrix(salle, classement);
      this.ecranTablette(salle, 'podium', { classement, prix, objectif: salle.objectif });
      const top = classement.slice(0, 3).map((c) => ({ nom: c.nom, avatar: c.avatar, score: c.score }));
      classement.forEach((c, rang) => this.ecranJoueur(salle, c.id, 'podium', { rang: rang + 1, score: c.score, nbJoueurs: classement.length, prix: prix.filter((x) => x.id === c.id), top, tousLesPrix: prix }));
      this.diffuserEtat(salle);
    }

    /* ═══════════ Le contexte confié aux jeux (voir jeux/base.js) ═══════════ */

    fabriquerContexte(salle) {
      const moteur = this;
      return {
        joueurs: () => moteur.joueursPresents(salle),
        joueur: (id) => salle.joueurs.get(id) || null,
        ecranTablette: (type, donnees) => moteur.ecranTablette(salle, type, donnees),
        ecranJoueur: (id, type, donnees) => moteur.ecranJoueur(salle, id, type, donnees),
        // Deux écritures possibles : (type, donnees) pour tous pareil,
        // ou (joueur → {type, donnees}) pour un écran sur mesure par joueur.
        ecranTousJoueurs: (type, donnees) => moteur.joueursPresents(salle).forEach((j) => {
          if (typeof type === 'function') { const r = type(j); moteur.ecranJoueur(salle, j.id, r.type, r.donnees); }
          else moteur.ecranJoueur(salle, j.id, type, typeof donnees === 'function' ? donnees(j) : donnees);
        }),
        evenementTablette: (type, donnees) => salle.tabletteId && moteur.envoyer(salle.tabletteId, 'evenement', { type, donnees }),
        evenementJoueur: (id, type, donnees) => {
          const j = salle.joueurs.get(id);
          if (j && j.connecte) moteur.envoyer(j.connexionId, 'evenement', { type, donnees });
        },
        // Crédite les points (doublés pendant la Grande Finale) et renvoie
        // le montant réellement crédité, pour que les écrans affichent le bon chiffre.
        ajouterPoints: (id, points) => {
          const j = salle.joueurs.get(id);
          if (!j) return 0;
          // Le trèfle à quatre feuilles double aussi les points de son heureux élu.
          const trefle = salle.inattendu && salle.inattendu.type === 'trefle' && salle.inattendu.joueur.id === id ? 2 : 1;
          let credit = Math.round(points * (salle.multiplicateur || 1) * trefle);
          if (j.score + credit < 0) credit = -j.score; // un score ne descend jamais sous zéro
          j.score += credit;
          moteur.diffuserEtat(salle);
          moteur.prevoirVerificationDefis(salle);
          return credit;
        },
        multiplicateur: () => salle.multiplicateur || 1,
        terminer: () => { if (salle.jeu) moteur.finJeu(salle); }
      };
    }

    /* ═══════════ Les envois ═══════════ */

    joueursPresents(salle) {
      return Array.from(salle.joueurs.values()).filter((j) => j.connecte);
    }

    /*
     * Chaque écran est mémorisé avant d'être envoyé. Ainsi, un appareil
     * qui se reconnecte retrouve exactement ce qu'il affichait. « horloge »
     * permet à l'appareil de corriger un éventuel décalage entre son heure
     * et celle du serveur, pour que les comptes à rebours soient justes.
     */
    ecranTablette(salle, type, donnees) {
      salle.dernierEcranTablette = { type, donnees };
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'ecran', { type, donnees, horloge: Date.now() });
    }

    ecranJoueur(salle, id, type, donnees) {
      const j = salle.joueurs.get(id);
      if (!j) return;
      j.dernierEcran = { type, donnees };
      if (j.connecte) this.envoyer(j.connexionId, 'ecran', { type, donnees, horloge: Date.now() });
    }

    /* L'état de la salle (joueurs, scores, étape) est envoyé à tout le monde à chaque changement. */
    diffuserEtat(salle) {
      const etat = {
        code: salle.code, etat: salle.etat, minJoueurs: this.minJoueurs, maxJoueurs: this.maxJoueurs,
        joueurs: Array.from(salle.joueurs.values()).map((j) => ({ id: j.id, nom: j.nom, avatar: j.avatar, score: j.score, connecte: j.connecte })),
        programme: salle.programme, index: salle.index, multiplicateur: salle.multiplicateur || 1
      };
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'salle:etat', etat);
      salle.joueurs.forEach((j) => { if (j.connecte) this.envoyer(j.connexionId, 'salle:etat', etat); });
    }
  }

  Moteur.FICHES = FICHES;
  Moteur.FAMILLES = FAMILLES;
  Moteur.AVATARS = AVATARS;
  Moteur.REACTIONS = REACTIONS;
  Moteur.PRIME_DEFI = PRIME_DEFI;
  Moteur.MULTIPLICATEUR_FINALE = MULTIPLICATEUR_FINALE;
  Moteur.MANCHES_MAX = MANCHES_MAX;
  Moteur.PRIME_GAGE = PRIME_GAGE;
  Moteur.OBJECTIF_MIN = OBJECTIF_MIN;
  Moteur.OBJECTIF_MAX = OBJECTIF_MAX;
  return Moteur;
});

</script>
<script>/* js/sans-serveur.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LE JEU SANS SERVEUR — tout tourne dans le téléphone
 * ════════════════════════════════════════════════════════════════════
 *
 *  D'habitude, le téléphone parle au moteur du jeu, installé sur
 *  l'ordinateur, par une « WebSocket ». Ici, il n'y a pas d'ordinateur :
 *  le moteur (le même, mot pour mot) tourne dans la page elle-même.
 *
 *  Pour ne rien changer au reste du jeu, ce fichier remplace la WebSocket
 *  du navigateur par une « fausse ligne » qui, au lieu de partir sur le
 *  réseau, remet directement les messages au moteur de la page, et
 *  inversement. connexion.js, solo.js et joueur.js n'y voient que du feu.
 *
 *  Il doit être chargé APRÈS les fichiers du moteur et AVANT connexion.js.
 *  Le blind test n'est pas proposé ici : il a besoin d'Internet pour
 *  aller chercher les extraits chez Apple.
 *  La mémoire anti-répétition est gardée dans le téléphone (localStorage).
 */
(function () {
  'use strict';
  const M = window.GT.modules;
  const outils = M.outils;

  // Pas de blind test sans le réseau : on le retire du grand mélange.
  const themes = M['jeux/melange'].THEMES;
  for (let i = themes.length - 1; i >= 0; i--) if (themes[i].fiche.id === 'blindtest') themes.splice(i, 1);

  // La mémoire de ce qui a déjà été posé, d'une partie à l'autre.
  const CLE = 'gdn-souvenirs';
  try { const s = localStorage.getItem(CLE); if (s) outils.memoire.importer(JSON.parse(s)); } catch (e) { /* première fois */ }
  setInterval(() => {
    if (!outils.memoire.modifiee()) return;
    try { localStorage.setItem(CLE, JSON.stringify(outils.memoire.exporter())); } catch (e) { /* tant pis */ }
  }, 5000);

  const lignes = new Map(); // identifiant → fausse ligne
  let compteur = 0;

  const moteur = new M.moteur({
    minJoueurs: 1,
    envoyer(id, e, d) {
      const ligne = lignes.get(id);
      // Une copie, comme si le message avait voyagé sur le réseau, remise juste après.
      if (ligne) { const data = JSON.stringify({ e, d }); setTimeout(() => ligne.recevoir(data), 0); }
    }
  });

  class FausseLigne {
    constructor() {
      this.id = 'l' + (++compteur);
      this.readyState = FausseLigne.CONNECTING;
      this.onopen = this.onmessage = this.onclose = this.onerror = null;
      lignes.set(this.id, this);
      setTimeout(() => {
        this.readyState = FausseLigne.OPEN;
        if (this.onopen) this.onopen({});
      }, 0);
    }
    send(brut) {
      if (this.readyState !== FausseLigne.OPEN) return;
      let m;
      try { m = JSON.parse(brut); } catch (e) { return; }
      if (!m || !m.e) return;
      if (m.e === 'ping') return this.recevoir(JSON.stringify({ e: 'pong', d: {} }));
      moteur.recevoir(this.id, m.e, m.d);
    }
    recevoir(data) { if (this.readyState === FausseLigne.OPEN && this.onmessage) this.onmessage({ data }); }
    close() {
      if (this.readyState === FausseLigne.CLOSED) return;
      this.readyState = FausseLigne.CLOSED;
      lignes.delete(this.id);
      moteur.deconnexion(this.id);
    }
  }
  FausseLigne.CONNECTING = 0; FausseLigne.OPEN = 1; FausseLigne.CLOSING = 2; FausseLigne.CLOSED = 3;

  window.WebSocket = FausseLigne;
  window.GT.sansServeur = true;
})();

</script>
<script>/* js/connexion.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LA LIGNE AVEC LE SERVEUR (commune à la tablette et aux téléphones)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Ce petit module ouvre la « ligne » permanente entre l'appareil et le
 *  moteur du jeu, et la maintient en vie. Il offre deux gestes simples :
 *    GT.connexion.emit('joueur:action', {...})   → envoyer un message
 *    GT.connexion.on('ecran', fonction)          → réagir à un message reçu
 *  plus deux signaux internes : « ouverte » (la ligne vient de s'ouvrir
 *  ou de se rétablir) et « fermee » (elle vient de tomber).
 *
 *  DEUX MODES DE FONCTIONNEMENT
 *  ────────────────────────────
 *  • En vrai (serveur Node.js) : une WebSocket vers /ligne. Si le
 *    téléphone se met en veille ou si le Wi-Fi hoquette, on retente
 *    automatiquement, de plus en plus patiemment (1 s, 2 s, … 6 s).
 *    Dès que la ligne revient, la page renvoie d'elle-même « je suis
 *    Léa, de la salle BRIK », et le moteur la remet à sa place.
 *  • Dans le simulateur : la page est affichée dans un cadre, et la
 *    « ligne » est un simple tuyau vers le moteur qui tourne dans la
 *    page parente. Aucun réseau n'est utilisé.
 */
(function () {
  'use strict';
  window.GT = window.GT || {};

  const ecouteurs = {};
  function declencher(evenement, donnees) {
    (ecouteurs[evenement] || []).forEach((f) => {
      try { f(donnees); } catch (e) { console.error('[connexion] ' + evenement, e); }
    });
  }

  const connexion = {
    simulation: false,
    ouverte: false,
    on(evenement, fonction) { (ecouteurs[evenement] = ecouteurs[evenement] || []).push(fonction); },
    emit() {}
  };
  window.GT.connexion = connexion;

  /*
   * ─── Mode simulateur : le moteur vit dans la page parente ───
   * La page est alors ouverte avec « ?sim » dans son adresse, dans un cadre.
   * On parle au moteur par « postMessage », la boîte aux lettres officielle
   * entre une page et les cadres qu'elle contient.
   */
  if (window.parent !== window && new URLSearchParams(location.search).has('sim')) {
    connexion.simulation = true;
    const canal = 'gt-' + Math.random().toString(36).slice(2);
    window.addEventListener('message', (ev) => {
      const m = ev.data;
      if (ev.source !== window.parent || !m || m.canal !== canal) return;
      if (m.gt === 'ouverte') { connexion.ouverte = true; declencher('ouverte'); }
      else if (m.gt === 'msg') declencher(m.e, m.d);
    });
    connexion.emit = (evenement, donnees) => window.parent.postMessage({ gt: 'emit', canal, e: evenement, d: donnees }, '*');
    window.addEventListener('pagehide', () => window.parent.postMessage({ gt: 'fermer', canal }, '*'));
    window.parent.postMessage({ gt: 'connecter', canal }, '*');
    return;
  }

  /* ─── Mode réel : une WebSocket vers le serveur ─── */
  let ws = null;
  let attente = 1000;
  let minuteurReconnexion = null;
  let minuteurPing = null;

  function ouvrir() {
    clearTimeout(minuteurReconnexion);
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const adresse = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ligne';
    ws = new WebSocket(adresse);

    ws.onopen = () => {
      attente = 1000;
      connexion.ouverte = true;
      declencher('ouverte');
      // Un petit « tu es là ? » toutes les 25 secondes empêche certaines box de couper la ligne.
      clearInterval(minuteurPing);
      minuteurPing = setInterval(() => connexion.emit('ping'), 25000);
    };
    ws.onmessage = (m) => {
      let message;
      try { message = JSON.parse(m.data); } catch (e) { return; }
      if (message && message.e) declencher(message.e, message.d);
    };
    ws.onclose = () => {
      clearInterval(minuteurPing);
      if (connexion.ouverte) { connexion.ouverte = false; declencher('fermee'); }
      minuteurReconnexion = setTimeout(ouvrir, attente);
      attente = Math.min(6000, attente * 1.6);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* rien à faire */ } };
  }

  connexion.emit = (evenement, donnees) => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ e: evenement, d: donnees }));
  };

  // Quand on rallume l'écran du téléphone, on vérifie aussitôt la ligne au lieu d'attendre.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (!ws || ws.readyState !== WebSocket.OPEN)) { attente = 1000; ouvrir(); }
  });

  ouvrir();
})();

</script>
<script>/* js/commun.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  OUTILS D'AFFICHAGE (communs à la tablette et aux téléphones)
 * ════════════════════════════════════════════════════════════════════
 *
 *  • GT.h(...)           fabrique des éléments de page sans jamais
 *                        interpréter le texte comme du code : un joueur
 *                        qui s'appellerait « <script> » restera un prénom
 *                        bizarre, pas une faille de sécurité.
 *  • GT.maintenant()     l'heure « du serveur », corrigée du décalage de
 *                        l'horloge de l'appareil. Indispensable pour que
 *                        tous les comptes à rebours tombent à zéro ensemble.
 *  • GT.chrono(...)      une barre de temps qui se vide en douceur.
 *  • GT.memoire          un petit carnet sur l'appareil (le dernier prénom,
 *                        l'identifiant de joueur…), qui ne plante jamais,
 *                        même si le navigateur interdit la mémoire locale.
 *  • GT.formes / couleurs : les quatre réponses ont chacune une couleur
 *                        ET une forme (▲ ◆ ● ■), pour les personnes qui
 *                        distinguent mal certaines couleurs.
 */
(function () {
  'use strict';
  window.GT = window.GT || {};

  GT.h = function (balise, attributs, ...enfants) {
    const el = document.createElement(balise);
    Object.entries(attributs || {}).forEach(([cle, valeur]) => {
      if (valeur === null || valeur === undefined || valeur === false) return;
      if (cle === 'class') el.className = valeur;
      else if (cle === 'style' && typeof valeur === 'object') Object.assign(el.style, valeur);
      else if (cle.startsWith('on') && typeof valeur === 'function') el.addEventListener(cle.slice(2), valeur);
      else if (cle === 'html') el.innerHTML = valeur; // réservé aux dessins SVG que NOUS fabriquons
      else el.setAttribute(cle, valeur === true ? '' : valeur);
    });
    enfants.flat(Infinity).forEach((e) => {
      if (e === null || e === undefined || e === false) return;
      el.appendChild(e instanceof Node ? e : document.createTextNode(String(e)));
    });
    return el;
  };

  /* L'horloge : à chaque écran reçu, on note l'écart entre l'heure du serveur et la nôtre. */
  let decalage = 0;
  GT.recalerHorloge = (horlogeServeur) => { if (horlogeServeur) decalage = horlogeServeur - Date.now(); };
  GT.maintenant = () => Date.now() + decalage;

  /*
   * Le chronomètre : une barre qui se vide et un nombre de secondes.
   * Tous les chronos actifs sont arrêtés quand l'écran change (GT.arreterChronos),
   * pour ne pas laisser tourner des animations invisibles qui videraient la batterie.
   */
  const chronos = new Set();
  GT.chrono = function (finA, dureeMs, options) {
    options = options || {};
    const barre = GT.h('div', { class: 'chrono-remplissage' });
    const secondes = GT.h('span', { class: 'chrono-secondes' });
    const bloc = GT.h('div', { class: 'chrono' + (options.grand ? ' chrono-grand' : '') , role: 'timer' }, GT.h('div', { class: 'chrono-piste' }, barre), secondes);
    let actif = true;
    // Le compte à rebours final (3… 2… 1…) : seulement pour les vrais chronos de jeu (pas les attentes « calmes »),
    // et seulement pour les secondes qui passent sous nos yeux (pas celles déjà écoulées à l'affichage).
    const avecDecompte = !options.calme && dureeMs >= 4000;
    let derniereSeconde = Math.ceil(Math.max(0, finA - GT.maintenant()) / 1000);
    const stop = () => { actif = false; chronos.delete(stop); };
    chronos.add(stop);
    (function boucle() {
      if (!actif) return;
      const reste = Math.max(0, finA - GT.maintenant());
      const part = dureeMs ? reste / dureeMs : 0;
      barre.style.transform = 'scaleX(' + part.toFixed(4) + ')';
      bloc.classList.toggle('chrono-urgent', reste < 5000 && reste > 0);
      const s = Math.ceil(reste / 1000);
      secondes.textContent = s + ' s';
      if (avecDecompte && s < derniereSeconde && s <= 3) GT.annoncerDecompte(s, options);
      derniereSeconde = s;
      if (reste > 0) requestAnimationFrame(boucle);
      else if (options.fini) options.fini();
    })();
    return bloc;
  };

  /*
   * Le compte à rebours stressant des 3 dernières secondes.
   * À l'écran : le bord qui pulse en rouge et, sur la tablette, un chiffre
   * géant qui surgit (3, 2, 1…). Le son et les vibrations sont confiés à
   * la page (GT.surDecompte), qui sait si l'animateur veut du son ou non.
   */
  GT.chiffreGeant = false; // la tablette l'active ; sur un téléphone, il cacherait les réponses
  GT.surDecompte = null;
  let minuteurDecompte = null;
  GT.annoncerDecompte = function (n, options) {
    options = options || {};
    document.body.classList.toggle('compte-final', n > 0);
    clearTimeout(minuteurDecompte);
    if (GT.chiffreGeant) {
      let geant = document.getElementById('decompte-geant');
      if (!geant) { geant = GT.h('div', { id: 'decompte-geant', 'aria-hidden': 'true' }); document.body.appendChild(geant); }
      geant.textContent = n > 0 ? String(n) : (options.depart ? 'C\'est parti !' : 'Temps écoulé !');
      geant.className = 'pop' + (n === 0 ? ' fin' : '') + (options.depart ? ' depart' : '');
      void geant.offsetWidth; // relance l'animation
      geant.classList.add('visible');
    }
    if (n === 0) minuteurDecompte = setTimeout(GT.effacerDecompte, 900);
    if (typeof GT.surDecompte === 'function') { try { GT.surDecompte(n, options); } catch (e) { /* un son raté ne doit rien casser */ } }
  };
  GT.effacerDecompte = function () {
    clearTimeout(minuteurDecompte);
    document.body.classList.remove('compte-final');
    const geant = document.getElementById('decompte-geant');
    if (geant) geant.className = '';
  };
  GT.arreterChronos = () => { Array.from(chronos).forEach((stop) => stop()); GT.effacerDecompte(); };

  /* Le carnet local. En simulateur, chaque cadre doit avoir le sien : on garde tout en mémoire vive. */
  const vive = {};
  GT.memoire = {
    lire(cle) {
      if (GT.connexion && GT.connexion.simulation) return vive[cle] || null;
      try { return localStorage.getItem('tablee:' + cle); } catch (e) { return vive[cle] || null; }
    },
    ecrire(cle, valeur) {
      vive[cle] = valeur;
      if (GT.connexion && GT.connexion.simulation) return;
      try { localStorage.setItem('tablee:' + cle, valeur); } catch (e) { /* tant pis, la mémoire vive suffit */ }
    },
    effacer(cle) {
      delete vive[cle];
      try { localStorage.removeItem('tablee:' + cle); } catch (e) { /* rien */ }
    }
  };

  GT.formes = ['▲', '◆', '●', '■'];
  GT.classesChoix = ['choix-a', 'choix-b', 'choix-c', 'choix-d'];

  /* Un petit message qui apparaît puis disparaît tout seul. */
  GT.bulle = function (texte, type, dureeMs) {
    let zone = document.getElementById('bulles');
    if (!zone) { zone = GT.h('div', { id: 'bulles', 'aria-live': 'polite' }); document.body.appendChild(zone); }
    const b = GT.h('div', { class: 'bulle ' + (type || '') }, texte);
    zone.appendChild(b);
    const duree = dureeMs || 2600;
    setTimeout(() => b.classList.add('bulle-part'), duree);
    setTimeout(() => b.remove(), duree + 600);
  };

  /*
   * Le cadre du zoom infernal, partagé par la tablette et les téléphones.
   * L'image est agrandie autour d'un point, puis ramenée à sa taille au
   * rythme du chronomètre (courbe exponentielle : longtemps flou, puis
   * tout s'accélère). « mini » donne la version de poche du téléphone.
   */
  GT.cadreZoom = function (z, finA, dureeMs, revele, mini) {
    const contenu = z.photo
      ? GT.h('img', { src: z.photo, alt: '', draggable: 'false' })
      : GT.h('span', { class: 'zoom-emoji', 'aria-hidden': 'true' }, z.image || '❔');
    const toile = GT.h('div', { class: 'zoom-contenu', style: { transformOrigin: z.origineX + '% ' + z.origineY + '%' } }, contenu);
    const cadre = GT.h('div', { class: 'zoom-cadre' + (revele ? ' zoom-revele' : '') + (mini ? ' zoom-cadre-mini' : ''), role: 'img', 'aria-label': revele ? 'L\'image entière' : 'Une image très agrandie qui se dévoile peu à peu' }, toile);
    if (revele) { toile.style.transform = 'scale(1)'; return cadre; }
    const depart = z.depart || 14;
    toile.style.transform = 'scale(' + depart + ')';
    (function boucle() {
      if (!toile.isConnected && cadre.dataset.pose) return; // l'écran a changé : on arrête
      cadre.dataset.pose = '1';
      const reste = Math.max(0, finA - GT.maintenant());
      const avancee = dureeMs ? 1 - reste / dureeMs : 1;
      toile.style.transform = 'scale(' + Math.pow(depart, 1 - avancee).toFixed(4) + ')';
      if (reste > 0) requestAnimationFrame(boucle);
    })();
    return cadre;
  };

  /*
   * L'illustration d'une question : une ou plusieurs lignes de grandes
   * tuiles (des émojis, des nombres, des « + » et des « = »…). Elle sert
   * à la mémoire (la grille à retenir), au casse-tête (la suite, la
   * balance) et aux Toqués (les ingrédients de la recette mystère).
   *   ill.lignes       : [[tuile, tuile…], …] — une tuile est un texte
   *   ill.colonnes     : affiche les tuiles en grille de N colonnes (mémoire)
   *   ill.apparitionMs : les tuiles apparaissent une à une, à ce rythme,
   *                      à partir de l'instant « options.debut » (recette mystère)
   */
  GT.illustration = function (ill, options) {
    options = options || {};
    const tuiles = [];
    const classeTuile = (t) => 'ill-tuile' + (/^[+=×−÷-]$/.test(t) ? ' ill-op' : '') + (t === '?' ? ' ill-mystere' : '') + (/^\d+$/.test(t) ? ' ill-nombre' : '');
    const lignes = (ill.lignes || []).map((ligne) => GT.h('div', { class: 'ill-ligne', style: ill.colonnes ? { gridTemplateColumns: 'repeat(' + ill.colonnes + ', 1fr)' } : null },
      ligne.map((t) => { const el = GT.h('span', { class: classeTuile(String(t)) }, String(t)); tuiles.push(el); return el; })));
    const bloc = GT.h('div', { class: 'illustration' + (ill.colonnes ? ' ill-grille' : '') + (ill.mot ? ' ill-mot' : '') + (options.mini ? ' ill-mini' : ''), 'aria-hidden': 'true' }, lignes);
    // L'apparition une à une : chaque tuile attend son tour, calé sur l'horloge commune.
    if (ill.apparitionMs && options.debut && !options.toutVoir) {
      tuiles.forEach((el, i) => {
        const delai = options.debut + i * ill.apparitionMs - GT.maintenant();
        if (delai > 0) { el.classList.add('ill-cache'); setTimeout(() => el.classList.remove('ill-cache'), delai); }
      });
    }
    return bloc;
  };

  /*
   * Un drapeau, dessiné en SVG à partir de sa description (voir
   * moteur/contenus/drapeaux.js) : rectangles, disques, cercles,
   * polygones et bandes en biais. Net à toutes les tailles.
   */
  GT.drapeau = function (d, options) {
    options = options || {};
    const NS = 'http://www.w3.org/2000/svg';
    const el = (nom, attributs) => { const e = document.createElementNS(NS, nom); Object.entries(attributs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
    const svg = el('svg', { viewBox: '0 0 ' + d.l + ' ' + d.h, class: 'drapeau' + (options.mini ? ' drapeau-mini' : ''), role: 'img', 'aria-label': 'Un drapeau' });
    (d.formes || []).forEach((f) => {
      if (f.r) svg.appendChild(el('rect', { x: f.r[0], y: f.r[1], width: f.r[2], height: f.r[3], fill: f.c }));
      else if (f.o && f.trait) svg.appendChild(el('circle', { cx: f.o[0], cy: f.o[1], r: f.o[2], fill: 'none', stroke: f.c, 'stroke-width': f.trait }));
      else if (f.o) svg.appendChild(el('circle', { cx: f.o[0], cy: f.o[1], r: f.o[2], fill: f.c }));
      else if (f.p) svg.appendChild(el('polygon', { points: f.p.map((pt) => pt.join(',')).join(' '), fill: f.c }));
      else if (f.l) svg.appendChild(el('line', { x1: f.l[0], y1: f.l[1], x2: f.l[2], y2: f.l[3], stroke: f.c, 'stroke-width': f.e || 10 }));
    });
    return GT.h('div', { class: 'cadre-drapeau' + (options.mini ? ' cadre-drapeau-mini' : '') }, svg);
  };

  /*
   * Le puzzle 🖼️ : l'image (un émoji ou une photo) découpée en 3 × 3
   * pièces. Au départ, chaque pièce est dans la mauvaise case et tournée ;
   * puis, une à une (dans l'ordre p.rythme), elles glissent à leur place
   * pendant les 70 premiers pourcents du temps, calées sur l'horloge commune.
   *   p.ordre[i] : la case de départ de la pièce i     p.tours[i] : sa rotation
   *   finA, dureeMs : la fin et la durée de la question (0, 0 = puzzle terminé)
   */
  GT.puzzle = function (p, finA, dureeMs, options) {
    options = options || {};
    const fini = p.fini || !dureeMs;
    const debut = finA - dureeMs;
    const pieces = [];
    for (let i = 0; i < 9; i++) {
      const col = i % 3, lig = Math.floor(i / 3);
      const image = p.photo
        ? GT.h('img', { src: p.photo, alt: '', draggable: 'false', class: 'puzzle-image' })
        : GT.h('span', { class: 'puzzle-image puzzle-emoji' }, p.image || '❔');
      image.style.left = (-col * 100) + '%';
      image.style.top = (-lig * 100) + '%';
      const piece = GT.h('div', { class: 'puzzle-piece' }, image);
      piece.style.left = (col * 100 / 3) + '%';
      piece.style.top = (lig * 100 / 3) + '%';
      const placer = () => { piece.style.transform = 'none'; piece.classList.add('puzzle-en-place'); };
      const depart = p.ordre[i];
      const dx = ((depart % 3) - col) * 100, dy = (Math.floor(depart / 3) - lig) * 100;
      const instant = debut + dureeMs * 0.7 * (p.rythme.indexOf(i) + 1) / 9;
      const delai = instant - GT.maintenant();
      if (fini || delai <= 0) placer();
      else {
        piece.style.transform = 'translate(' + dx + '%, ' + dy + '%) rotate(' + p.tours[i] + 'deg)';
        setTimeout(placer, delai);
      }
      pieces.push(piece);
    }
    return GT.h('div', { class: 'puzzle-cadre' + (options.mini ? ' puzzle-mini' : '') + (fini ? ' puzzle-fini' : ''), role: 'img', 'aria-label': fini ? 'Le puzzle terminé' : 'Un puzzle qui se reconstruit' }, pieces);
  };

  /* Les places au classement : 1er, 2e, 3e… */
  GT.rang = (n) => (n === 1 ? '1er' : n + 'e');
  GT.points = (n) => new Intl.NumberFormat('fr-BE').format(n) + ' pts';

  /* Empêche l'écran de s'éteindre pendant la partie, quand l'appareil le permet. */
  GT.garderEcranAllume = async function () {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* refusé : pas grave */ }
  };
})();

</script>
<script>/* js/scene.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LE PEINTRE DE PAYSAGES (pour « Les 7 erreurs »)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Le moteur ne transmet qu'une liste d'objets décrits en mots et en
 *  chiffres : « un arbre, couleur #3BA55C, en x = 120, y = 215, taille
 *  1,1 ». Ce fichier les transforme en image vectorielle (SVG), c'est-à-
 *  dire en formes géométriques que l'écran trace lui-même. Avantage :
 *  l'image reste parfaitement nette sur un petit téléphone comme sur
 *  une grande tablette, et elle ne pèse presque rien à transmettre.
 *
 *  Chaque objet est dessiné autour de son centre (0, 0), puis déplacé
 *  et agrandi d'un seul geste par « translate(x, y) scale(taille) ».
 */
(function () {
  'use strict';
  window.GT = window.GT || {};

  const DESSINS = {
    soleil: (o) => {
      let rayons = '';
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        rayons += '<line x1="' + (Math.cos(a) * 26).toFixed(1) + '" y1="' + (Math.sin(a) * 26).toFixed(1) + '" x2="' + (Math.cos(a) * 35).toFixed(1) + '" y2="' + (Math.sin(a) * 35).toFixed(1) + '" stroke="' + o.c + '" stroke-width="4" stroke-linecap="round"/>';
      }
      return rayons + '<circle r="21" fill="' + o.c + '"/>';
    },
    nuage: (o) => '<g fill="' + o.c + '" stroke="#9AA6C8" stroke-width="1"><circle cx="-15" cy="4" r="12"/><circle cx="0" cy="-5" r="16"/><circle cx="16" cy="4" r="12"/><rect x="-15" y="4" width="31" height="12" stroke="none"/></g>',
    oiseau: (o) => '<path d="M-15 2 Q-8 -9 0 1 Q8 -9 15 2" fill="none" stroke="' + o.c + '" stroke-width="3.5" stroke-linecap="round"/>',
    ballon: (o) => '<path d="M0 12 Q4 20 -1 28" fill="none" stroke="#5B6280" stroke-width="1.5"/><ellipse cx="0" cy="-5" rx="14" ry="17" fill="' + o.c + '"/><ellipse cx="-5" cy="-11" rx="3.5" ry="5" fill="#FFFFFF" opacity=".55"/>',
    cerfvolant: (o) => '<path d="M0 20 Q-8 30 2 36 Q10 42 0 50" fill="none" stroke="#5B6280" stroke-width="1.5"/><polygon points="0,-22 15,0 0,20 -15,0" fill="' + o.c + '" stroke="#2B2F4F" stroke-width="1.5"/><line x1="0" y1="-22" x2="0" y2="20" stroke="#2B2F4F" stroke-width="1"/><line x1="-15" y1="0" x2="15" y2="0" stroke="#2B2F4F" stroke-width="1"/>',
    arbre: (o) => '<rect x="-5" y="8" width="10" height="28" fill="#7A4E2D"/><circle cy="-8" r="23" fill="' + o.c + '"/><circle cx="-8" cy="-14" r="6" fill="#FFFFFF" opacity=".15"/>',
    sapin: (o) => '<rect x="-4" y="18" width="8" height="14" fill="#7A4E2D"/><polygon points="0,-34 -19,2 19,2" fill="' + o.c + '"/><polygon points="0,-18 -24,20 24,20" fill="' + o.c + '"/>',
    maison: (o) => '<rect x="-24" y="-10" width="48" height="38" fill="' + (o.c2 || '#F7E1C6') + '" stroke="#2B2F4F" stroke-width="1.5"/><polygon points="-31,-9 0,-36 31,-9" fill="' + o.c + '" stroke="#2B2F4F" stroke-width="1.5"/><rect x="-7" y="9" width="13" height="19" fill="#6B4226"/><rect x="10" y="-1" width="9" height="9" fill="#BFE4FF" stroke="#2B2F4F" stroke-width="1"/>',
    fleur: (o) => {
      let petales = '';
      for (let i = 0; i < 5; i++) {
        const a = i * 2 * Math.PI / 5 - Math.PI / 2;
        petales += '<circle cx="' + (Math.cos(a) * 7).toFixed(1) + '" cy="' + (Math.sin(a) * 7 - 6).toFixed(1) + '" r="6" fill="' + o.c + '" stroke="#2B2F4F" stroke-width=".6"/>';
      }
      return '<line x1="0" y1="-4" x2="0" y2="18" stroke="#3B8B4A" stroke-width="2.5"/>' + petales + '<circle cy="-6" r="4" fill="#FFC93C"/>';
    },
    champignon: (o) => '<rect x="-6" y="0" width="12" height="15" rx="3" fill="#F3E6D3" stroke="#8D7A62" stroke-width=".8"/><path d="M-17 2 Q-17 -15 0 -15 Q17 -15 17 2 Z" fill="' + o.c + '"/><circle cx="-7" cy="-7" r="2.5" fill="#FFFFFF"/><circle cx="5" cy="-10" r="2" fill="#FFFFFF"/><circle cx="9" cy="-3" r="2.2" fill="#FFFFFF"/>'
  };

  /* Le décor commun : ciel en dégradé, colline, prairie. Identique sur les deux images. */
  function decor(idUnique) {
    return '<defs><linearGradient id="ciel-' + idUnique + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CD3FF"/><stop offset="1" stop-color="#E4F4FF"/></linearGradient></defs>' +
      '<rect width="400" height="300" fill="url(#ciel-' + idUnique + ')"/>' +
      '<path d="M0 190 Q100 160 210 185 T400 175 V300 H0 Z" fill="#9BD67A"/>' +
      '<path d="M0 235 Q120 220 240 238 T400 232 V300 H0 Z" fill="#7CC35E"/>';
  }

  let compteur = 0;

  /*
   * GT.scene.svg(objets, options) renvoie le texte SVG d'un paysage.
   *   options.cercles : [{x, y, r, classe}] des cercles à superposer
   *                     (différences trouvées, ou solution en fin de jeu)
   */
  GT.scene = {
    svg(objets, options) {
      options = options || {};
      const id = 's' + (++compteur);
      let corps = decor(id);
      (objets || []).forEach((o) => {
        const dessin = DESSINS[o.type];
        if (dessin) corps += '<g transform="translate(' + o.x + ' ' + o.y + ') scale(' + o.t + ')">' + dessin(o) + '</g>';
      });
      (options.cercles || []).forEach((c) => {
        corps += '<circle class="' + (c.classe || 'cercle-trouve') + '" cx="' + c.x + '" cy="' + c.y + '" r="' + Math.min(c.r, 34) + '" fill="none" stroke-width="4"/>';
      });
      return '<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + (options.titre || 'Paysage') + '">' + corps + '</svg>';
    },

    /* Convertit la position d'un doigt sur l'image affichée en coordonnées du paysage (0-400, 0-300). */
    coordonnees(svgElement, evenement) {
      const cadre = svgElement.getBoundingClientRect();
      return {
        x: Math.round((evenement.clientX - cadre.left) / cadre.width * 400),
        y: Math.round((evenement.clientY - cadre.top) / cadre.height * 300)
      };
    }
  };
})();

</script>
<script>/* js/toile.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LA TOILE DE DESSIN (commune à la tablette et au téléphone)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Un « trait » est une suite de points, chacun noté entre 0 et 1 :
 *  (0, 0) est le coin en haut à gauche, (1, 1) le coin en bas à droite.
 *  Pour le tracer, on multiplie simplement par la taille réelle de la
 *  toile. L'épaisseur suit la même logique : elle est exprimée pour une
 *  toile de référence de 400 points de large, puis agrandie ou réduite.
 *  Résultat : un dessin fait sur un petit téléphone s'affiche à
 *  l'identique, proportions comprises, sur la grande tablette.
 *
 *  Un détail qui compte : les écrans modernes ont plus de pixels réels
 *  que de « points » CSS (on parle de densité, ou devicePixelRatio).
 *  On dimensionne la toile en pixels réels pour que le trait reste net.
 */
(function () {
  'use strict';
  window.GT = window.GT || {};

  GT.toile = {
    /* Prépare une toile carrée à la taille de son conteneur ; renvoie sa largeur en points. */
    ajuster(canvas) {
      const cote = canvas.parentElement.clientWidth || 300;
      const densite = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(cote * densite);
      canvas.height = Math.round(cote * densite);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(densite, 0, 0, densite, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      return cote;
    },

    effacer(canvas) {
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    },

    /* Trace un trait entier, ou seulement ses points à partir de l'indice « depuis ». */
    tracer(canvas, trait, depuis) {
      const ctx = canvas.getContext('2d');
      const cote = canvas.width / (canvas.getContext('2d').getTransform().a || 1);
      const pts = trait.points;
      if (!pts.length) return;
      ctx.strokeStyle = trait.couleur;
      ctx.fillStyle = trait.couleur;
      ctx.lineWidth = trait.taille * cote / 400;
      const debut = Math.max(0, (depuis || 0) - 1);
      if (pts.length === 1 || (pts.length - debut) === 1) {
        // Un simple point (un « tap ») : on dessine un petit disque.
        const p = pts[pts.length - 1];
        ctx.beginPath();
        ctx.arc(p[0] * cote, p[1] * cote, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(pts[debut][0] * cote, pts[debut][1] * cote);
      for (let i = debut + 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * cote, pts[i][1] * cote);
      ctx.stroke();
    },

    toutRedessiner(canvas, traits) {
      GT.toile.effacer(canvas);
      (traits || []).forEach((t) => GT.toile.tracer(canvas, t, 0));
    }
  };
})();

</script>
<script>/* js/musique.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LE PETIT SYNTHÉTISEUR DE LA TABLETTE (bruitages, compte à rebours, musique de fond)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Ce module lit les partitions écrites dans moteur/contenus/blindtest.js
 *  (« E4:1 D#4:.5 … ») et les joue avec la « Web Audio API », un vrai
 *  petit studio de musique intégré à tous les navigateurs récents.
 *
 *  Pour chaque note, on crée un oscillateur (le son brut, ici une onde
 *  « triangle », douce et un peu rétro, comme une boîte à musique
 *  électronique) et un réglage de volume qui monte vite puis retombe :
 *  c'est ce qui donne à chaque note son attaque et sa résonance.
 *
 *  ATTENTION, règle des navigateurs : aucun son ne peut sortir tant que
 *  personne n'a touché l'écran. On « débloque » donc le son au moment
 *  où l'animateur appuie sur « Lancer la partie ».
 */
(function () {
  'use strict';
  window.GT = window.GT || {};

  let contexte = null;
  let sortie = null;
  let enCours = [];      // les notes programmées, pour pouvoir tout couper
  let lecteur = null;    // le lecteur audio pour les fichiers mp3 personnels
  let enSilence = false; // vrai pendant le blind test (voir silence())

  const DEMI_TONS = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };

  /* La fréquence d'une note : le la (A4) vibre à 440 Hz, et chaque demi-ton multiplie par la racine 12e de 2. */
  function frequence(note) {
    const m = /^([A-G])(#|b)?(\d)$/.exec(note);
    if (!m) return null;
    let n = DEMI_TONS[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12;
    return 440 * Math.pow(2, n / 12);
  }

  function preparer() {
    if (contexte) return contexte;
    const Classe = window.AudioContext || window.webkitAudioContext;
    if (!Classe) return null;
    contexte = new Classe();
    // Sur iPhone récent : notre son se comporte comme un lecteur de musique (et ne coupe pas les extraits).
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* ancien appareil */ }
    sortie = contexte.createGain();
    sortie.gain.value = 0.32;
    sortie.connect(contexte.destination);
    return contexte;
  }

  /* Un souffle de bruit blanc, préparé une fois : la matière des cymbales, des claquements et des explosions. */
  let bruitBlanc = null;
  function souffle() {
    if (bruitBlanc) return bruitBlanc;
    const c = contexte;
    bruitBlanc = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const donnees = bruitBlanc.getChannelData(0);
    for (let i = 0; i < donnees.length; i++) donnees[i] = Math.random() * 2 - 1;
    return bruitBlanc;
  }

  /* Un coup de bruit filtré (cymbale, claquement…), à l'instant « t », vers la sortie « vers ». */
  function bruit(t, duree, filtreType, frequenceHz, volume, vers) {
    const c = contexte;
    const src = c.createBufferSource();
    src.buffer = souffle();
    const f = c.createBiquadFilter();
    f.type = filtreType;
    f.frequency.value = frequenceHz;
    const g = c.createGain();
    g.gain.setValueAtTime(volume, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    src.connect(f).connect(g).connect(vers || sortie);
    src.start(t);
    src.stop(t + duree + 0.02);
  }

  /* Un coup de grosse caisse : une note grave dont la hauteur plonge en un éclair. */
  function grosseCaisse(t, volume, vers, depuisHz) {
    const c = contexte;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(depuisHz || 150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    g.gain.setValueAtTime(volume, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g).connect(vers || sortie);
    o.start(t);
    o.stop(t + 0.35);
  }

  /* Une note brève programmée à l'instant « t » (pour les effets réglés au centième de seconde). */
  function tonalite(t, frequenceHz, duree, forme, volume, versHz) {
    const c = contexte;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = forme;
    o.frequency.setValueAtTime(frequenceHz, t);
    if (versHz) o.frequency.exponentialRampToValueAtTime(versHz, t + duree);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g).connect(sortie);
    o.start(t);
    o.stop(t + duree + 0.03);
  }

  GT.musique = {
    /* À appeler pendant un toucher d'écran : le navigateur autorise alors le son pour toute la soirée. */
    debloquer() {
      const c = preparer();
      const ensuite = () => { if (GT.ambiance) GT.ambiance.reprendre(); };
      if (enSilence) return; // pendant le blind test, on laisse le synthétiseur en veille
      if (c && c.state === 'suspended') c.resume().then(ensuite, () => {}); else setTimeout(ensuite, 0);
      // Un son silencieux d'un instant : iOS exige qu'un son soit réellement « joué » pour ouvrir le robinet.
      if (c) { const o = c.createOscillator(); const g = c.createGain(); g.gain.value = 0; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.01); }
    },

    pret() { return !!contexte && contexte.state === 'running' && !enSilence; },

    /*
     * Le silence complet pendant le blind test. Sur iPhone et iPad, notre
     * synthétiseur et l'extrait d'Apple se disputent le haut-parleur :
     * tant que le synthétiseur tourne, l'extrait peut rester muet. On met
     * donc le synthétiseur entièrement en veille pendant les questions du
     * blind test, et on le réveille juste après.
     */
    silence(oui) {
      if (!contexte || enSilence === !!oui) return;
      enSilence = !!oui;
      if (enSilence) { if (GT.ambiance) GT.ambiance.suspendre(); contexte.suspend().catch(() => {}); }
      else contexte.resume().then(() => { if (GT.ambiance) GT.ambiance.reprendre(); }, () => {});
    },

    /* Jouer une mélodie (deux fois de suite, avec une pause entre les deux). */
    jouer(melodie) {
      this.arreter();
      if (!melodie) return;
      if (melodie.fichier) {
        lecteur = new Audio(melodie.fichier);
        lecteur.play().catch(() => {});
        return;
      }
      const c = preparer();
      if (!c || !melodie.notes) return;
      if (c.state === 'suspended') c.resume();
      const tempsParBattement = 60 / (melodie.tempo || 110);
      let t = c.currentTime + 0.15;
      for (let tour = 0; tour < 2; tour++) {
        melodie.notes.trim().split(/\s+/).forEach((jeton) => {
          const [note, duree] = jeton.split(':');
          const longueur = Number(duree) * tempsParBattement;
          const f = frequence(note);
          if (f) {
            const osc = c.createOscillator();
            const enveloppe = c.createGain();
            osc.type = 'triangle';
            osc.frequency.value = f;
            // L'enveloppe : attaque en 15 ms, puis une décroissance qui laisse la note respirer.
            enveloppe.gain.setValueAtTime(0.0001, t);
            enveloppe.gain.exponentialRampToValueAtTime(1, t + 0.015);
            enveloppe.gain.exponentialRampToValueAtTime(0.35, t + Math.min(0.2, longueur * 0.5));
            enveloppe.gain.exponentialRampToValueAtTime(0.0001, t + longueur * 0.95);
            osc.connect(enveloppe).connect(sortie);
            osc.start(t);
            osc.stop(t + longueur);
            enCours.push(osc);
          }
          t += longueur;
        });
        t += 1.2; // une respiration avant la reprise
      }
    },

    /*
     * Un simple « bip » pour les effets sonores (le jeu Feu vert !) :
     * une fréquence, une durée en secondes, une forme d'onde et un volume.
     */
    bip(frequenceHz, dureeS, forme, volume) {
      const c = preparer();
      if (!c) return;
      if (c.state === 'suspended') c.resume();
      const t = c.currentTime + 0.01;
      const osc = c.createOscillator();
      const enveloppe = c.createGain();
      osc.type = forme || 'sine';
      osc.frequency.value = frequenceHz;
      enveloppe.gain.setValueAtTime(0.0001, t);
      enveloppe.gain.exponentialRampToValueAtTime(volume || 0.8, t + 0.01);
      enveloppe.gain.exponentialRampToValueAtTime(0.0001, t + dureeS);
      osc.connect(enveloppe).connect(sortie);
      osc.start(t);
      osc.stop(t + dureeS + 0.02);
    },

    arreter() {
      enCours.forEach((o) => { try { o.stop(); } catch (e) { /* déjà fini */ } });
      enCours = [];
      if (lecteur) { lecteur.pause(); lecteur = null; }
    },

    /*
     * Le compte à rebours des 3 dernières secondes, façon plateau télé :
     *  • chaque seconde frappe un grand coup de grosse caisse et un « bip »
     *    qui glisse vers l'aigu (de plus en plus haut : 3, 2, 1) ;
     *  • entre deux secondes, un tic-tac qui ACCÉLÈRE (2 tics à 3, 4 tics
     *    à 2, 8 tics à 1) : le cœur s'emballe avec lui ;
     *  • à zéro, une explosion grave suivie du buzzer.
     * Pour le départ d'un jeu (« depart »), le zéro devient une fanfare.
     */
    decompte(n, depart) {
      if (!this.pret()) return;
      const c = contexte;
      const t = c.currentTime + 0.01;
      if (n > 0) {
        const hauteur = { 3: 660, 2: 880, 1: 1175 }[n] || 660;
        grosseCaisse(t, 1, sortie, 170);
        bruit(t, 0.09, 'highpass', 5000, 0.35);
        tonalite(t, hauteur, 0.2, 'square', 0.22, hauteur * 1.5);
        tonalite(t, hauteur / 2, 0.25, 'sawtooth', 0.12, hauteur * 0.75);
        const tics = { 3: 2, 2: 4, 1: 8 }[n] || 2;
        for (let k = 1; k < tics; k++) {
          const tk = t + k / tics;
          tonalite(tk, 1800 + k * 120 + (3 - n) * 300, 0.035, 'square', 0.13);
          bruit(tk, 0.04, 'highpass', 7000, 0.18);
          if (n === 1 && k % 2 === 0) grosseCaisse(tk, 0.5, sortie, 120);
        }
      } else if (depart) {
        // La fanfare du départ : un accord qui grimpe, une grosse caisse, et c'est parti !
        grosseCaisse(t, 1, sortie, 180);
        bruit(t, 0.5, 'highpass', 6000, 0.25);
        [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => {
          tonalite(t + k * 0.08, f, 0.32, 'square', 0.14);
          tonalite(t + k * 0.08, f / 2, 0.32, 'sawtooth', 0.08);
        });
        tonalite(t + 0.34, 1046.5, 0.6, 'triangle', 0.3);
        tonalite(t + 0.34, 1318.5, 0.6, 'triangle', 0.22);
      } else {
        // Temps écoulé : l'explosion, puis le buzzer qui grince.
        grosseCaisse(t, 1, sortie, 90);
        bruit(t, 0.7, 'lowpass', 900, 0.6);
        tonalite(t + 0.02, 185, 0.75, 'sawtooth', 0.26);
        tonalite(t + 0.02, 196, 0.75, 'sawtooth', 0.22);
        tonalite(t + 0.02, 92, 0.75, 'square', 0.16);
      }
    }
  };

  /*
   * ════════════════════════════════════════════════════════════════════
   *  LA MUSIQUE DE LA GUERRE DES NEURONES (composée pour le jeu)
   * ════════════════════════════════════════════════════════════════════
   *
   *  Une vraie chanson de jeu, avec sa mélodie à elle (originale : aucun
   *  morceau existant n'est copié), que la tablette joue en direct.
   *  Elle est construite comme un tube, en parties qui s'enchaînent :
   *
   *    INTRO (4 mesures)    la batterie et la basse s'installent, le son
   *                         s'ouvre peu à peu ;
   *    REFRAIN (8)          la mélodie principale, celle qu'on fredonne :
   *                         « ta-ta ta-TAM… ta-ta ta-TAAM » ;
   *    COUPLET (8)          des arpèges qui cavalent, claquements de mains ;
   *    REFRAIN+ (8)         la mélodie une octave plus haut, avec une
   *                         deuxième voix en dessous : ça décolle ;
   *    PONT (4)             la batterie se tait, une montée de souffle,
   *                         un roulement qui accélère… et tout repart.
   *
   *  À chaque tour complet, la chanson MONTE D'UN TON (comme les fins de
   *  chansons qui s'envolent), pour que la soirée ne tourne jamais en rond.
   *  Pendant la Grande Finale, elle accélère et monte encore.
   *
   *  Les accords : la mineur, fa, do, sol (le quatuor des tubes pop).
   *  Les notes sont écrites en numéros « MIDI » (60 = do du milieu du
   *  piano, +1 = un demi-ton plus haut) : transposer, c'est ajouter.
   *
   *  Le « chef d'orchestre » regarde un peu en avance (0,4 s) et programme
   *  les notes à l'avance : la musique reste régulière même si la tablette
   *  est occupée. Trois volumes : normal, doux (pendant que l'on réfléchit)
   *  et muet (blind test, Feu vert !).
   */
  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const PROGRESSION = [            // basse, puis l'accord (en MIDI)
    { basse: 45, accord: [57, 60, 64] },   // la mineur
    { basse: 41, accord: [57, 60, 65] },   // fa
    { basse: 48, accord: [55, 60, 64] },   // do
    { basse: 43, accord: [55, 59, 62] }    // sol
  ];
  // Le refrain : 8 mesures de 8 croches (null = silence ; la note dure jusqu'à la suivante).
  const REFRAIN = [
    [76, null, 76, 79, null, 81, null, 79],
    [77, null, 76, null, 72, null, 74, null],
    [76, null, 76, 79, null, 84, null, 83],
    [81, null, 79, null, 74, null, null, null],
    [76, null, 76, 79, null, 81, null, 79],
    [77, null, 81, null, 84, null, 81, null],
    [79, null, 76, null, 79, null, 84, null],
    [83, null, 86, null, 83, null, 81, 79]
  ];
  const PLAN = [                   // les parties de la chanson, en mesures
    { nom: 'refrain', mesures: 8 },
    { nom: 'couplet', mesures: 8 },
    { nom: 'refrain+', mesures: 8 },
    { nom: 'pont', mesures: 4 }
  ];
  const TOUR = PLAN.reduce((n, p) => n + p.mesures, 0);   // 28 mesures
  const INTRO = 4;
  const VOLUMES = { normal: 1.0, doux: 0.38, muet: 0 };

  let gainAmbiance = null;         // le volume général de la musique
  let filtre = null;               // l'adoucisseur commun (basse, nappes)
  let busMelodie = null;           // la mélodie, avec son écho
  let joue = false;
  let veutJouer = false;
  let niveauVoulu = 'normal';
  let enFinale = false;
  let prochainTemps = 0;
  let pas = 0;                     // le numéro de croche depuis le début
  let horloge = null;

  const tempo = () => (enFinale ? 134 : 122);
  const croche = () => 30 / tempo();

  function noteDouce(f, debut, duree, forme, volume, attaque, vers) {
    const c = contexte;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = forme;
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, debut);
    g.gain.exponentialRampToValueAtTime(volume, debut + (attaque || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    o.connect(g).connect(vers || filtre);
    o.start(debut);
    o.stop(debut + duree + 0.05);
  }

  /* Une note de la mélodie : deux ondes légèrement désaccordées, pour un son large et brillant. */
  function noteMelodie(midi, t, duree, volume) {
    const f = hz(midi);
    noteDouce(f, t, duree, 'square', volume * 0.5, 0.006, busMelodie);
    noteDouce(f * 1.004, t, duree, 'sawtooth', volume * 0.35, 0.006, busMelodie);
    noteDouce(f * 2, t, Math.min(duree, 0.12), 'sine', volume * 0.25, 0.003, busMelodie); // le petit « tic » d'attaque
  }

  /* La montée du pont : un souffle dont le filtre grimpe pendant « duree » secondes. */
  function montee(t, duree) {
    const c = contexte;
    const src = c.createBufferSource();
    src.buffer = souffle();
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.Q.value = 3;
    f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(9000, t + duree);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + duree * 0.95);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree + 0.05);
    src.connect(f).connect(g).connect(gainAmbiance);
    src.start(t);
    src.stop(t + duree + 0.1);
  }

  /* Où en est-on dans la chanson ? (partie, mesure dans la partie, transposition) */
  function ouSommesNous(mesure) {
    if (mesure < INTRO) return { nom: 'intro', m: mesure, ton: 0 };
    const k = mesure - INTRO;
    const tour = Math.floor(k / TOUR);
    let r = k % TOUR;
    let partie = PLAN[0];
    for (const p of PLAN) { if (r < p.mesures) { partie = p; break; } r -= p.mesures; }
    // Un ton de plus à chaque tour (0, +1, +2, +3, puis on repart), et +2 en Grande Finale.
    return { nom: partie.nom, m: r, ton: (tour % 4) + (enFinale ? 2 : 0), derniere: r === partie.mesures - 1 };
  }

  /* Programme une croche de musique à l'instant « t ». */
  function jouerCroche(t) {
    const mesure = Math.floor(pas / 8);
    const pos = pas % 8;
    const ici = ouSommesNous(mesure);
    const ton = ici.ton;
    const grille = PROGRESSION[ici.m % 4];
    const dc = croche();
    const fort = ici.nom === 'refrain+' || enFinale;

    // ── La batterie ──
    if (ici.nom !== 'pont') {
      if (pos % 2 === 0) grosseCaisse(t, ici.nom === 'intro' ? 0.35 : 0.5, gainAmbiance);                 // les 4 temps : le cœur qui bat
      if (ici.nom !== 'intro' && (pos === 2 || pos === 6)) bruit(t, 0.14, 'bandpass', 1500, fort ? 0.3 : 0.24, gainAmbiance); // claquements sur 2 et 4
      if (pos % 2 === 1) bruit(t, 0.09, 'highpass', 7000, 0.1, gainAmbiance);                              // charleston ouvert, à contretemps
      if (ici.nom === 'couplet' || fort) bruit(t + dc / 2, 0.025, 'highpass', 9000, 0.05, gainAmbiance);   // doubles croches : ça galope
      if (ici.derniere && pos >= 6) bruit(t + dc / 2, 0.07, 'bandpass', 2400, 0.2, gainAmbiance);          // petit roulement de fin de partie
    } else {
      // Le pont : plus de grosse caisse… une montée de souffle, puis un roulement qui accélère.
      if (ici.m === 0 && pos === 0) montee(t, dc * 8 * 4);
      if (ici.m === 3) { const n = pos < 4 ? 1 : 2; for (let k = 0; k < n; k++) bruit(t + (k * dc) / n, 0.06, 'bandpass', 1800 + pos * 200, 0.12 + pos * 0.025, gainAmbiance); }
    }

    // ── La basse : croches qui pompent, l'octave sur les contretemps ──
    if (ici.nom !== 'pont' || ici.m >= 2) {
      const b = hz(grille.basse + ton) * (pos % 2 === 1 ? 2 : 1);
      noteDouce(b, t, dc * 0.85, 'triangle', ici.nom === 'intro' ? 0.28 : 0.36, 0.004);
      noteDouce(b, t, dc * 0.6, 'sawtooth', 0.05, 0.004);
    }

    // ── Les accords : une nappe au début de la mesure, et des « stabs » à contretemps ──
    if (pos === 0) grille.accord.forEach((n) => noteDouce(hz(n + ton), t, dc * 8, 'triangle', ici.nom === 'pont' ? 0.07 : 0.035, 0.12));
