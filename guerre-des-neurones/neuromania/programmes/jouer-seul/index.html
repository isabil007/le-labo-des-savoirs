      Object.entries(this.fiches).forEach(([id, f]) => {
        const joueur = this.ctx.joueur(id);
        if (!joueur) return;
        let points = Math.max(0, f.trouvees.length * 100 - f.rates * 15);
        if (f.finiA) points += 200 + 5 * Math.round(Math.max(0, this.finA - f.finiA) / 1000);
        points = this.ctx.ajouterPoints(id, points);
        classement.push({ nom: joueur.nom, avatar: joueur.avatar, nb: f.trouvees.length, rates: f.rates, points });
        this.ctx.ecranJoueur(id, 'erreurs-solution', {
          originale: this.originale, modifiee: this.modifiee, differences: this.differences,
          trouvees: f.trouvees, points, nb: f.trouvees.length, nbErreurs: NB_ERREURS
        });
      });
      classement.sort((a, b) => b.points - a.points);
      this.ctx.ecranTablette('erreurs-fin', {
        originale: this.originale, modifiee: this.modifiee, differences: this.differences, classement, nbErreurs: NB_ERREURS
      });
      this.attendre(12000, () => this.ctx.terminer());
    }

    joueurArrive(joueurId) {
      const j = this.ctx.joueur(joueurId);
      if (this.phase !== 'jeu' || !j) return;
      this.inscrire(j);
      this.envoyerEcran(joueurId);
    }

    passer() {
      if (this.phase === 'jeu') this.fin();
      else this.ctx.terminer();
    }
  }

  Erreurs.fiche = {
    id: 'erreurs',
    nom: 'Les 7 erreurs en 1 minute',
    icone: '🔍',
    resume: 'Deux paysages presque identiques sur chaque téléphone : une minute pour trouver les sept différences.',
    regle: 'Touchez les différences sur l\'une ou l\'autre image. Attention : chaque touche à côté fait perdre quelques points !'
  };

  // On expose aussi les outils de composition, utiles aux tests et au simulateur.
  Erreurs.composerPaysage = composerPaysage;
  Erreurs.glisserErreurs = glisserErreurs;
  return Erreurs;
});

</script>
<script>/* moteur/jeux/zoom.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU 4 — Le zoom infernal
 * ════════════════════════════════════════════════════════════════════
 *
 *  La tablette montre une image énormément agrandie : on ne voit qu'une
 *  tache de couleur, un bout de texture… Puis l'image se dézoome
 *  doucement, seconde après seconde. Chaque joueur touche sur son
 *  téléphone la réponse qu'il croit bonne, UNE seule fois : sa réponse
 *  est alors validée et ne peut plus changer.
 *
 *  Plus on répond tôt (donc plus l'image est encore zoomée), plus on
 *  gagne : 200 points pour une bonne réponse à la dernière seconde,
 *  jusqu'à 1 000 points pour un éclair de génie au tout début. Une
 *  mauvaise réponse ne rapporte rien. Dès que tout le monde a répondu,
 *  l'image se dévoile entièrement et l'on passe à la suivante.
 *
 *  Le moteur choisit au hasard le point de l'image sur lequel on zoome,
 *  pour que la même image ne se ressemble jamais d'une partie à l'autre.
 *  Le dézoom lui-même est dessiné par la tablette (public/js/tablette.js),
 *  calé sur le chronomètre.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/zoom', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');
  const BANQUE = exiger('../contenus/zoom');

  const NB_IMAGES = 7;
  const ZOOM_DEPART = 14;   // l'image commence agrandie 14 fois

  class Zoom extends JeuQCM {
    constructor(ctx) {
      // Une image par famille autant que possible, pour varier les plaisirs.
      // D'abord les images jamais vues (mémoire anti-répétition), puis les autres.
      const neuves = outils.melanger(outils.nonVus('zoom', BANQUE, NB_IMAGES));
      const tirage = neuves.concat(outils.melanger(BANQUE.filter((x) => !neuves.includes(x))));
      const choisies = [];
      const familles = new Set();
      tirage.forEach((im) => { if (choisies.length < NB_IMAGES && !familles.has(im.famille)) { choisies.push(im); familles.add(im.famille); } });
      tirage.forEach((im) => { if (choisies.length < NB_IMAGES && !choisies.includes(im)) choisies.push(im); });
      outils.marquerVus('zoom', choisies);

      // Chaque image devient une question : la bonne réponse et trois intrus de la même famille.
      const questions = choisies.map((im) => {
        const cousins = BANQUE.filter((x) => x.famille === im.famille && x.sujet !== im.sujet);
        const autres = BANQUE.filter((x) => x.famille !== im.famille);
        const leurres = outils.tirer(cousins.length >= 3 ? cousins : cousins.concat(autres), 3).map((x) => x.sujet);
        return Object.assign({}, im, {
          question: 'Qu’est-ce qui se cache sous le zoom ?',
          choix: [im.sujet, ...leurres],
          // Le point visé : pas tout à fait au centre, pour corser l'affaire.
          origineX: Math.round(25 + Math.random() * 50),
          origineY: Math.round(25 + Math.random() * 50)
        });
      });
      // La vitesse compte beaucoup : 200 points garantis, jusqu'à 800 de bonus.
      super(ctx, { questions, dureeMs: 20000, revelationMs: 6000, pointsBase: 200, bonusVitesse: 800 });
    }

    vueTablette(q) {
      return {
        intitule: 'Qu’est-ce qui se cache sous le zoom ?',
        surtitre: 'Le zoom infernal',
        zoom: { image: q.image || null, photo: q.photo || null, origineX: q.origineX, origineY: q.origineY, depart: ZOOM_DEPART }
      };
    }
    consigneJoueur() { return 'Regarde la tablette… une seule réponse, alors vise juste !'; }
    explication(q) { return { titre: 'C’était… ' + q.sujet.toLowerCase() + ' !', texte: '' }; }
  }

  Zoom.fiche = {
    id: 'zoom',
    nom: 'Le zoom infernal',
    icone: '🔎',
    resume: 'Une image très agrandie qui se dévoile peu à peu : qui la reconnaîtra en premier ?',
    regle: 'L\'image commence très zoomée puis se dézoome. Touchez la bonne réponse sur votre téléphone : une seule réponse par image, et plus vous êtes rapide, plus vous gagnez !'
  };

  return Zoom;
});

</script>

<script>/* moteur/jeux/reflexe.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU 6 — Feu vert ! (le jeu de réflexe)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Chaque téléphone devient un gros bouton. La tablette bat comme un
 *  cœur : « Attention… ». Puis, à un moment imprévisible, TOUT passe au
 *  VERT : il faut taper sur son téléphone le plus vite possible.
 *
 *    • Le plus rapide gagne 500 points, le deuxième 350, le troisième
 *      250, les suivants 150 (s'ils tapent avant la fin du temps).
 *    • Taper AVANT le vert, c'est un FAUX DÉPART : −100 points, et l'on
 *      est éliminé de ce tour.
 *    • De temps en temps, l'écran passe au ROUGE : c'est un PIÈGE !
 *      Celui qui tape sur le rouge fait aussi un faux départ.
 *
 *  Une question d'équité : selon le Wi-Fi, un téléphone reçoit le signal
 *  quelques centièmes de seconde plus tôt ou plus tard qu'un autre. Pour
 *  ne désavantager personne, chaque téléphone chronomètre lui-même le
 *  temps entre l'instant où IL a affiché le vert et le toucher du doigt.
 *  Le moteur vérifie ce temps (il ne peut pas dépasser le temps réel
 *  écoulé, ni être plus court qu'un réflexe humain possible).
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/reflexe', function (exiger) {
  'use strict';
  const { Jeu } = exiger('../jeux/base');

  const NB_TOURS = 7;
  const ATTENTE_MIN = 2000, ATTENTE_MAX = 5500;   // l'attente avant le signal, tirée au hasard
  const PIEGE_MS = 1300;                          // la durée du faux signal rouge
  const FENETRE_MS = 2500;                        // le temps pour taper une fois le vert affiché
  const RESULTAT_MS = 3800;                       // le temps d'affichage des résultats d'un tour
  const REFLEXE_MIN = 90;                         // en dessous de 90 ms, ce n'est pas un réflexe, c'est de l'anticipation !
  const PENALITE = 100;
  const BAREME = [500, 350, 250];
  const POINTS_SUIVANTS = 150;
  const CHANCE_PIEGE = 0.3;

  const hasard = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

  class Reflexe extends Jeu {
    constructor(ctx, options) {
      super(ctx);
      // Les réglages de temps peuvent être raccourcis pour les tests automatiques.
      this.t = Object.assign({ attenteMin: ATTENTE_MIN, attenteMax: ATTENTE_MAX, piegeMs: PIEGE_MS, fenetreMs: FENETRE_MS, resultatMs: RESULTAT_MS }, options || Reflexe.reglagesTest || {});
      this.tour = 0;
      this.phase = 'pause';
    }

    demarrer() { this.tourSuivant(); }

    tourSuivant() {
      this.tour++;
      if (this.tour > NB_TOURS) return this.ctx.terminer();
      this.phase = 'attente';
      this.temps = new Map();      // joueurId → réflexe en millisecondes
      this.faux = new Map();       // joueurId → 'avant' | 'piege'
      this.piegeFait = false;
      const commun = { tour: this.tour, total: NB_TOURS };
      this.ctx.ecranTablette('reflexe-attente', commun);
      this.ctx.ecranTousJoueurs('reflexe-bouton', commun);
      this.programmerSignal();
    }

    /* L'attente imprévisible… avec parfois un piège rouge au milieu. */
    programmerSignal() {
      const attente = hasard(this.t.attenteMin, this.t.attenteMax);
      const piege = !this.piegeFait && this.tour > 1 && Math.random() < CHANCE_PIEGE;
      if (piege) {
        this.attendre(Math.round(attente * 0.6), () => this.lancerPiege());
      } else {
        this.attendre(attente, () => this.lancerSignal());
      }
    }

    lancerPiege() {
      this.phase = 'piege';
      this.piegeFait = true;
      this.ctx.evenementTablette('reflexe-piege', {});
      this.ctx.joueurs().forEach((j) => this.ctx.evenementJoueur(j.id, 'reflexe-piege', {}));
      this.attendre(this.t.piegeMs, () => {
        if (this.phase !== 'piege') return;
        this.phase = 'attente';
        this.ctx.evenementTablette('reflexe-calme', {});
        this.ctx.joueurs().forEach((j) => this.ctx.evenementJoueur(j.id, 'reflexe-calme', {}));
        this.attendre(hasard(Math.round(this.t.attenteMin / 2), this.t.attenteMax), () => this.lancerSignal());
      });
    }

    lancerSignal() {
      this.phase = 'go';
      this.depart = Date.now();
      this.ctx.evenementTablette('reflexe-go', {});
      this.ctx.joueurs().forEach((j) => this.ctx.evenementJoueur(j.id, 'reflexe-go', {}));
      this.attendre(this.t.fenetreMs, () => this.finDuTour());
    }

    action(joueurId, d) {
      if (!d || d.type !== 'tape') return;
      if (this.temps.has(joueurId) || this.faux.has(joueurId)) return; // une seule tape par tour
      if (this.phase === 'attente' || this.phase === 'piege') return this.fauxDepart(joueurId, this.phase === 'piege' ? 'piege' : 'avant');
      if (this.phase !== 'go') return;
      const ecoule = Date.now() - this.depart;
      let reflexe = Number(d.reflexe);
      if (!(reflexe >= 0)) reflexe = ecoule;
      reflexe = Math.min(reflexe, ecoule + 60); // jamais plus rapide que le temps réellement écoulé (avec une petite marge réseau)
      if (reflexe < REFLEXE_MIN) return this.fauxDepart(joueurId, 'anticipation');
      this.temps.set(joueurId, Math.round(reflexe));
      this.ctx.ecranJoueur(joueurId, 'info', { titre: '⚡ ' + (reflexe / 1000).toFixed(3).replace('.', ',') + ' s', texte: 'Touché ! Résultat dans un instant…' });
      this.ctx.evenementTablette('reflexe-tape', { nb: this.temps.size });
      // Tout le monde a tapé (ou s'est fait éliminer) : inutile d'attendre la fin du temps.
      const restants = this.ctx.joueurs().filter((j) => !this.temps.has(j.id) && !this.faux.has(j.id));
      if (!restants.length) { this.annulerMinuteurs(); this.attendre(300, () => this.finDuTour()); }
    }

    fauxDepart(joueurId, raison) {
      const j = this.ctx.joueur(joueurId);
      if (!j) return;
      this.faux.set(joueurId, raison);
      const perte = Math.min(PENALITE, Math.max(0, j.score));
      if (perte) this.ctx.ajouterPoints(joueurId, -perte);
      const titre = raison === 'piege' ? '🟥 Piégé !' : '🚫 Faux départ !';
      const texte = raison === 'piege' ? 'Tu as tapé sur le rouge… −' + perte + ' points.' : raison === 'anticipation' ? 'Trop rapide pour être honnête ! −' + perte + ' points.' : 'Il fallait attendre le vert ! −' + perte + ' points.';
      this.ctx.ecranJoueur(joueurId, 'info', { titre, texte });
      this.ctx.evenementTablette('reflexe-faux', { nom: j.nom, avatar: j.avatar, raison });
    }

    finDuTour() {
      if (this.phase === 'resultat') return;
      this.phase = 'resultat';
      this.annulerMinuteurs();
      const classement = Array.from(this.temps.entries()).sort((a, b) => a[1] - b[1]).map(([id, ms], rang) => {
        const j = this.ctx.joueur(id);
        const points = this.ctx.ajouterPoints(id, rang < BAREME.length ? BAREME[rang] : POINTS_SUIVANTS);
        return { id, nom: j ? j.nom : '?', avatar: j ? j.avatar : '❔', ms, points };
      });
      const faux = Array.from(this.faux.entries()).map(([id, raison]) => { const j = this.ctx.joueur(id); return { nom: j ? j.nom : '?', avatar: j ? j.avatar : '❔', raison }; });
      this.ctx.ecranTablette('reflexe-resultat', { tour: this.tour, total: NB_TOURS, classement, faux, dernier: this.tour >= NB_TOURS });
      this.ctx.joueurs().forEach((j) => {
        const rang = classement.findIndex((c) => c.id === j.id);
        if (rang >= 0) this.ctx.ecranJoueur(j.id, 'info', { titre: (rang === 0 ? '🥇 Le plus rapide ! ' : GT_RANG(rang + 1) + ' · ') + '+' + classement[rang].points, texte: 'Ton réflexe : ' + (classement[rang].ms / 1000).toFixed(3).replace('.', ',') + ' s', score: j.score });
        else if (!this.faux.has(j.id)) this.ctx.ecranJoueur(j.id, 'info', { titre: '😴 Trop tard !', texte: 'Le vert est passé sans toi… Reste concentré !', score: j.score });
      });
      this.attendre(this.t.resultatMs, () => this.tourSuivant());
    }

    /* Un joueur qui arrive en cours de route attend le tour suivant devant son bouton. */
    joueurArrive(joueurId) {
      this.ctx.ecranJoueur(joueurId, 'reflexe-bouton', { tour: this.tour, total: NB_TOURS, enRetard: this.phase !== 'attente' });
    }

    /* « Passer » : on termine le tour en cours tout de suite. */
    passer() {
      if (this.phase === 'resultat') { this.annulerMinuteurs(); this.tourSuivant(); }
      else this.finDuTour();
    }
  }

  const GT_RANG = (n) => (n === 1 ? '1er' : n + 'e');

  Reflexe.fiche = {
    id: 'reflexe',
    nom: 'Feu vert !',
    icone: '🚦',
    resume: 'Un jeu de réflexe qui fait battre le cœur : attendez le vert… et tapez !',
    regle: 'Gardez le doigt prêt au-dessus du téléphone. Dès que l\'écran passe au VERT, tapez le plus vite possible ! Taper trop tôt ou sur le ROUGE, c\'est un faux départ : −100 points.'
  };

  return Reflexe;
});

</script>
<script>/* moteur/jeux/memoire.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — La mémoire d'éléphant 🐘
 * ════════════════════════════════════════════════════════════════════
 *
 *  Une grille d'objets s'affiche quelques secondes sur la tablette ET sur
 *  chaque téléphone : « Mémorisez ! ». Puis elle disparaît, et vient la
 *  question piège :
 *    • « Lequel n'était PAS sur la table ? »
 *    • « Lequel ÉTAIT sur la table ? »
 *    • « Qu'y avait-il en haut à gauche ? » (ou au centre, en bas à droite…)
 *    • « Combien de 🍎 y avait-il ? »
 *  Au fil des tours, la grille grandit (6, puis 9, puis 12 objets) et le
 *  temps pour la regarder raccourcit. Rien n'est écrit à l'avance : le
 *  moteur fabrique chaque grille et chaque question au hasard, et la
 *  bonne réponse est juste par construction. On peut y jouer mille fois.
 *
 *  Toute la mécanique des réponses (chronomètre, points selon la
 *  rapidité, révélation) vient du moule JeuQCM ; ce fichier ajoute
 *  seulement la phase « Mémorisez ! » avant chaque question.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/memoire', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');

  /* Les objets que l'on pose sur la table : faciles à reconnaître et à nommer. */
  const OBJETS = [
    ['🍎', 'Une pomme'], ['🎈', 'Un ballon'], ['🐱', 'Un chat'], ['🚗', 'Une voiture'], ['⭐', 'Une étoile'],
    ['🌂', 'Un parapluie'], ['🎸', 'Une guitare'], ['🐟', 'Un poisson'], ['🍕', 'Une pizza'], ['🔑', 'Une clé'],
    ['🌻', 'Un tournesol'], ['⚽', 'Un ballon de foot'], ['🎩', 'Un chapeau'], ['📚', 'Des livres'], ['🦆', 'Un canard'],
    ['🍌', 'Une banane'], ['🚲', 'Un vélo'], ['⏰', 'Un réveil'], ['🧦', 'Une chaussette'], ['🥕', 'Une carotte'],
    ['🐌', 'Un escargot'], ['🎁', 'Un cadeau'], ['🍦', 'Une glace'], ['🦋', 'Un papillon'], ['☕', 'Une tasse'], ['🐸', 'Une grenouille']
  ];
  const NB_TOURS = 7;
  // Pour chaque tour : la taille de la grille et le temps pour la regarder.
  const NIVEAUX = [
    { colonnes: 3, lignes: 2, ms: 7000 }, { colonnes: 3, lignes: 2, ms: 6000 },
    { colonnes: 3, lignes: 3, ms: 7000 }, { colonnes: 3, lignes: 3, ms: 6000 }, { colonnes: 3, lignes: 3, ms: 5500 },
    { colonnes: 4, lignes: 3, ms: 7000 }, { colonnes: 4, lignes: 3, ms: 6500 }
  ];
  const libelle = (o) => o[0] + ' ' + o[1];

  /* Les noms des cases, pour les questions « où était… ? ». */
  function nomsDesCases(colonnes, lignes) {
    const noms = {};
    noms[0] = 'en haut à gauche';
    noms[colonnes - 1] = 'en haut à droite';
    noms[(lignes - 1) * colonnes] = 'en bas à gauche';
    noms[lignes * colonnes - 1] = 'en bas à droite';
    if (colonnes % 2 === 1 && lignes % 2 === 1) noms[Math.floor(lignes / 2) * colonnes + Math.floor(colonnes / 2)] = 'au centre';
    return noms;
  }

  /* Fabrique une manche complète : la grille à retenir et la question qui va avec. */
  function fabriquerManche(niveau, type) {
    const n = niveau.colonnes * niveau.lignes;
    let cases, question, bonne, intrus;
    if (type === 'compter') {
      // Un objet est répété 2 à 4 fois, les autres cases sont toutes différentes.
      const [cible, ...autres] = outils.melanger(OBJETS);
      const fois = 2 + Math.floor(Math.random() * 3);
      cases = outils.melanger([...Array(fois).fill(cible), ...autres.slice(0, n - fois)]);
      question = 'Combien de ' + cible[0] + ' y avait-il ?';
      bonne = String(fois);
      intrus = outils.melanger([fois - 1, fois + 1, fois + 2, fois - 2].filter((x) => x >= 1 && x !== fois)).slice(0, 3).map(String);
    } else {
      const tirage = outils.melanger(OBJETS);
      cases = tirage.slice(0, n);
      const absents = tirage.slice(n);
      if (type === 'absent') {
        const a = absents[0];
        question = 'Lequel n’était PAS sur la table ?';
        bonne = libelle(a);
        intrus = outils.tirer(cases, 3).map(libelle);
      } else if (type === 'present') {
        const p = outils.tirer(cases, 1)[0];
        question = 'Lequel ÉTAIT sur la table ?';
        bonne = libelle(p);
        intrus = absents.slice(0, 3).map(libelle);
      } else {
        const noms = nomsDesCases(niveau.colonnes, niveau.lignes);
        const position = Number(outils.tirer(Object.keys(noms), 1)[0]);
        question = 'Qu’y avait-il ' + noms[position] + ' ?';
        bonne = libelle(cases[position]);
        intrus = outils.tirer(cases.filter((c, i) => i !== position), 3).map(libelle);
      }
    }
    // La grille, ligne par ligne, pour l'affichage.
    const grille = [];
    for (let l = 0; l < niveau.lignes; l++) grille.push(cases.slice(l * niveau.colonnes, (l + 1) * niveau.colonnes).map((o) => o[0]));
    return { question, choix: [bonne, ...intrus], illustration: { lignes: grille, colonnes: niveau.colonnes }, memoMs: niveau.ms };
  }

  class Memoire extends JeuQCM {
    constructor(ctx) {
      // Un mélange de types de questions, jamais deux fois le même d'affilée si possible.
      const types = [];
      const sac = () => outils.melanger(['absent', 'present', 'position', 'compter']);
      while (types.length < NB_TOURS) sac().forEach((t) => { if (types.length < NB_TOURS && t !== types[types.length - 1]) types.push(t); });
      const questions = NIVEAUX.slice(0, NB_TOURS).map((niv, i) => fabriquerManche(niv, types[i]));
      super(ctx, { questions, dureeMs: 15000, revelationMs: 6500, pointsBase: 300, bonusVitesse: 700 });
      this.dejaMontre = -1;
    }

    /*
     * Avant chaque question : la phase « Mémorisez ! ». La grille s'affiche
     * partout pendant quelques secondes, puis la question (sans la grille).
     */
    questionSuivante() {
      const prochaine = this.index + 1;
      if (prochaine >= this.questions.length || this.dejaMontre === prochaine) return super.questionSuivante();
      this.dejaMontre = prochaine;
      this.phase = 'memorisation';
      const q = this.questions[prochaine];
      const finA = Date.now() + q.memoMs;
      const donnees = { illustration: q.illustration, finA, dureeMs: q.memoMs, numero: prochaine + 1, total: this.questions.length };
      this.ctx.ecranTablette('memoire-montre', donnees);
      this.ctx.ecranTousJoueurs('memoire-montre', donnees);
      this.attendre(q.memoMs, () => super.questionSuivante());
    }

    vueTablette(q) { return { intitule: q.question, surtitre: '🐘 Mémoire d’éléphant' }; }
    // À la révélation, on remontre la grille : chacun voit ce qu'il a oublié !
    vueRevelation(q) { return Object.assign(this.vueTablette(q), { illustration: q.illustration }); }
    consigneJoueur() { return 'Fais appel à ta mémoire !'; }
    explication() { return { titre: 'Voici ce qu’il fallait retenir :', texte: '' }; }
  }

  Memoire.fiche = {
    id: 'memoire',
    nom: 'Mémoire d’éléphant',
    icone: '🐘',
    resume: 'Une grille d’objets à mémoriser en quelques secondes… puis la question piège.',
    regle: 'Regardez bien la grille : elle va disparaître ! Ensuite, répondez à la question sur votre téléphone. La grille grandit à chaque tour.'
  };
  Memoire.fabriquerManche = fabriquerManche; // pour les tests
  Memoire.NIVEAUX = NIVEAUX;

  return Memoire;
});

</script>
<script>/* moteur/jeux/logique.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Casse-tête 🧩 (le jeu de logique)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Quatre familles d'énigmes, toutes FABRIQUÉES par le moteur au moment
 *  de jouer (aucune liste à apprendre par cœur, aucune énigme deux fois
 *  pareille) :
 *
 *   • La suite logique : 3, 7, 11, 15, ?  —  2, 6, 18, 54, ?  —  1, 4, 9, 16, ?
 *   • Le motif à compléter : 🔴 🔵 🔴 🔵 🔴 ?  —  ⭐ ⭐ 🌙 ⭐ ⭐ ?
 *   • La balance (des équations en images) :
 *         🍎 + 🍎 = 10
 *         🍎 + 🍌 = 8
 *         🍌 = ?
 *   • L'intrus : 🐶 🐱 🐰 🚗 — lequel n'est pas comme les autres ?
 *
 *  Chaque énigme est construite à partir de sa solution : la bonne réponse
 *  est donc toujours juste, et les mauvaises réponses sont choisies pour
 *  être vraisemblables (le résultat d'une règle voisine, un voisin du bon
 *  nombre…). La difficulté monte doucement au fil des 7 énigmes.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/logique', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');

  const NB_ENIGMES = 7;
  const hasard = (min, max) => min + Math.floor(Math.random() * (max - min + 1));

  /* Trois intrus numériques plausibles et tous différents de la bonne réponse. */
  function leurresNombres(bonne, idees) {
    const pris = new Set([bonne]);
    const leurres = [];
    [...idees, bonne + 1, bonne - 1, bonne + 2, bonne - 2, bonne + 10, bonne * 2]
      .forEach((x) => { if (leurres.length < 3 && Number.isInteger(x) && x >= 0 && !pris.has(x)) { pris.add(x); leurres.push(x); } });
    return leurres.map(String);
  }

  /* ─── 1. La suite logique ─── */
  function suite(difficulte) {
    const regles = [
      () => { const d = hasard(2, 9), a = hasard(1, 12); return { termes: [0, 1, 2, 3, 4].map((i) => a + i * d), suivant: a + 5 * d, voisins: [a + 5 * d + 1, a + 4 * d + d - 1, a + 6 * d], explication: 'On ajoute ' + d + ' à chaque fois.' }; },
      () => { const d = hasard(2, 7), a = hasard(40, 70); return { termes: [0, 1, 2, 3, 4].map((i) => a - i * d), suivant: a - 5 * d, voisins: [a - 5 * d - 1, a - 6 * d, a - 4 * d], explication: 'On retire ' + d + ' à chaque fois.' }; },
      () => { const r = hasard(2, 3), a = hasard(1, 3); return { termes: [0, 1, 2, 3].map((i) => a * Math.pow(r, i)), suivant: a * Math.pow(r, 4), voisins: [a * Math.pow(r, 3) + a * Math.pow(r, 2), a * Math.pow(r, 3) * (r + 1)], explication: 'On multiplie par ' + r + ' à chaque fois.' }; },
      () => { const a = hasard(1, 3); return { termes: [0, 1, 2, 3, 4].map((i) => (a + i) * (a + i)), suivant: (a + 5) * (a + 5), voisins: [(a + 5) * (a + 5) - 1, (a + 4) * (a + 4) + 2 * (a + 4)], explication: 'Ce sont les carrés : ' + a + '×' + a + ', ' + (a + 1) + '×' + (a + 1) + '…' }; },
      () => { const a = hasard(1, 4), b = hasard(1, 5); const t = [a, b]; while (t.length < 6) t.push(t[t.length - 1] + t[t.length - 2]); return { termes: t.slice(0, 5), suivant: t[5], voisins: [t[4] + t[2], t[4] * 2], explication: 'Chaque nombre est la somme des deux précédents.' }; },
      () => { const a = hasard(1, 10); const t = [a]; for (let i = 1; i < 6; i++) t.push(t[i - 1] + i); return { termes: t.slice(0, 5), suivant: t[5], voisins: [t[4] + 4, t[4] + 6], explication: 'On ajoute 1, puis 2, puis 3, puis 4… (l’écart grandit de 1).' }; },
      () => { const p = hasard(3, 6), m = hasard(1, p - 1), a = hasard(1, 10); const t = [a]; for (let i = 1; i < 6; i++) t.push(t[i - 1] + (i % 2 ? p : -m)); return { termes: t.slice(0, 5), suivant: t[5], voisins: [t[4] - m, t[4] + p - m + 1], explication: 'On ajoute ' + p + ', puis on retire ' + m + ', et ainsi de suite.' }; }
    ];
    // Les règles simples d'abord, les plus retorses ensuite.
    const choisie = difficulte < 2 ? regles[hasard(0, 1)] : difficulte < 4 ? regles[hasard(0, 3)] : regles[hasard(2, 6)];
    const s = choisie();
    return {
      question: 'Quel nombre vient ensuite ?',
      choix: [String(s.suivant), ...leurresNombres(s.suivant, s.voisins)],
      illustration: { lignes: [[...s.termes.map(String), '?']] },
      explication: s.explication
    };
  }

  /* ─── 2. Le motif à compléter ─── */
  const SYMBOLES = ['🔴', '🔵', '🟡', '🟢', '⭐', '🌙', '❤️', '🍀', '🔺', '🟪'];
  function motif(difficulte) {
    const gabarits = difficulte < 3 ? ['AB', 'AAB', 'ABC'] : ['AABB', 'ABAC', 'ABCB', 'AABC', 'ABBC'];
    const gabarit = outils.tirer(gabarits, 1)[0];
    const lettres = Array.from(new Set(gabarit));
    const symboles = outils.tirer(SYMBOLES, lettres.length + 1);
    const carte = {};
    lettres.forEach((l, i) => { carte[l] = symboles[i]; });
    const longueur = Math.max(7, gabarit.length * 2 + 1);
    const sequence = Array.from({ length: longueur + 1 }, (_, i) => carte[gabarit[i % gabarit.length]]);
    const bonne = sequence[longueur];
    const autres = [...new Set(lettres.map((l) => carte[l]).concat(symboles[lettres.length]).filter((x) => x !== bonne))];
    const leurres = outils.melanger(autres).concat(outils.tirer(SYMBOLES.filter((x) => x !== bonne && !autres.includes(x)), 3)).slice(0, 3);
    return {
      question: 'Quel symbole complète la suite ?',
      choix: [bonne, ...leurres],
      illustration: { lignes: [[...sequence.slice(0, longueur), '?']] },
      explication: 'Le motif « ' + gabarit.split('').map((l) => carte[l]).join(' ') + ' » se répète.'
    };
  }

  /* ─── 3. La balance (des équations en images) ─── */
  const FRUITS = ['🍎', '🍌', '🍐', '🍓', '🍊', '🍇', '🥝', '🍒'];
  function balance(difficulte) {
    const [x, y, z] = outils.tirer(FRUITS, 3);
    const a = hasard(2, 9);
    let b = hasard(1, 9); while (b === a) b = hasard(1, 9);
    if (difficulte < 3) {
      // Deux lignes : x + x = 2a ; x + y = a + b ; y = ?
      return {
        question: 'Combien vaut ' + y + ' ?',
        choix: [String(b), ...leurresNombres(b, [a, a + b, 2 * a - b])],
        illustration: { lignes: [[x, '+', x, '=', String(2 * a)], [x, '+', y, '=', String(a + b)], [y, '=', '?']] },
        explication: x + ' vaut ' + a + ' (car ' + a + ' + ' + a + ' = ' + 2 * a + '), donc ' + y + ' vaut ' + (a + b) + ' − ' + a + ' = ' + b + '.'
      };
    }
    // Trois lignes : x+x+x = 3a ; x + y = a+b ; y + z = b+c ; z = ?
    let c = hasard(1, 9); while (c === a || c === b) c = hasard(1, 9);
    return {
      question: 'Combien vaut ' + z + ' ?',
      choix: [String(c), ...leurresNombres(c, [b, a, b + c])],
      illustration: { lignes: [[x, '+', x, '+', x, '=', String(3 * a)], [x, '+', y, '=', String(a + b)], [y, '+', z, '=', String(b + c)], [z, '=', '?']] },
      explication: x + ' = ' + a + ', donc ' + y + ' = ' + b + ', donc ' + z + ' = ' + (b + c) + ' − ' + b + ' = ' + c + '.'
    };
  }

  /* ─── 4. L'intrus ─── */
  const FAMILLES = {
    'des animaux': ['🐶', '🐱', '🐰', '🐻', '🦊', '🐷', '🐮', '🐵'],
    'des fruits': ['🍎', '🍌', '🍐', '🍓', '🍊', '🍇', '🍒', '🍍'],
    'des véhicules': ['🚗', '🚲', '🚌', '✈️', '🚂', '🚁', '⛵', '🛵'],
    'des instruments de musique': ['🎸', '🎹', '🥁', '🎺', '🎻', '🎷'],
    'la météo': ['☀️', '🌧️', '❄️', '⛈️', '🌈', '🌪️', '🌤️'],
    'des sports': ['⚽', '🏀', '🎾', '🏐', '🏈', '🏓', '🥊'],
    'des légumes': ['🥕', '🥦', '🌽', '🥔', '🍆', '🥒', '🧅']
  };
  function intrus() {
    const [famille, autre] = outils.tirer(Object.keys(FAMILLES), 2);
    const membres = outils.tirer(FAMILLES[famille], 4);
    const lIntrus = outils.tirer(FAMILLES[autre], 1)[0];
    const ligne = outils.melanger([...membres, lIntrus]);
    return {
      question: 'Lequel est l’intrus ?',
      choix: [lIntrus, ...outils.tirer(membres, 3)],
      illustration: { lignes: [ligne] },
      explication: 'Tous les autres sont ' + famille + '.'
    };
  }

  class Logique extends JeuQCM {
    constructor(ctx) {
      // Un programme varié : chaque famille d'énigmes revient, dans un ordre surprenant.
      const familles = outils.melanger(['suite', 'motif', 'balance', 'intrus', 'suite', 'balance', 'motif']).slice(0, NB_ENIGMES);
      const questions = familles.map((f, i) => (f === 'suite' ? suite(i) : f === 'motif' ? motif(i) : f === 'balance' ? balance(i) : intrus()));
      super(ctx, { questions, dureeMs: 25000, revelationMs: 8000, pointsBase: 300, bonusVitesse: 700 });
    }
    vueTablette(q) { return { intitule: q.question, surtitre: '🧩 Casse-tête', illustration: q.illustration }; }
    consigneJoueur() { return 'Réfléchis… mais pas trop longtemps !'; }
    explication(q) { return { titre: 'La solution : ' + q.choix[q.bonne], texte: q.explication }; }
  }

  Logique.fiche = {
    id: 'logique',
    nom: 'Casse-tête',
    icone: '🧩',
    resume: 'Suites de nombres, motifs, balances et intrus : des énigmes toujours nouvelles.',
    regle: 'Trouvez la logique cachée : le nombre qui suit, le symbole qui manque, la valeur d’un fruit, ou l’intrus. Plus vous êtes rapide, plus vous gagnez !'
  };
  Logique.fabriquer = { suite, motif, balance, intrus }; // pour les tests

  return Logique;
});

</script>
<script>/* moteur/jeux/gastronomie.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Les Toqués 👨‍🍳 (la gastronomie)
 * ════════════════════════════════════════════════════════════════════
 *
 *  Huit plats au menu, en alternance :
 *
 *   • LA RECETTE MYSTÈRE : les ingrédients apparaissent un à un, toutes
 *     les deux secondes et demie, sur la tablette et les téléphones…
 *     🧂 … 🥓 … 🥚 … 🧀 … 🍝 : « Les spaghettis carbonara ! »
 *     Qui ose répondre dès le deuxième ingrédient gagne gros ; qui attend
 *     le dernier joue la sécurité. Les mauvaises réponses proposées sont
 *     des plats qui partagent des ingrédients avec le bon : le piège est
 *     réel.
 *
 *   • LE QUIZ GOURMAND : des questions de cuisine, belges et du monde.
 *
 *  Les banques sont dans moteur/contenus/gastronomie.js.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/gastronomie', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');
  const { RECETTES, QUIZ } = exiger('../contenus/gastronomie');

  const APPARITION_MS = 2500;

  /* Les plats qui ressemblent le plus au bon (le plus d'ingrédients en commun) font les meilleurs pièges. */
  function platsVoisins(recette) {
    const communs = (r) => r.ingredients.filter((i) => recette.ingredients.includes(i)).length;
    const autres = outils.melanger(RECETTES.filter((r) => r.plat !== recette.plat));
    autres.sort((a, b) => communs(b) - communs(a));
    return autres.slice(0, 3).map((r) => r.plat);
  }

  class Gastronomie extends JeuQCM {
    constructor(ctx) {
      const recettes = outils.tirerNeuf('recettes', RECETTES, 4).map((r) => ({
        type: 'recette', question: 'Quelle est cette recette mystère ?',
        choix: [r.plat, ...platsVoisins(r)], illustration: { lignes: [r.ingredients], apparitionMs: APPARITION_MS }, anecdote: r.anecdote
      }));
      const quiz = outils.tirerNeuf('gastronomie', QUIZ, 4).map((q) => Object.assign({ type: 'quiz' }, q));
      // Une recette, une question, une recette, une question… pour varier le rythme.
      const questions = [];
      recettes.forEach((r, i) => { questions.push(r); questions.push(quiz[i]); });
      super(ctx, { questions, dureeMs: 20000, revelationMs: 8000, pointsBase: 300, bonusVitesse: 700 });
    }
    vueTablette(q) {
      return q.type === 'recette'
        ? { intitule: q.question, surtitre: '👨‍🍳 La recette mystère', illustration: q.illustration }
        : { intitule: q.question, surtitre: '👨‍🍳 Le quiz gourmand' };
    }
    // À la révélation, tous les ingrédients sont visibles d'un coup.
    vueRevelation(q) {
      const v = this.vueTablette(q);
      if (v.illustration) v.illustration = { lignes: v.illustration.lignes };
      return v;
    }
    consigneJoueur(q) { return q.type === 'recette' ? 'Les ingrédients arrivent… ose répondre tôt !' : 'À vos fourneaux !'; }
    explication(q) { return { titre: q.type === 'recette' ? 'C’était… ' + q.choix[q.bonne].toLowerCase() + ' !' : 'Le saviez-vous ?', texte: q.anecdote || '' }; }
  }

  Gastronomie.fiche = {
    id: 'gastronomie',
    nom: 'Les Toqués',
    icone: '👨‍🍳',
    resume: 'Recettes mystère et quiz gourmand : de la gaufre de Liège aux sushis.',
    regle: 'Recette mystère : les ingrédients apparaissent un à un, devinez le plat le plus tôt possible ! Entre deux recettes, une question gourmande.'
  };

  return Gastronomie;
});

</script>
<script>/* moteur/jeux/blindtest.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Le blind test des tubes 🎵 (de 1960 à aujourd'hui)
 * ════════════════════════════════════════════════════════════════════
 *
 *  La tablette joue l'extrait officiel de 30 secondes d'un tube (fourni
 *  par Apple, voir contenus/tubes.js) ; sur les téléphones, quatre
 *  propositions. Une fois sur deux, il faut trouver le TITRE ; l'autre
 *  fois, l'ARTISTE. Les mauvaises réponses viennent de la même décennie,
 *  pour que l'oreille compte plus que la culture générale.
 *
 *  Le tirage parcourt les époques : un peu de sixties pour les
 *  grands-parents, du disco, des années 80, et les tubes d'aujourd'hui
 *  pour les petits-enfants. Chaque génération a son moment de gloire.
 *
 *  Si la tablette ne trouve pas l'extrait (pas d'Internet, chanson
 *  introuvable…), elle prévient le moteur (« extrait-indisponible ») :
 *  la question est sautée sans pénaliser personne. Après trois échecs
 *  d'affilée, le jeu s'arrête de lui-même plutôt que de tourner à vide.
 *
 *  Pour éviter qu'un petit malin lise la réponse dans les données reçues
 *  par son téléphone, seule la TABLETTE sait quelle chanson est jouée.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/blindtest', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');
  const TUBES = exiger('../contenus/tubes');

  const NB_EXTRAITS = 8;
  const decennie = (t) => Math.floor(t.annee / 10) * 10;
  const nomDecennie = (d) => (d >= 2000 ? 'années ' + d : 'années ' + String(d).slice(2));

  /* Huit tubes, en passant par toutes les époques (une décennie après l'autre, au hasard). */
  function tirerTubes() {
    const parDecennie = {};
    // Les tubes jamais joués passent devant (mémoire anti-répétition).
    const neufs = outils.melanger(outils.nonVus('tubes', TUBES, NB_EXTRAITS));
    neufs.concat(outils.melanger(TUBES.filter((t) => !neufs.includes(t)))).forEach((t) => { (parDecennie[decennie(t)] = parDecennie[decennie(t)] || []).push(t); });
    const decennies = outils.melanger(Object.keys(parDecennie));
    const choisis = [];
    for (let tour = 0; choisis.length < NB_EXTRAITS && tour < 10; tour++) {
      decennies.forEach((d) => { const t = parDecennie[d][tour]; if (t && choisis.length < NB_EXTRAITS) choisis.push(t); });
    }
    outils.marquerVus('tubes', choisis);
    return outils.melanger(choisis);
  }

  /* Trois mauvaises réponses de la même époque (ou voisine), toutes différentes de la bonne. */
  function leurres(tube, champ) {
    const bonne = tube[champ];
    const proches = outils.melanger(TUBES.filter((t) => t[champ] !== bonne))
      .sort((a, b) => Math.abs(a.annee - tube.annee) - Math.abs(b.annee - tube.annee));
    const pris = new Set([bonne]);
    const res = [];
    proches.forEach((t) => { if (res.length < 3 && !pris.has(t[champ])) { pris.add(t[champ]); res.push(t[champ]); } });
    return res;
  }

  class BlindTest extends JeuQCM {
    constructor(ctx) {
      const questions = tirerTubes().map((t, i) => {
        const champ = i % 2 === 0 ? 'titre' : 'artiste';
        return Object.assign({}, t, {
          champ,
          question: champ === 'titre' ? 'Quel est ce titre ?' : 'Qui chante ce tube ?',
          choix: [t[champ], ...leurres(t, champ)]
        });
      });
      super(ctx, { questions, dureeMs: 25000, revelationMs: 9000, pointsBase: 300, bonusVitesse: 700 });
      this.echecsDeSuite = 0;
    }

    /* Une question arrivée jusqu'à la réponse : l'extrait a donc bien été trouvé. */
    reveler() {
      if (this.phase === 'question') this.echecsDeSuite = 0;
      super.reveler();
    }

    vueTablette(q) {
      return {
        intitule: q.question,
        surtitre: '🎵 Blind test · ' + nomDecennie(decennie(q)),
        // La tablette cherche et joue l'extrait. Elle renvoie le numéro de la question en cas d'échec.
        extrait: { artiste: q.artiste, titre: q.titre, numero: this.questions.indexOf(q) }
      };
    }
    // Les téléphones ne reçoivent ni le titre ni l'artiste joués (pas de triche possible).
    vueJoueur(q) { return { intitule: q.question, surtitre: '🎵 Écoute la tablette !', ecoute: true }; }
    vueRevelation(q) { return { intitule: q.question, surtitre: '🎵 Blind test · ' + nomDecennie(decennie(q)), extrait: { artiste: q.artiste, titre: q.titre, revele: true } }; }
    consigneJoueur() { return 'Tends l’oreille vers la tablette…'; }
    explication(q) { return { titre: q.titre + ' — ' + q.artiste + ' (' + q.annee + ')', texte: 'Extrait fourni par Apple Music.' }; }

    /* Le signal de la tablette : l'extrait de cette question est introuvable. On passe, sans pénalité. */
    signalTablette(d) {
      if (!d || d.type !== 'extrait-indisponible' || this.phase !== 'question' || d.numero !== this.index) return;
      this.echecsDeSuite++;
      this.annulerMinuteurs();
      this.phase = 'saut';
      if (this.echecsDeSuite >= 3) {
        // Trois échecs d'affilée : probablement pas d'Internet sur la tablette.
        this.ctx.ecranTablette('info-jeu', { titre: '📡 Pas d’extrait disponible', texte: 'La tablette n’arrive pas à joindre Apple Music (Internet est-il connecté ?). On passe au jeu suivant !' });
        return this.attendre(4000, () => this.ctx.terminer());
      }
      this.attendre(800, () => this.questionSuivante());
    }
  }

  BlindTest.fiche = {
    id: 'blindtest',
    nom: 'Blind test des tubes',
    icone: '🎵',
    resume: 'Les tubes de 1960 à aujourd’hui : des Beatles à Stromae, qui reconnaîtra la chanson ?',
    regle: 'La tablette joue un extrait : trouvez le titre ou l’artiste sur votre téléphone. Plus vous êtes rapide, plus vous gagnez ! (La tablette doit être connectée à Internet.)'
  };
  BlindTest.tirerTubes = tirerTubes; // pour les tests

  return BlindTest;
});

</script>
<script>/* moteur/jeux/drapeaux.js */

 *
 *  Un drapeau s'affiche en grand sur la tablette et sur les téléphones :
 *  à quel pays appartient-il ? Huit drapeaux par partie, des plus connus
 *  (la Belgique, le Japon…) aux plus trompeurs (le Tchad ou la Roumanie ?

 */
(function (racine, nom, fabrique) {

})(this, 'jeux/drapeaux', function (exiger) {
  'use strict';
  const outils = exiger('../outils');

  }

  class Drapeaux extends JeuQCM {

    regle: 'Un drapeau s’affiche : touchez le bon pays sur votre téléphone. Attention, les mauvaises réponses se ressemblent beaucoup !'
  };

<script>/* moteur/jeux/calcul.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Calcul mental 🧮
 * ════════════════════════════════════════════════════════════════════
 *
 *  Huit calculs, fabriqués par le jeu à chaque partie (ils ne reviennent
 *  donc jamais à l'identique), du plus doux au plus corsé :
 *
 *    • additions et soustractions (avec ou sans retenue) ;
 *    • tables de multiplication ;
 *    • doubles et moitiés ;
 *    • divisions qui tombent juste ;
 *    • le piège des priorités : 3 + 4 × 2 = 11, et non 14 !
 *    • pourcentages simples (10 %, 25 %, 50 % de…) ;
 *    • la monnaie : 3 croissants à 1,20 €, ça fait combien ?
 *
 *  Le calcul s'affiche en grandes tuiles (comme au Casse-tête), sur la
 *  tablette et les téléphones. Les mauvaises réponses ne sont pas tirées
 *  au hasard : ce sont les erreurs que l'on fait vraiment (une retenue
 *  oubliée, les priorités ignorées, les chiffres inversés, ± 10…).
 *
 *  Chaque question garde aussi son calcul « en clair » (champ `verif`),
 *  que le test automatique refait de son côté pour vérifier que la bonne
 *  réponse est vraiment la bonne.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/calcul', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');

  const hasard = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
  const euros = (centimes) => (centimes / 100).toFixed(2).replace('.', ',') + ' €';

  /* Trois leurres plausibles, tous différents entre eux et de la bonne réponse (nombres entiers positifs). */
  function leurres(bonne, idees) {
    const pris = new Set([bonne]);
    const liste = [];
    const inverse = Number(String(bonne).split('').reverse().join(''));
    [...idees, bonne + 10, bonne - 10, bonne + 1, bonne - 1, inverse, bonne + 2, bonne - 2, bonne + 20]
      .forEach((x) => { if (liste.length < 3 && Number.isInteger(x) && x >= 0 && !pris.has(x)) { pris.add(x); liste.push(x); } });
    return liste;
  }

  /* Une question « calcul en tuiles » : l'opération s'affiche, la réponse est un nombre. */
  function enTuiles(tuiles, bonne, idees, verif, explication) {
    return {
      question: 'Combien font… ?',
      choix: [String(bonne), ...leurres(bonne, idees).map(String)],
      illustration: { lignes: [tuiles.concat(['=', '?']).map(String)] },
      verif, valeur: bonne, explication
    };
  }

  const FABRIQUES = {
    addition(niveau) {
      const a = niveau < 2 ? hasard(12, 49) : hasard(38, 89);
      const b = niveau < 2 ? hasard(11, 39) : hasard(27, 79);
      const somme = a + b;
      // L'erreur classique : la retenue oubliée.
      const sansRetenue = Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10 + ((a % 10 + b % 10) % 10);
      return enTuiles([a, '+', b], somme, [sansRetenue], a + '+' + b, a + ' + ' + b + ' = ' + somme + '.');
    },
    soustraction(niveau) {
      const a = niveau < 2 ? hasard(40, 99) : hasard(102, 199);
      const b = hasard(13, Math.min(89, a - 5));
      const diff = a - b;
      // L'erreur classique : soustraire le petit chiffre du grand dans chaque colonne.
      const colonnes = Number(String(a).padStart(3, '0').split('').map((c, i) => Math.abs(Number(c) - Number(String(b).padStart(3, '0')[i]))).join(''));
      return enTuiles([a, '−', b], diff, [colonnes], a + '-' + b, a + ' − ' + b + ' = ' + diff + '.');
    },
    table() {
      const a = hasard(3, 9), b = hasard(4, 9);
      const p = a * b;
      return enTuiles([a, '×', b], p, [a * (b + 1), (a - 1) * b, a + b], a + '*' + b, a + ' fois ' + b + ', c\'est ' + p + '.');
    },
    double() {
      if (Math.random() < 0.5) {
        const n = hasard(13, 49);
        return enTuiles(['2', '×', n], 2 * n, [2 * n - 10, 2 * n + 10], '2*' + n, 'Le double de ' + n + ' : ' + n + ' + ' + n + ' = ' + 2 * n + '.');
      }
      const n = 2 * hasard(16, 49);
      return enTuiles([n, '÷', '2'], n / 2, [n / 2 + 5, n / 2 - 5, n - 2], n + '/2', 'La moitié de ' + n + ' : ' + n / 2 + '.');
    },
    division() {
      const b = hasard(3, 9), q = hasard(4, 12);
      const a = b * q;
      return enTuiles([a, '÷', b], q, [q + 1, q - 1, b], a + '/' + b, a + ' ÷ ' + b + ' = ' + q + ', car ' + b + ' × ' + q + ' = ' + a + '.');
    },
    priorites() {
      const a = hasard(2, 9), b = hasard(2, 6), c = hasard(2, 6);
      const juste = a + b * c;
      const piege = (a + b) * c;   // l'erreur de ceux qui calculent dans l'ordre
      return enTuiles([a, '+', b, '×', c], juste, [piege], a + '+' + b + '*' + c,
        'Attention aux priorités : la multiplication passe d\'abord. ' + b + ' × ' + c + ' = ' + b * c + ', puis + ' + a + ' = ' + juste + '.');
    },
    pourcentage() {
      const genre = outils.tirer([10, 25, 50], 1)[0];
      const n = genre === 10 ? 10 * hasard(3, 25) : genre === 25 ? 4 * hasard(5, 30) : 2 * hasard(11, 60);
      const r = n * genre / 100;
      return {
        question: 'Combien font ' + genre + ' % de ' + n + ' ?',
        choix: [String(r), ...leurres(r, [r * 2, n - r, genre === 25 ? n / 2 : n / 4].filter(Number.isInteger)).map(String)],
        verif: n + '*' + genre + '/100', valeur: r,
        explication: genre === 10 ? '10 %, c\'est diviser par 10 : ' + r + '.' : genre === 25 ? '25 %, c\'est le quart : ' + n + ' ÷ 4 = ' + r + '.' : '50 %, c\'est la moitié : ' + r + '.'
      };
    },
    monnaie() {
      const articles = [['croissants', 90, 140], ['baguettes', 110, 160], ['glaces', 180, 300], ['cartes postales', 70, 150], ['pommes', 40, 80]];
      const [nomArticle, min, max] = outils.tirer(articles, 1)[0];
      const prix = 10 * hasard(min / 10, max / 10);        // en centimes, ronds à 10 centimes
      const n = hasard(3, 5);
      const total = prix * n;
      const faux = [total + prix, total - prix, total + 100, total - 10].filter((x, i, t) => x > 0 && x !== total && t.indexOf(x) === i).slice(0, 3);
      return {
        question: n + ' ' + nomArticle + ' à ' + euros(prix) + ' pièce : combien faut-il payer ?',
        choix: [euros(total), ...faux.map(euros)],
        verif: n + '*' + prix, valeur: total, enCentimes: true,
        explication: n + ' × ' + euros(prix) + ' = ' + euros(total) + '.'
      };
    }
  };

  /* Le programme d'une partie : on commence en douceur, on finit par les pièges. */
  function programme() {
    const debut = outils.melanger(['addition', 'table', 'double']);
    const milieu = outils.melanger(['soustraction', 'division', 'pourcentage']);
    const fin = outils.melanger(['priorites', 'monnaie']);
    return [...debut, ...milieu, ...fin];
  }

  class Calcul extends JeuQCM {
    constructor(ctx) {
      const questions = programme().map((genre, i) => Object.assign({ genre }, FABRIQUES[genre](i < 3 ? 1 : 2)));
      super(ctx, { questions, dureeMs: 15000, revelationMs: 6000, pointsBase: 300, bonusVitesse: 700 });
    }
    vueTablette(q) { return { intitule: q.question, surtitre: '🧮 Calcul mental', illustration: q.illustration || null }; }
    consigneJoueur() { return 'Calcule de tête… vite !'; }
    explication(q) { return { titre: 'La réponse : ' + q.choix[q.bonne], texte: q.explication }; }
  }

  Calcul.fiche = {
    id: 'calcul',
    nom: 'Calcul mental',
    icone: '🧮',
    resume: 'Additions, tables, pourcentages, monnaie… et le piège des priorités !',
    regle: 'Un calcul s\'affiche : touchez le bon résultat sur votre téléphone, sans papier ni calculette. Attention aux pièges : la multiplication passe avant l\'addition !'
  };
  Calcul.FABRIQUES = FABRIQUES; // pour les tests

  return Calcul;
});

</script>

<script>/* moteur/jeux/puzzle.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Le Puzzle 🖼️
 * ════════════════════════════════════════════════════════════════════
 *
 *  Une image découpée en neuf pièces, toutes mélangées et retournées.
 *  Puis, pièce après pièce, le puzzle se remet en place tout seul :
 *  qui reconnaîtra l'image le premier ? Plus on répond tôt, plus on
 *  gagne. Les images viennent de la banque du Zoom infernal
 *  (moteur/contenus/zoom.js) ; l'animation est dessinée par GT.puzzle
 *  (public/js/commun.js), calée sur le chronomètre.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/puzzle', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');
  const BANQUE = exiger('../contenus/zoom');

  const NB_IMAGES = 7;

  /* Un mélange des 9 cases où aucune pièce ne reste à sa place. */
  function desordre() {
    let ordre;
    do ordre = outils.melanger([0, 1, 2, 3, 4, 5, 6, 7, 8]); while (ordre.some((x, i) => x === i));
    return ordre;
  }

  function fabriquerPuzzle(im) {
    return {
      image: im.image || null, photo: im.photo || null,
      ordre: desordre(),                                            // la pièce i démarre dans la case ordre[i]
      tours: Array.from({ length: 9 }, () => outils.tirer([90, 180, 270, -90], 1)[0]),
      rythme: outils.melanger([0, 1, 2, 3, 4, 5, 6, 7, 8])          // l'ordre dans lequel les pièces se remettent en place
    };
  }

  class Puzzle extends JeuQCM {
    constructor(ctx) {
      const choisies = outils.tirerNeuf('puzzle', BANQUE, NB_IMAGES);
      const questions = choisies.map((im) => {
        const cousins = BANQUE.filter((x) => x.famille === im.famille && x.sujet !== im.sujet);
        const autres = BANQUE.filter((x) => x.famille !== im.famille);
        const leurres = outils.tirer(cousins.length >= 3 ? cousins : cousins.concat(autres), 3).map((x) => x.sujet);
        return { question: 'Quelle image se cache dans ce puzzle ?', sujet: im.sujet, choix: [im.sujet, ...leurres], puzzle: fabriquerPuzzle(im) };
      });
      super(ctx, { questions, dureeMs: 20000, revelationMs: 5500, pointsBase: 200, bonusVitesse: 800 });
    }
    vueTablette(q) { return { intitule: q.question, surtitre: '🖼️ Le Puzzle', puzzle: q.puzzle }; }

    consigneJoueur() { return 'Le puzzle se reconstruit… réponds dès que tu reconnais !'; }

  Puzzle.fiche = {

<script>/* moteur/jeux/melange.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Le grand mélange 🔀
 * ════════════════════════════════════════════════════════════════════
 *
 *  Une question de culture générale, puis un drapeau, puis une recette
 *  mystère, une énigme de logique, un zoom infernal, un piège du
 *  français, un tube du blind test… Chaque question est tirée au hasard
 *  dans un thème différent : impossible de savoir ce qui vient ensuite !
 *
 *  Comment c'est fait : le mélange emprunte des questions aux autres jeux
 *  « à choix multiple ». Il fabrique en coulisses une partie de chacun de
 *  ces jeux (sans rien afficher), y prend une ou deux questions au hasard,
 *  et garde pour chacune le jeu d'origine : c'est ce jeu-là qui sait
 *  comment l'afficher (le drapeau, l'image du zoom, les tuiles de la
 *  balance, l'extrait du blind test…). Rien n'est recopié : un nouveau
 *  jeu à choix multiple ajouté demain pourra entrer dans le mélange en
 *  ajoutant simplement son nom à la liste THEMES.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/melange', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');

  // Les jeux à qui l'on emprunte des questions.
  const THEMES = [
    exiger('../jeux/quiz'), exiger('../jeux/humour'), exiger('../jeux/zoom'), exiger('../jeux/logique'),
    exiger('../jeux/drapeaux'), exiger('../jeux/gastronomie'), exiger('../jeux/blindtest'), exiger('../jeux/calcul'),
    exiger('../jeux/enigmes'), exiger('../jeux/motscroises'), exiger('../jeux/puzzle'), exiger('../jeux/vraifarfelu')
  ];
  const NB_QUESTIONS = 8;

  class Melange extends JeuQCM {
    constructor(ctx) {
      // Un ordre de thèmes au hasard, en reprenant au début s'il faut plus de questions que de thèmes.
      const ordre = [];
      while (ordre.length < NB_QUESTIONS) outils.melanger(THEMES).forEach((T) => { if (ordre.length < NB_QUESTIONS && T !== ordre[ordre.length - 1]) ordre.push(T); });
      const sources = new Map();
      const questions = ordre.map((Theme) => {
        if (!sources.has(Theme)) sources.set(Theme, { jeu: new Theme(ctx), pris: 0 });
        const s = sources.get(Theme);
        const q = s.jeu.questions[s.pris++];
        // On remet la bonne réponse en premier : le moule JeuQCM va remélanger les choix.
        const choix = [q.choix[q.bonne], ...q.choix.filter((c, i) => i !== q.bonne)];
        return Object.assign({}, q, { choix, source: s.jeu, theme: Theme.fiche });
      });
      super(ctx, { questions, dureeMs: 22000, revelationMs: 8000, pointsBase: 350, bonusVitesse: 650 });
      this.sources = Array.from(sources.values()).map((s) => s.jeu);
    }

    /* Chaque question est affichée par son jeu d'origine, avec le thème en étiquette. */
    habiller(vue, q) {
      const v = Object.assign({}, vue, { surtitre: '🔀 ' + q.theme.icone + ' ' + q.theme.nom });
      if (v.extrait) v.extrait = Object.assign({}, v.extrait, { numero: this.questions.indexOf(q) });
      return v;
    }
    vueTablette(q) { return this.habiller(q.source.vueTablette(q), q); }
    vueJoueur(q) { return this.habiller(q.source.vueJoueur(q), q); }
    vueRevelation(q) { return this.habiller(q.source.vueRevelation(q), q); }
    consigneJoueur(q) { return q.source.consigneJoueur(q); }
    explication(q) { return q.source.explication(q); }

    /* Le blind test : un extrait introuvable fait simplement passer à la question suivante. */
    signalTablette(d) {
      if (!d || d.type !== 'extrait-indisponible' || this.phase !== 'question' || d.numero !== this.index) return;
      this.annulerMinuteurs();
      this.phase = 'saut';
      this.attendre(800, () => this.questionSuivante());
    }

    arreter() {
      super.arreter();
      this.sources.forEach((s) => s.arreter());
    }
  }

  Melange.fiche = {
    id: 'melange',
    nom: 'Le grand mélange',
    icone: '🔀',
    resume: 'Chaque question vient d’un thème tiré au sort : quiz, drapeau, recette, énigme, calcul, tube…',
    regle: 'Quiz, drapeaux, recettes mystère, énigmes, zoom, blind test… Chaque question change de thème, au hasard. Restez sur vos gardes !'
  };
  Melange.THEMES = THEMES;

  return Melange;
});

</script>
<script>/* moteur/jeux/fousrires.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU — Les Fous Rires 🤪
 * ════════════════════════════════════════════════════════════════════
 *
 *  Le jeu où l'on gagne en faisant rire les autres. Six tours, en
 *  alternance :
 *
 *  ✍️  « INVENTE LA SUITE » (3 tours) : la tablette affiche le début
 *     d'une phrase absurde (« Le pire cadeau à offrir à Mamie : … »).
 *     Chacun écrit la suite la plus drôle sur son téléphone (un bouton
 *     « 🎲 Joker » dépanne ceux qui sèchent). Puis toutes les réponses
 *     s'affichent SANS le nom de leur auteur, et chacun vote pour sa
 *     préférée (on ne peut pas voter pour soi). Enfin, on découvre qui
 *     a écrit quoi : c'est là que la table éclate de rire.
 *       • 250 points par vote reçu ;
 *       • « Fou rire général 🤣 » : +300 si TOUS les votes vont à la
 *         même réponse (au moins deux votants) ;
 *       • le jeu glisse aussi SA réponse, « la maison », parmi celles des
 *         joueurs. Les votes qu'elle attire ne rapportent rien à personne.
 *         Avec elle, même à deux joueurs, il y a un vrai choix à faire.
 *
 *  🤔  « DEVINETTE ABSURDE » (3 tours) : une devinette ou un « comble »
 *     à choix multiple (« Qu'est-ce qui est jaune et qui attend ? »).
 *     Ces tours empruntent tout simplement le moule JeuQCM : une petite
 *     partie d'une seule question, dont la fin relance le tour suivant.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/fousrires', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { Jeu, JeuQCM } = exiger('../jeux/base');
  const { AMORCES, DEVINETTES, JOKERS } = exiger('../contenus/fousrires');

  const REGLAGES = {
    ecritureMs: 60000,   // le temps pour écrire sa réponse
    voteMs: 30000,       // le temps pour voter
    resultatMs: 11000,   // le temps pour rire en découvrant les auteurs
    parVote: 250,
    fouRire: 300,
    longueurMax: 80
  };
  // L'ordre des tours : devinette, invention, devinette, invention…
  const DEROULE = ['devinette', 'invente', 'devinette', 'invente', 'devinette', 'invente'];

  /* Une devinette = une mini-partie de JeuQCM avec une seule question. */
  class UneDevinette extends JeuQCM {
    constructor(ctx, q, numero, total) {
      super(ctx, { questions: [q], dureeMs: 20000, revelationMs: 8500, pointsBase: 300, bonusVitesse: 400 });
      this.numero = numero;
      this.total = total;
    }
    vueTablette(q) { return { intitule: q.question, surtitre: '🤪 ' + q.categorie + ' · tour ' + this.numero + ' / ' + this.total }; }
    consigneJoueur() { return 'La réponse la plus absurde…'; }
    explication(q) { return { titre: 'Elle était bonne, celle-là !', texte: q.explication }; }
  }

  class FousRires extends Jeu {
    constructor(ctx, reglages) {
      super(ctx);
      this.reglages = Object.assign({}, REGLAGES, reglages || FousRires.reglagesTest || {});
      this.amorces = outils.tirerNeuf('amorces', AMORCES, DEROULE.filter((t) => t === 'invente').length);
      this.devinettes = outils.tirerNeuf('devinettes', DEVINETTES, DEROULE.filter((t) => t === 'devinette').length);
      this.tour = -1;
      this.phase = 'attente';
      this.sousJeu = null;
    }

    demarrer() { this.tourSuivant(); }

    tourSuivant() {
      if (this.sousJeu) { this.sousJeu.arreter(); this.sousJeu = null; }
      this.annulerMinuteurs();
      this.tour++;
      if (this.tour >= DEROULE.length) return this.ctx.terminer();
      if (DEROULE[this.tour] === 'devinette') this.lancerDevinette();
      else this.lancerInvention();
    }

    /* ─── La devinette : on prête au moule JeuQCM un contexte dont « terminer » relance notre tour suivant. ─── */
    lancerDevinette() {
      this.phase = 'devinette';
      const q = this.devinettes.shift();
      const ctx = Object.assign({}, this.ctx, { terminer: () => { if (this.actif && this.sousJeu === jeu) this.tourSuivant(); } });
      const jeu = new UneDevinette(ctx, q, this.tour + 1, DEROULE.length);
      this.sousJeu = jeu;
      jeu.demarrer();
    }

    /* ─── « Invente la suite » : l'écriture ─── */
    lancerInvention() {
      this.phase = 'ecriture';
      this.amorce = this.amorces.shift();
      this.ecrits = new Map(); // joueurId → texte
      this.finA = Date.now() + this.reglages.ecritureMs;
      this.ctx.ecranTablette('rire-ecriture', this.vueEcriture());
      this.ctx.ecranTousJoueurs((j) => ({ type: 'rire-ecrire', donnees: this.donneesEcrire(j.id) }));
      this.attendre(this.reglages.ecritureMs + 300, () => this.ouvrirVote());
    }

    vueEcriture() {
      return {
        amorce: this.amorce.amorce, finA: this.finA, dureeMs: this.reglages.ecritureMs,
        tour: this.tour + 1, total: DEROULE.length,
        ontEcrit: Array.from(this.ecrits.keys()).map((id) => this.ctx.joueur(id)).filter(Boolean).map((j) => ({ nom: j.nom, avatar: j.avatar })),
        nbJoueurs: this.ctx.joueurs().length
      };
    }

    donneesEcrire(joueurId) {
      return {
        amorce: this.amorce.amorce, finA: this.finA, dureeMs: this.reglages.ecritureMs,
        tour: this.tour + 1, total: DEROULE.length, longueurMax: this.reglages.longueurMax,
        // Chaque téléphone reçoit sa propre poignée de jokers, pour que deux voisins ne tirent pas les mêmes.
        jokers: outils.tirer(JOKERS, 6),
        dejaEcrit: this.ecrits.get(joueurId) || null
      };
    }

    /* ─── Le vote : les réponses, anonymes et mélangées, plus celle de la maison ─── */
    ouvrirVote() {
      if (this.phase !== 'ecriture') return;
      this.annulerMinuteurs();
      this.phase = 'vote';
      const liste = Array.from(this.ecrits.entries()).map(([auteurId, texte]) => ({ auteurId, texte }));
      liste.push({ auteurId: null, texte: this.amorce.maison });
      this.options = outils.melanger(liste).map((o, i) => Object.assign({ id: 'r' + (i + 1), votes: [] }, o));
      this.votes = new Map(); // votantId → id de l'option choisie
      this.finA = Date.now() + this.reglages.voteMs;
      this.ctx.ecranTablette('rire-vote', {
        amorce: this.amorce.amorce, finA: this.finA, dureeMs: this.reglages.voteMs,
        tour: this.tour + 1, total: DEROULE.length,
        reponses: this.options.map((o) => ({ id: o.id, texte: o.texte })),
        nbVotes: 0, nbVotants: this.votants().length
      });
      this.ctx.ecranTousJoueurs((j) => ({ type: 'rire-voter', donnees: this.donneesVoter(j.id) }));
      this.attendre(this.reglages.voteMs + 300, () => this.resultat());
    }

    /* On ne vote jamais pour sa propre réponse : chaque téléphone reçoit la liste sans la sienne. */
    donneesVoter(joueurId) {
      return {
        amorce: this.amorce.amorce, finA: this.finA, dureeMs: this.reglages.voteMs,
        reponses: this.options.filter((o) => o.auteurId !== joueurId).map((o) => ({ id: o.id, texte: o.texte })),
        aVote: this.votes.get(joueurId) || null
      };
    }

    votants() { return this.ctx.joueurs(); }

    /* ─── Le résultat : qui a écrit quoi, et combien de votes ─── */
    resultat() {
      if (this.phase !== 'vote') return;
      this.annulerMinuteurs();
      this.phase = 'resultat';
      this.votes.forEach((optionId, votantId) => {
        const o = this.options.find((x) => x.id === optionId);
        const v = this.ctx.joueur(votantId);
        if (o && v) o.votes.push({ nom: v.nom, avatar: v.avatar });
      });
      const nbVotes = this.votes.size;
      const tri = this.options.slice().sort((a, b) => b.votes.length - a.votes.length);
      const meilleur = tri[0];
      // Le fou rire général : tout le monde (au moins deux personnes) a voté pour la même réponse d'un joueur.
      const fouRire = nbVotes >= 2 && meilleur.auteurId && meilleur.votes.length === nbVotes;
      const maison = this.options.find((o) => !o.auteurId);

      const lignes = tri.map((o) => {
        const auteur = o.auteurId ? this.ctx.joueur(o.auteurId) : null;
        let points = 0;
        if (auteur) {
          const bareme = o.votes.length * this.reglages.parVote + (fouRire && o === meilleur ? this.reglages.fouRire : 0);
          if (bareme) points = this.ctx.ajouterPoints(auteur.id, bareme);
        }
        o.points = points;
        return {
          texte: o.texte, votes: o.votes, points, maison: !o.auteurId,
          auteur: auteur ? { nom: auteur.nom, avatar: auteur.avatar } : null,
          gagnant: o === meilleur && o.votes.length > 0
        };
      });

      this.ctx.ecranTablette('rire-resultat', {
        amorce: this.amorce.amorce, tour: this.tour + 1, total: DEROULE.length,
        lignes, fouRire: !!fouRire, maisonGagne: meilleur === maison && maison.votes.length > 0,
        piegesMaison: maison.votes.length, dernier: this.tour + 1 >= DEROULE.length
      });
      this.ctx.ecranTousJoueurs((j) => {
        const mienne = this.options.find((o) => o.auteurId === j.id);
        return { type: 'rire-resultat', donnees: {
          amorce: this.amorce.amorce,
          maReponse: mienne ? mienne.texte : null,
          mesVotes: mienne ? mienne.votes.length : 0,
          points: mienne ? mienne.points : 0,
          fouRire: !!(fouRire && mienne === meilleur),
          meilleure: meilleur.votes.length ? { texte: meilleur.texte, auteur: lignes[0].auteur, maison: !meilleur.auteurId } : null,
          piegeParMaison: this.votes.get(j.id) === maison.id,
          score: j.score
        } };
      });
      this.attendre(this.reglages.resultatMs, () => this.tourSuivant());
    }

    /* ─── Ce que les téléphones envoient ─── */
    action(joueurId, d) {
      if (this.phase === 'devinette' && this.sousJeu) return this.sousJeu.action(joueurId, d);
      if (!d) return;

      if (this.phase === 'ecriture' && d.type === 'ecrit') {
        const texte = outils.nettoyer(d.texte, this.reglages.longueurMax);
        if (!texte || this.ecrits.has(joueurId)) return;
        this.ecrits.set(joueurId, texte);
        this.ctx.ecranJoueur(joueurId, 'rire-attente', { titre: 'C\'est envoyé ! ✍️', texte, finA: this.finA, dureeMs: this.reglages.ecritureMs, consigne: 'Personne ne saura que c\'est toi… jusqu\'au vote !' });
        const j = this.ctx.joueur(joueurId);
        this.ctx.evenementTablette('a-ecrit', { nom: j.nom, avatar: j.avatar, nb: this.ecrits.size, nbJoueurs: this.ctx.joueurs().length });
        if (this.ecrits.size >= this.ctx.joueurs().length) this.attendre(900, () => this.ouvrirVote());
        return;
      }

      if (this.phase === 'vote' && d.type === 'vote') {
        if (this.votes.has(joueurId)) return; // un seul vote, pas de repentir
        const o = this.options.find((x) => x.id === d.option);
        if (!o || o.auteurId === joueurId) return;
        this.votes.set(joueurId, o.id);
        this.ctx.ecranJoueur(joueurId, 'rire-attente', { titre: 'A voté ! 🗳️', texte: o.texte, finA: this.finA, dureeMs: this.reglages.voteMs, consigne: 'Suspense… Qui a bien pu écrire ça ?' });
        this.ctx.evenementTablette('vote-rire', { nbVotes: this.votes.size, nbVotants: this.votants().length });
        if (this.votes.size >= this.votants().length) this.attendre(700, () => this.resultat());
      }
    }

    /* Un retardataire retrouve l'écran du moment. */
    joueurArrive(joueurId) {
      if (this.phase === 'devinette' && this.sousJeu) return this.sousJeu.joueurArrive(joueurId);
      if (this.phase === 'ecriture' && !this.ecrits.has(joueurId)) this.ctx.ecranJoueur(joueurId, 'rire-ecrire', this.donneesEcrire(joueurId));
      else if (this.phase === 'vote' && !this.votes.has(joueurId)) this.ctx.ecranJoueur(joueurId, 'rire-voter', this.donneesVoter(joueurId));
    }

    /* « Passer » : on avance d'une étape (écriture → vote → résultat → tour suivant). */
    passer() {
      if (this.phase === 'devinette' && this.sousJeu) return this.sousJeu.passer();
      if (this.phase === 'ecriture') this.ouvrirVote();
      else if (this.phase === 'vote') this.resultat();
      else this.tourSuivant();
    }

    arreter() {
      super.arreter();
      if (this.sousJeu) this.sousJeu.arreter();
    }
  }

  FousRires.fiche = {
    id: 'fousrires',
    minJoueurs: 2, // on vote pour la réponse des AUTRES : il faut être au moins deux
    nom: 'Les Fous Rires',
    icone: '🤪',
    resume: 'Inventez la suite la plus drôle, votez pour la meilleure, et devinettes absurdes !',
    regle: 'Complétez la phrase absurde sur votre téléphone, puis votez pour la réponse qui vous fait le plus rire (pas la vôtre !). 250 points par vote. Attention : le jeu glisse aussi sa propre réponse… Entre deux, des devinettes absurdes.'
  };
  FousRires.DEROULE = DEROULE;

  return FousRires;
});

</script>
<script>/* moteur/moteur.js */
/*
 * ════════════════════════════════════════════════════════════════════

 *    • jeu        : le mini-jeu a la main
 *    • classement : les scores après le jeu, en attendant « Jeu suivant »
 *    • podium     : la fin de la partie, avec les trois premiers à l'honneur

 *  juste avant chaque jeu, un défi personnel pour chaque joueur :

 *  Enfin, la dernière manche est la « Grande Finale » : tous les points,
 *  primes comprises, y comptent double. Rien n'est joué avant le podium.
 *
 *  LA PARTIE SURPRISE 🎲 (le mode proposé par défaut)
 *  ─────────────────────────────────────────────────
 *  Au lieu de choisir les jeux à l'avance, on laisse faire le hasard :
 *    • au lancement, le moteur tire un objectif (entre 8 000 et 11 000

 *    • chaque manche est un mini-jeu tiré au sort, jamais deux fois le
 *      même d'affilée, et tous les jeux passent avant qu'un revienne ;
 *    • dès qu'un joueur a franchi la ligne (à partir de la 3e manche),
 *      la manche suivante devient la Grande Finale, à points doublés ;
 *    • si personne n'y arrive, la 6e manche est la finale quoi qu'il
 *      arrive : la soirée garde un rythme raisonnable ;
 *    • entre les manches, un commentateur taquin résume la course, et le
 *      podium final remet quelques prix pour rire (contenus/commentaires.js).

 *  LE DÉFI INATTENDU 🎰
 *  ────────────────────

 *  joueur au hasard — jamais le même deux fois de suite — et lui lance
 *  un défi surprise pour la manche qui commence :
 *    • 🎰 Quitte ou double : meilleur score de la manche → ses points de
 *      la manche doublent ; sinon, il en perd la moitié ;
 *    • ⚔️ Duel éclair : contre un autre joueur tiré au sort ; celui qui
 *      marque le plus pendant la manche vole 500 points à l'autre ;
 *    • 🍀 Trèfle à quatre feuilles : tous ses points de la manche comptent

 *  L'ENCHAÎNEMENT AUTOMATIQUE

 *  bout de 20 secondes (le temps de lire le commentateur). L'animateur
 *  peut aller plus vite avec le bouton, ou mettre en pause.
 *
 *  LES GAGES SECRETS 🤫 ET LE TRIBUNAL
 *  ──────────────────────────────────

 *  pendant la soirée (contenus/gages.js). Après la dernière manche, avant

 *  votent sur leur téléphone (« réussi » ou « raté »). Majorité de
 *  « réussi » : une prime qui peut renverser le classement final.
 *    salle.etat : … ──► classement ──► gages (vote ⇄ verdict) ──► podium
 *
 *  LES MESSAGES ÉCHANGÉS
 *  ─────────────────────
 *  Reçus de la tablette : tablette:creer, tablette:reprendre, tablette:lancer,
 *    tablette:passer, tablette:terminer-jeu, tablette:podium, tablette:nouvelle,
 *    tablette:retirer

 *  Envoyés : salle:creee, salle:etat, joueur:accepte, ecran, evenement,
 *    reaction, expulse, erreur

      salle.gagesDistribues = false;
      salle.gagesJuges = false;
      salle.joueurs.forEach((j) => { j.gage = null; j.gageReussi = false; });
      salle.multiplicateur = 1;
      salle.defis = new Map();
      salle.joueurs.forEach((j) => { j.score = 0; });
      this.ecranTablette(salle, 'salon', { code: salle.code });
      salle.joueurs.forEach((j) => this.ecranJoueur(salle, j.id, 'salon', {}));
      this.diffuserEtat(salle);
    }

    retirerJoueur(salle, joueurId) {
      const j = salle.joueurs.get(joueurId);
      if (!j) return;
      salle.joueurs.delete(joueurId);
      if (j.connecte) {
        this.envoyer(j.connexionId, 'expulse', { message: 'L\'animateur t\'a retiré de la partie.' });
        this.connexions.delete(j.connexionId);
      }
      if (salle.jeu) salle.jeu.joueurParti(joueurId);
      this.diffuserEtat(salle);
    }

    /* ═══════════ Les téléphones ═══════════ */

    rejoindre(cid, d) {
      const code = String(d.code || '').trim().toUpperCase();
      const salle = this.salles.get(code);
      if (!salle) return this.envoyer(cid, 'erreur', { message: 'Aucune partie avec le code « ' + (code || '…') + ' ». Vérifiez le code affiché sur la tablette.' });
      salle.derniereActivite = Date.now();

      // ─── Cas 1 : un joueur qui revient (même identifiant qu'avant) ───
      let j = d.joueurId && salle.joueurs.get(d.joueurId);
      if (j) {
        if (j.connecte && j.connexionId !== cid) this.connexions.delete(j.connexionId);
        j.connexionId = cid;
        j.connecte = true;
        this.connexions.set(cid, { role: 'joueur', code, joueurId: j.id });
        this.envoyer(cid, 'joueur:accepte', { joueurId: j.id, code, nom: j.nom, avatar: j.avatar });
        this.diffuserEtat(salle);
        this.replacerJoueur(salle, j);
        return;
      }

      // ─── Cas 2 : un nouveau venu ───
      if (salle.joueurs.size >= this.maxJoueurs) {
        return this.envoyer(cid, 'erreur', { message: 'La table est complète : ' + this.maxJoueurs + ' joueurs maximum.' });
      }
      let nom = outils.nettoyer(d.nom, 16);
      if (!nom) return this.envoyer(cid, 'erreur', { message: 'Indique ton prénom ou un surnom pour jouer.' });
      // Deux « Marie » à la même table ? La seconde devient « Marie 2 ».
      const noms = new Set(Array.from(salle.joueurs.values()).map((x) => x.nom.toLowerCase()));
      if (noms.has(nom.toLowerCase())) {
        let n = 2;
        while (noms.has((nom + ' ' + n).toLowerCase())) n++;
        nom = nom + ' ' + n;
      }
      j = {
        id: outils.identifiant('j'), nom,
        avatar: AVATARS.includes(d.avatar) ? d.avatar : AVATARS[salle.joueurs.size % AVATARS.length],
        score: 0, connecte: true, connexionId: cid, dernierEcran: null, derniereReaction: 0,
        // Un retardataire reçoit lui aussi son gage secret.
        gage: salle.gagesDistribues ? this.tirerGage(salle) : null
      };
      salle.joueurs.set(j.id, j);
      this.connexions.set(cid, { role: 'joueur', code, joueurId: j.id });
      this.envoyer(cid, 'joueur:accepte', { joueurId: j.id, code, nom: j.nom, avatar: j.avatar });
      this.diffuserEtat(salle);
      this.replacerJoueur(salle, j);
    }

    /* Montrer au joueur l'écran qui correspond à ce qui se passe à la table. */
    replacerJoueur(salle, j) {
      if (salle.etat === 'salon') return this.ecranJoueur(salle, j.id, 'salon', {});
      if (salle.etat === 'jeu' && salle.jeu) {
        const avant = j.dernierEcran;
        j.dernierEcran = null;
        salle.jeu.joueurArrive(j.id);
        if (j.dernierEcran) return; // le jeu lui a donné un écran : parfait
        j.dernierEcran = avant;
      }
      if (j.dernierEcran) return this.envoyer(j.connexionId, 'ecran', Object.assign({ horloge: Date.now() }, j.dernierEcran));
      this.ecranJoueur(salle, j.id, 'info', { titre: 'Bienvenue à table, ' + j.nom + ' !', texte: 'Une manche est en cours. Regarde la tablette : tu entres dans le jeu au prochain tour.', score: j.score });
    }

    /*
     * Les réactions : un joueur envoie un émoji à un autre joueur (ou à
     * toute la table). C'est le lien direct « de joueur à joueur » : on
     * se félicite, on se taquine, et la tablette affiche tout cela en
     * petites bulles qui s'envolent. Une réaction par seconde au maximum,
     * pour éviter les averses d'émojis.
     */
    reaction(salle, deId, d) {
      const de = salle.joueurs.get(deId);
      // Un petit mot écrit, en plus (ou à la place) de l'émoji : 80 caractères au plus, sur une seule ligne.
      const texte = outils.nettoyer(String(d.texte || '').replace(/\s+/g, ' '), 80);
      const emoji = REACTIONS.includes(d.emoji) ? d.emoji : (texte ? '💬' : null);
      if (!de || !emoji || Date.now() - de.derniereReaction < 1000) return;
      de.derniereReaction = Date.now();
      const vers = d.vers && salle.joueurs.get(d.vers);
      const message = { de: { id: de.id, nom: de.nom, avatar: de.avatar }, vers: vers ? { id: vers.id, nom: vers.nom, avatar: vers.avatar } : null, emoji, texte: texte || null };
      if (salle.tabletteId) this.envoyer(salle.tabletteId, 'reaction', message);
      if (vers) { if (vers.connecte) this.envoyer(vers.connexionId, 'reaction', message); }
      else salle.joueurs.forEach((x) => { if (x.connecte && x.id !== de.id) this.envoyer(x.connexionId, 'reaction', message); });
    }

    /* ═══════════ L'enchaînement des jeux ═══════════ */

    jeuSuivant(salle) {
      this.arreterJeu(salle);
      salle.index++;
      if (salle.index >= salle.programme.length) return this.finDePartie(salle);
      const fiche = JEUX[salle.programme[salle.index]].fiche;
      salle.etat = 'intro';
      // La dernière manche d'une partie qui en compte au moins deux est la Grande Finale.
      const finale = this.estFinale(salle, salle.index);
      salle.multiplicateur = finale ? MULTIPLICATEUR_FINALE : 1;
      salle.defis = this.preparerDefis(salle);
      salle.inattendu = this.tirerInattendu(salle);
      const finA = Date.now() + this.introMs;
      const commun = {
        fiche, numero: salle.index + 1, total: salle.mode === 'surprise' ? null : salle.programme.length,
        surprise: salle.mode === 'surprise', objectif: salle.objectif,
