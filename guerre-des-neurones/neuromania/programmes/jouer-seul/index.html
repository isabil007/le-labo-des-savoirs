<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════════
   LA GUERRE DES NEURONES — Le MODE SOLO (un seul téléphone, un seul QR code)
  ════════════════════════════════════════════════════════════════════
   C'est la page des joueurs (joueur.html), avec en plus js/solo.js :
   le téléphone ouvre lui-même sa salle et joue la musique, le compte à
   rebours et le blind test. Adresse courte : …/solo
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151933">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>La guerre des neurones · Jouer seul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
  <style>
/*
 * ════════════════════════════════════════════════════════════════════
 *  LA GUERRE DES NEURONES — La feuille de style (tablette et téléphones)
 * ════════════════════════════════════════════════════════════════════
 *
 *  L'ambiance : un plateau de jeu de société posé sur une nappe bleu
 *  nuit, avec quatre couleurs franches pour les réponses. Une seule
 *  ambiance, sombre, assumée : elle repose les yeux en soirée et fait
 *  ressortir les couleurs. Les caractères « Atkinson Hyperlegible » ont
 *  été dessinés pour les personnes malvoyantes : ils restent lisibles
 *  de loin, sur une tablette posée au milieu de la table.
 *
 *  Toutes les couleurs sont des « jetons » (--nom) déclarés une fois
 *  ci-dessous : pour changer l'ambiance, il suffit de changer ces lignes.
 */

/* Mise en page : une scène plein écran, un bandeau en haut, le jeu au centre. */
:root {
  --nappe: #151933;        /* le fond, bleu nuit */
  --nappe-2: #1E2348;      /* les surfaces posées dessus */
  --nappe-3: #2A3166;      /* les éléments en relief */
  --trait: #3A427E;        /* les filets et bordures */
  --papier: #F4F5FB;       /* le texte principal */
  --brume: #A9AFD6;        /* le texte secondaire */
  --tournesol: #FFC93C;    /* l'accent principal (et la réponse B) */
  --corail: #FF6B5B;       /* réponse A, alertes */
  --menthe: #3DD6B5;       /* réponse C, succès */
  --lilas: #9B8CFF;        /* réponse D */
  --sur-couleur: #151933;  /* le texte posé sur une couleur vive */
  --ombre: 0 10px 30px rgba(5, 7, 20, .45);
  --police-titre: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --police-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --rayon: 18px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--nappe);
  background-image: radial-gradient(circle at 20% 0%, rgba(155, 140, 255, .10), transparent 45%), radial-gradient(circle at 100% 100%, rgba(61, 214, 181, .08), transparent 40%);
  color: var(--papier);
  font-family: var(--police-texte);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
h1, h2, h3, .titre { font-family: var(--police-titre); font-weight: 400; letter-spacing: .01em; line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--tournesol); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ─── Boutons ─── */
.bouton {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 52px; padding: .7em 1.4em; border-radius: 999px;
  background: var(--tournesol); color: var(--sur-couleur);
  font-family: var(--police-titre); font-size: 1.15rem; letter-spacing: .02em;
  box-shadow: 0 4px 0 #C99A1E; transition: transform .08s ease, box-shadow .08s ease, opacity .2s;
}
.bouton:active { transform: translateY(3px); box-shadow: 0 1px 0 #C99A1E; }
.bouton:disabled { opacity: .45; cursor: not-allowed; }
.bouton-discret { background: var(--nappe-3); color: var(--papier); box-shadow: 0 4px 0 #161B40; }
.bouton-discret:active { box-shadow: 0 1px 0 #161B40; }
.bouton-petit { min-height: 40px; padding: .4em 1em; font-size: .95rem; }

/* ─── Chronomètre ─── */
.chrono { display: flex; align-items: center; gap: .75rem; width: 100%; }
.chrono-piste { flex: 1; height: 12px; border-radius: 99px; background: var(--nappe-3); overflow: hidden; }
.chrono-remplissage { height: 100%; width: 100%; background: var(--menthe); transform-origin: left center; border-radius: 99px; }
.chrono-secondes { font-family: var(--police-titre); font-size: 1.2rem; min-width: 3.2ch; text-align: right; font-variant-numeric: tabular-nums; }
.chrono-urgent .chrono-remplissage { background: var(--corail); }
.chrono-urgent .chrono-secondes { color: var(--corail); }
/* Les cinq dernières secondes : le chrono bat comme un cœur. */
.chrono-urgent { animation: battement .5s ease-in-out infinite; }
.chrono-urgent .chrono-secondes { font-weight: 800; }
@keyframes battement { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.chrono-grand .chrono-piste { height: 18px; }
.chrono-grand .chrono-secondes { font-size: 1.7rem; }

/* ─── Les quatre couleurs de réponse ─── */
.choix-a { --c: var(--corail); }
.choix-b { --c: var(--tournesol); }
.choix-c { --c: var(--menthe); }
.choix-d { --c: var(--lilas); }
.forme { font-size: 1.1em; line-height: 1; }

/* ─── Petites étiquettes ─── */
.etiquette {
  display: inline-block; padding: .25em .8em; border-radius: 99px;
  background: var(--nappe-3); color: var(--tournesol);
  font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.muet { color: var(--brume); }

/* ─── Bulles d'information et réactions ─── */
#bulles { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.bulle { background: var(--papier); color: var(--sur-couleur); padding: .75em 1.1em; border-radius: 14px; box-shadow: var(--ombre); font-weight: 700; text-align: center; animation: monte .25s ease-out; transition: opacity .5s, transform .5s; }
.bulle.succes { background: var(--menthe); }
.bulle.alerte { background: var(--corail); color: #fff; }
.bulle-part { opacity: 0; transform: translateY(10px); }
@keyframes monte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ─── Bandeau « connexion perdue » ─── */
.hors-ligne { position: fixed; inset: 0 0 auto; z-index: 60; background: var(--corail); color: #fff; text-align: center; font-weight: 700; padding: calc(.5em + env(safe-area-inset-top, 0px)) 1em .5em; }

/* ═══════════════════════ LA TABLETTE ═══════════════════════ */

.tablette { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.tablette .bandeau {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--trait); background: rgba(21, 25, 51, .85);
}
.marque { font-family: var(--police-titre); font-size: 1.5rem; color: var(--tournesol); white-space: nowrap; }
.devise { margin: -6px 0 4px; font-family: var(--police-titre); color: var(--tournesol); font-size: 1.15rem; letter-spacing: .03em; }
.marque small { color: var(--brume); font-family: var(--police-texte); font-size: .8rem; margin-left: .5em; letter-spacing: .1em; }
.code-salle { font-family: var(--police-titre); font-size: 1.2rem; background: var(--nappe-3); padding: .2em .7em; border-radius: 10px; letter-spacing: .18em; }
.mini-joueurs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mini-joueur { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 99px; background: var(--nappe-2); white-space: nowrap; font-size: .9rem; transition: background .3s; }
.mini-joueur .avatar { font-size: 1.3rem; }
.mini-joueur b { font-variant-numeric: tabular-nums; color: var(--tournesol); }
.mini-joueur.absent { opacity: .45; }
.mini-joueur.a-repondu { background: var(--menthe); color: var(--sur-couleur); }
.mini-joueur.a-repondu b { color: var(--sur-couleur); }
.commandes { display: flex; gap: 8px; }

.scene {
  flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column;
  padding-block: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.scene > * { animation: apparait .35s ease-out; }
@keyframes apparait { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Le salon d'accueil */
.salon { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
.invitation { background: var(--papier); color: var(--sur-couleur); border-radius: 26px; padding: 26px; display: grid; gap: 14px; justify-items: center; text-align: center; box-shadow: var(--ombre); }
.invitation h2 { font-size: 1.9rem; }
.qr { width: min(300px, 60vw); aspect-ratio: 1; display: grid; place-items: center; background: #fff; border-radius: 12px; }
.qr svg, .qr img { width: 100%; height: auto; display: block; }
.adresse-facile { display: grid; gap: 2px; justify-items: center; color: var(--sur-couleur); }
.adresse-facile .muet { color: #4a4f72; font-size: .95rem; }
.adresse-nom { font-size: 1.5rem; letter-spacing: .02em; }
.adresse-secours { font-size: 1.05rem; color: #4a4f72; }
.fenetre-qr { position: fixed; inset: 0; z-index: 40; background: rgba(5, 7, 20, .82); display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px; cursor: pointer; animation: monte .2s ease-out; }
.fenetre-qr .qr { width: min(380px, 70vmin); }
.code-geant { font-family: var(--police-titre); font-size: clamp(3rem, 8vw, 5.4rem); letter-spacing: .14em; line-height: 1; color: var(--sur-couleur); }
.adresse { font-size: .95rem; word-break: break-all; color: #3A427E; }
.colonne { display: grid; gap: 22px; min-width: 0; }
.bloc-titre { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.bloc-titre h3 { font-size: 1.4rem; }
.grille-joueurs { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; }
.carte-joueur { display: flex; align-items: center; gap: 10px; background: var(--nappe-2); border: 1px solid var(--trait); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.carte-joueur .avatar { font-size: 1.9rem; }
.carte-joueur .nom { flex: 1; min-width: 0; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.carte-joueur .retirer { flex: none; width: 28px; height: 28px; border-radius: 50%; color: var(--brume); }
.carte-joueur .retirer:hover { background: var(--nappe-3); color: var(--corail); }
.place-libre { border-style: dashed; color: var(--brume); justify-content: center; min-height: 58px; }
.grille-jeux { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.carte-jeu { text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: 16px; background: var(--nappe-2); border: 2px solid var(--trait); transition: border-color .2s, background .2s; }
.carte-jeu .icone { font-size: 1.8rem; }
.carte-jeu strong { font-family: var(--police-titre); font-weight: 400; font-size: 1.1rem; }
.carte-jeu span { font-size: .88rem; color: var(--brume); }
.carte-jeu[aria-pressed="true"] { border-color: var(--tournesol); background: var(--nappe-3); }
.carte-jeu[aria-pressed="false"] { opacity: .55; }
.lancement { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

/* L'introduction d'un jeu */
.intro { margin: auto; max-width: 820px; text-align: center; display: grid; gap: 20px; justify-items: center; }
.intro .icone-geante { font-size: 6rem; line-height: 1; animation: rebond 1.4s ease-in-out infinite; }
.intro h1 { font-size: clamp(2.6rem, 6vw, 4.2rem); color: var(--tournesol); }
.intro .regle { font-size: 1.4rem; max-width: 46ch; }
@keyframes rebond { 50% { transform: translateY(-10px) rotate(-4deg); } }

/* Question à choix multiple */
.qcm { display: grid; gap: 22px; max-width: 1150px; width: 100%; margin: 0 auto; }
.qcm-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.qcm-question { font-size: clamp(1.8rem, 3.6vw, 2.8rem); font-family: var(--police-titre); text-wrap: balance; }
.reponses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.reponse { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border-radius: var(--rayon); background: var(--c); color: var(--sur-couleur); font-size: clamp(1.15rem, 2.2vw, 1.6rem); font-weight: 700; min-height: 84px; position: relative; transition: opacity .4s, transform .4s; }
.reponse .forme { font-size: 1.5em; }
.reponse .texte { flex: 1; min-width: 0; }
.reponse .compte { font-family: var(--police-titre); font-weight: 400; background: rgba(21, 25, 51, .2); padding: .1em .55em; border-radius: 10px; font-variant-numeric: tabular-nums; }
.reponses.revelee .reponse:not(.juste) { opacity: .28; transform: scale(.97); }
.reponses.revelee .reponse.juste { box-shadow: 0 0 0 5px var(--papier), var(--ombre); transform: scale(1.02); }
.qcm-pied { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.qcm-pied .chrono { flex: 1; min-width: 220px; }
.explication { background: var(--nappe-2); border-left: 6px solid var(--tournesol); border-radius: 0 var(--rayon) var(--rayon) 0; padding: 18px 22px; display: grid; gap: 6px; }
.explication strong { font-family: var(--police-titre); font-weight: 400; font-size: 1.4rem; color: var(--tournesol); }
.explication p { font-size: 1.2rem; }
.gagnants { display: flex; flex-wrap: wrap; gap: 8px; }
.gagnant { background: var(--nappe-3); border-radius: 99px; padding: 6px 14px; font-weight: 700; }
.gagnant b { color: var(--menthe); margin-left: .3em; font-variant-numeric: tabular-nums; }

/* Platine du blind test */
.platine { display: flex; align-items: center; gap: 24px; justify-content: center; }
.vinyle { width: 130px; height: 130px; border-radius: 50%; background: repeating-radial-gradient(circle, #0b0d1c 0 3px, #1c2040 3px 5px); display: grid; place-items: center; animation: tourne 2.2s linear infinite; box-shadow: var(--ombre); }
.vinyle::after { content: ""; width: 42px; height: 42px; border-radius: 50%; background: var(--tournesol); box-shadow: inset 0 0 0 16px var(--tournesol), inset 0 0 0 19px var(--nappe); }
@keyframes tourne { to { transform: rotate(360deg); } }

/* Dessine et devine */
.atelier { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 24px; align-items: start; }
.feuille { background: #FFFFFF; border-radius: var(--rayon); box-shadow: var(--ombre); aspect-ratio: 1; width: min(100%, calc(100vh - 210px)); max-width: 100%; justify-self: center; overflow: hidden; }
.feuille canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.indice { font-family: var(--police-titre); font-size: clamp(1.8rem, 3.5vw, 2.6rem); letter-spacing: .3em; word-break: break-all; color: var(--tournesol); }
.fil { display: grid; gap: 6px; max-height: 44vh; overflow: auto; }
.fil-ligne { background: var(--nappe-2); border-radius: 12px; padding: 8px 12px; animation: monte .25s ease-out; overflow-wrap: anywhere; }
.fil-ligne.trouve { background: var(--menthe); color: var(--sur-couleur); font-weight: 700; }

/* Les 7 erreurs */
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.duo .cadre, .cadre { border-radius: var(--rayon); overflow: hidden; box-shadow: var(--ombre); line-height: 0; background: #E4F4FF; }
.cadre svg { width: 100%; height: auto; display: block; }
.course { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.coureur { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--nappe-2); padding: 8px 12px; border-radius: 12px; }
.coureur .jauge { height: 10px; border-radius: 99px; background: var(--nappe-3); overflow: hidden; }
.coureur .jauge i { display: block; height: 100%; background: var(--menthe); transition: width .4s; }
.coureur b { font-variant-numeric: tabular-nums; }
.cercle-trouve { stroke: var(--menthe); }
.aide-ratee { color: var(--corail); font-weight: 700; }
.cercle-manque { stroke: var(--corail); stroke-dasharray: 6 5; }

/* Classement et podium */
.palmares { display: grid; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
.ligne-classement { display: grid; grid-template-columns: 3.2rem 2.4rem minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 16px; background: var(--nappe-2); border-radius: 14px; animation: monte .4s ease-out backwards; }
.ligne-classement .place { font-family: var(--police-titre); font-size: 1.5rem; color: var(--brume); }
.ligne-classement .avatar { font-size: 1.8rem; }
.ligne-classement .nom { font-weight: 700; font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne-classement .barre { height: 8px; border-radius: 99px; background: var(--tournesol); margin-top: 6px; transition: width .8s ease-out; }
.ligne-classement .total { text-align: right; font-family: var(--police-titre); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.ligne-classement .gain { display: block; font-family: var(--police-texte); font-size: .85rem; color: var(--menthe); }
.ligne-classement:first-child { background: var(--nappe-3); }
.ligne-classement:first-child .place { color: var(--tournesol); }
.marches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 14px; max-width: 760px; width: 100%; margin: 10px auto 26px; }
.marche { display: grid; justify-items: center; gap: 8px; text-align: center; }
.marche .avatar { font-size: 3.4rem; animation: rebond 2s ease-in-out infinite; }
.marche .socle { width: 100%; border-radius: 16px 16px 6px 6px; display: grid; place-items: center; font-family: var(--police-titre); font-size: 2.6rem; color: var(--sur-couleur); }
.marche:nth-child(1) .socle { height: 120px; background: #C9D1E8; }
.marche:nth-child(2) .socle { height: 170px; background: var(--tournesol); }
.marche:nth-child(3) .socle { height: 90px; background: #E3A26B; }
.marche .nom { font-weight: 700; font-size: 1.2rem; overflow-wrap: anywhere; }

/* Bulles de réaction qui s'envolent sur la tablette */
.envol { position: fixed; z-index: 40; pointer-events: none; display: flex; align-items: center; gap: 8px; background: var(--papier); color: var(--sur-couleur); padding: 8px 14px; border-radius: 99px; box-shadow: var(--ombre); font-weight: 700; animation: envol 3.6s ease-out forwards; max-width: 80vw; }
.envol .gros { font-size: 1.8rem; }
.envol .mot-envole { font-style: italic; max-width: 40vw; }
.envol.envol-lent { animation-duration: 6.4s; flex-wrap: wrap; border-radius: 22px; }
.petit-mot { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.petit-mot input { font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--trait); background: var(--nappe); color: var(--papier); min-width: 0; }
.petit-mot input:focus { outline: none; border-color: var(--tournesol); }
.mots-prets { display: flex; flex-wrap: wrap; gap: 8px; }
.mots-prets button { font: inherit; font-size: .95rem; padding: 8px 12px; border-radius: 99px; border: 1px solid var(--trait); background: var(--nappe-3); color: var(--papier); cursor: pointer; }
/* ─── Le défi inattendu ─── */
.inattendu { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 14px 22px; border-radius: var(--rayon); background: linear-gradient(135deg, var(--lilas), var(--corail)); color: var(--sur-couleur); box-shadow: var(--ombre); animation: secousse .6s ease-in-out 2; max-width: 760px; }
.inattendu strong { font-family: var(--police-titre); font-size: 1.6rem; }
.inattendu span { font-weight: 700; }
@keyframes secousse { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2deg) scale(1.03); } 75% { transform: rotate(2deg) scale(1.03); } }
.suite-auto { display: grid; gap: 6px; width: min(420px, 100%); }
@keyframes envol { 0% { opacity: 0; transform: translateY(30px) scale(.8); } 12% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-160px); } }

/* ═══════════════════════ LE TÉLÉPHONE ═══════════════════════ */

.telephone { min-height: 100%; display: flex; flex-direction: column; }
.telephone .entete {
  display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--nappe); border-bottom: 1px solid var(--trait);
}
.telephone .entete .avatar { font-size: 1.8rem; }
.telephone .entete .qui { flex: 1; min-width: 0; line-height: 1.15; }
.telephone .entete .qui strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.telephone .entete .qui span { color: var(--tournesol); font-size: .9rem; font-variant-numeric: tabular-nums; }
.bouton-reagir { width: 46px; height: 46px; border-radius: 50%; background: var(--nappe-3); font-size: 1.3rem; }
.ecran {
  flex: 1; display: flex; flex-direction: column; gap: 16px;
  padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.ecran > * { animation: apparait .3s ease-out; }
.centre { margin: auto 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
.centre .gros-emoji { font-size: 4.2rem; line-height: 1; }
.centre h2 { font-size: 1.9rem; }

/* Formulaire pour rejoindre */
.formulaire { display: grid; gap: 16px; }
.formulaire h1 { font-size: 2.1rem; color: var(--tournesol); }
.champ { display: grid; gap: 6px; }
.champ label { font-weight: 700; }
.champ input { width: 100%; min-height: 56px; border-radius: 14px; border: 2px solid var(--trait); background: var(--nappe-2); padding: 0 16px; font-size: 1.25rem; }
.champ input:focus { border-color: var(--tournesol); outline: none; }
#code { text-transform: uppercase; letter-spacing: .3em; font-family: var(--police-titre); font-size: 1.6rem; }
.choix-avatars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.choix-avatars button { aspect-ratio: 1; font-size: 1.6rem; border-radius: 12px; background: var(--nappe-2); border: 2px solid transparent; }
.choix-avatars button[aria-pressed="true"] { border-color: var(--tournesol); background: var(--nappe-3); }

/* Grosses touches de réponse */
.touches { display: grid; gap: 12px; flex: 1; }
.touche { display: flex; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; border-radius: var(--rayon); background: var(--c); color: var(--sur-couleur); font-weight: 700; font-size: 1.15rem; min-height: 74px; box-shadow: 0 5px 0 rgba(0, 0, 0, .28); transition: transform .08s; }
.touche:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); }
.touche .forme { font-size: 1.6rem; }
.verdict { font-size: 5rem; line-height: 1; }
.verdict-juste { color: var(--menthe); }
.verdict-faux { color: var(--corail); }

/* Atelier de dessin sur téléphone */
.toile { background: #fff; border-radius: 14px; aspect-ratio: 1; width: 100%; max-width: 100%; touch-action: none; overflow: hidden; }
.toile canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.palette .pastille { width: 38px; height: 38px; border-radius: 50%; background: var(--p); border: 3px solid var(--nappe); box-shadow: 0 0 0 2px var(--trait); }
.palette .pastille[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--tournesol); }
.palette .epaisseur { width: 42px; height: 42px; border-radius: 12px; background: var(--nappe-3); display: grid; place-items: center; }
.palette .epaisseur i { display: block; border-radius: 50%; background: var(--papier); }
.palette .epaisseur[aria-pressed="true"] { outline: 3px solid var(--tournesol); }
.mot-secret { background: var(--papier); color: var(--sur-couleur); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mot-secret strong { font-family: var(--police-titre); font-weight: 400; font-size: 1.6rem; overflow-wrap: anywhere; }
.saisie { display: flex; gap: 8px; }
.saisie input { flex: 1; min-width: 0; min-height: 56px; border-radius: 14px; border: 2px solid var(--trait); background: var(--nappe-2); padding: 0 14px; font-size: 1.2rem; }
.saisie input:focus { outline: none; border-color: var(--tournesol); }

/* Feuille de réactions */
.feuille-reactions { position: fixed; inset: auto 0 0; z-index: 30; background: var(--nappe-2); border-radius: 22px 22px 0 0; box-shadow: var(--ombre); display: grid; gap: 14px; padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: monte .25s ease-out; max-height: 80vh; overflow: auto; }
.destinataires { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.destinataires button { flex: none; padding: 8px 12px; border-radius: 99px; background: var(--nappe-3); white-space: nowrap; }
.destinataires button[aria-pressed="true"] { background: var(--tournesol); color: var(--sur-couleur); font-weight: 700; }
.emojis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.emojis button { aspect-ratio: 1.3; font-size: 2rem; border-radius: 14px; background: var(--nappe-3); }
.voile { position: fixed; inset: 0; z-index: 29; background: rgba(5, 7, 20, .55); }

/* ─── Écrans étroits (tablette en portrait, téléphones) ─── */
@media (max-width: 860px) {
  .salon, .atelier { grid-template-columns: minmax(0, 1fr); }
  .duo { grid-template-columns: minmax(0, 1fr); }
  .reponses { grid-template-columns: minmax(0, 1fr); }
  .feuille { width: 100%; }
}
@media (max-width: 420px) {
  .choix-avatars { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .marche .avatar { font-size: 2.4rem; }
}
/* ─── Le piment : défis et Grande Finale ─── */
.bandeau-finale { display: grid; gap: 2px; justify-items: center; padding: 10px 22px; border-radius: var(--rayon); background: var(--tournesol); color: var(--sur-couleur); font-family: var(--police-titre); font-size: 1.6rem; letter-spacing: .04em; box-shadow: 0 0 0 4px rgba(255, 201, 60, .25), var(--ombre); animation: lueur 1.2s ease-in-out infinite; text-align: center; }
.bandeau-finale small { font-family: var(--police-texte); font-size: 1rem; font-weight: 700; letter-spacing: 0; }
@keyframes lueur { 50% { box-shadow: 0 0 0 10px rgba(255, 201, 60, .1), var(--ombre); } }
.intro-finale h1 { color: var(--corail); }
.cibles { display: grid; gap: 10px; justify-items: center; }
.carte-defi { display: grid; gap: 6px; justify-items: center; padding: 14px 18px; border-radius: var(--rayon); background: var(--nappe-3); border: 2px solid var(--tournesol); font-size: 1.15rem; max-width: 26rem; }
.carte-defi strong { font-size: 1.25rem; }
.carte-defi.defi-reussi { border-color: var(--menthe); }
.carte-defi.defi-rate { border-color: var(--trait); opacity: .85; }
.texte-finale { color: var(--tournesol); font-weight: 700; }

/* ─── Feu vert ! ─── */
.reflexe { margin: auto; width: 100%; max-width: 1000px; display: grid; gap: 22px; justify-items: center; text-align: center; padding: 18px; border-radius: 30px; animation: pouls-fond 0.9s ease-in-out infinite; }
@keyframes pouls-fond { 0%, 100% { box-shadow: inset 0 0 0 0 rgba(255, 107, 91, 0); } 15% { box-shadow: inset 0 0 120px 10px rgba(255, 107, 91, .28); } }
.feu { width: min(42vh, 360px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5a5f8a, #22264f 70%); box-shadow: 0 0 0 10px var(--nappe-3), 0 0 60px rgba(0, 0, 0, .5); animation: battement-feu 0.9s ease-in-out infinite; }
@keyframes battement-feu { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.07); } 24% { transform: scale(.98); } 36% { transform: scale(1.04); } }
.consigne-reflexe { font-family: var(--police-titre); font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: .03em; }
.reflexe.go { animation: none; background: var(--menthe); color: var(--sur-couleur); }
.reflexe.go .feu { animation: none; background: radial-gradient(circle at 35% 30%, #b8ffe9, #15c79d 70%); box-shadow: 0 0 0 10px #fff, 0 0 120px 30px rgba(61, 214, 181, .9); transform: scale(1.12); }
.reflexe.go .consigne-reflexe { font-size: clamp(3.4rem, 10vw, 6.5rem); animation: secousse .25s ease-in-out 3; }
.reflexe.go .muet, .reflexe.go .etiquette { color: var(--sur-couleur); }
.reflexe.piege { animation: none; background: var(--corail); color: var(--sur-couleur); }
.reflexe.piege .feu { animation: secousse .2s ease-in-out infinite; background: radial-gradient(circle at 35% 30%, #ffc2ba, #e03a28 70%); box-shadow: 0 0 0 10px #fff, 0 0 120px 30px rgba(255, 107, 91, .9); }
.reflexe.piege .muet, .reflexe.piege .etiquette { color: var(--sur-couleur); }
.reflexe-fin { animation: none; }
.faux-depart { background: var(--corail); color: var(--sur-couleur); }
.ecran-reflexe { gap: 18px; }
.gros-bouton-reflexe { width: min(78vw, 340px); aspect-ratio: 1; border-radius: 50%; border: 0; font: inherit; font-family: var(--police-titre); font-size: 1.6rem; color: var(--papier); background: radial-gradient(circle at 35% 30%, #5a5f8a, #22264f 70%); box-shadow: 0 0 0 8px var(--nappe-3), 0 12px 30px rgba(0, 0, 0, .5); touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; animation: battement-feu 0.9s ease-in-out infinite; }
.gros-bouton-reflexe.go { animation: none; background: radial-gradient(circle at 35% 30%, #b8ffe9, #15c79d 70%); color: var(--sur-couleur); font-size: 2.6rem; box-shadow: 0 0 0 8px #fff, 0 0 60px 20px rgba(61, 214, 181, .8); }
.gros-bouton-reflexe.piege { animation: secousse .2s ease-in-out infinite; background: radial-gradient(circle at 35% 30%, #ffc2ba, #e03a28 70%); color: #fff; font-size: 1.8rem; }
.gros-bouton-reflexe.tape { transform: scale(.94); opacity: .85; }

/* ─── Les illustrations (mémoire, casse-tête, recette mystère) ─── */
.illustration { display: grid; gap: 12px; justify-items: center; }
.ill-ligne { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.ill-grille .ill-ligne { display: grid; gap: 12px; }
.ill-tuile { min-width: 74px; height: 74px; padding: 0 10px; display: grid; place-items: center; border-radius: 18px; background: var(--papier); color: var(--sur-couleur); font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), opacity .35s; }
.ill-grille .ill-tuile { width: clamp(64px, 9vw, 104px); height: clamp(64px, 9vw, 104px); font-size: clamp(2.2rem, 4.5vw, 3.6rem); }
.ill-op { background: transparent; box-shadow: none; color: var(--brume); min-width: 30px; padding: 0; }
.ill-mystere { background: var(--tournesol); animation: battement-feu 1.2s ease-in-out infinite; }
.ill-nombre { font-family: var(--police-titre); }
.ill-cache { opacity: 0; transform: scale(.3) rotate(-12deg); }
.ill-mini .ill-tuile { min-width: 48px; height: 48px; font-size: 1.7rem; border-radius: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.ill-mini.ill-grille .ill-tuile { width: clamp(44px, 17vw, 66px); height: clamp(44px, 17vw, 66px); font-size: clamp(1.6rem, 8vw, 2.4rem); }
.ill-mini .ill-op { min-width: 18px; }
.memoire { margin: auto; display: grid; gap: 18px; justify-items: center; text-align: center; }
.memoire h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); color: var(--tournesol); }

/* ─── Mots croisés : les cases du mot, toujours sur une seule ligne ─── */
.ill-mot { width: 100%; }
.ill-mot .ill-ligne { flex-wrap: nowrap; gap: 6px; }
.ill-mot .ill-tuile { flex: 0 0 auto; min-width: 0; padding: 0; width: min(66px, calc((100vw - 220px) / 10)); height: min(66px, calc((100vw - 220px) / 10)); border-radius: 10px; font-size: min(2.4rem, calc((100vw - 220px) / 16)); }
.ill-mot.ill-mini .ill-ligne { gap: 4px; }
.ill-mot.ill-mini .ill-tuile { width: min(40px, calc((100vw - 90px) / 10)); height: min(40px, calc((100vw - 90px) / 10)); border-radius: 7px; font-size: min(1.5rem, calc((100vw - 90px) / 16)); box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
.ill-mot .ill-mystere { animation: none; }

/* ─── Le Puzzle : 9 pièces qui glissent à leur place ─── */
.puzzle-cadre { position: relative; width: min(38vh, 400px); aspect-ratio: 1; margin: 0 auto; border-radius: 20px; background: var(--nappe-3); box-shadow: var(--ombre), 0 0 0 6px var(--nappe-3); container-type: inline-size; }
.puzzle-cadre.puzzle-mini { width: min(62vw, 32vh, 260px); border-radius: 16px; box-shadow: var(--ombre), 0 0 0 4px var(--nappe-3); }
.puzzle-piece { position: absolute; width: 33.334%; height: 33.334%; overflow: hidden; background: var(--papier); border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3), 0 4px 10px rgba(0, 0, 0, .3); transition: transform .9s cubic-bezier(.3, 1.35, .5, 1), box-shadow .9s, border-radius .9s; }
.puzzle-en-place { z-index: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); border-radius: 2px; }
.puzzle-piece:not(.puzzle-en-place) { z-index: 1; }
.puzzle-fini .puzzle-piece { box-shadow: none; border-radius: 0; }
.puzzle-fini { overflow: hidden; }
.puzzle-image { position: absolute; width: 300%; height: 300%; }
.puzzle-emoji { display: grid; place-items: center; font-size: 74cqw; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
img.puzzle-image { object-fit: cover; }

/* ─── Drapeaux du monde ─── */
.cadre-drapeau { display: grid; justify-items: center; }
.drapeau { width: min(420px, 44vh); height: auto; border-radius: 10px; box-shadow: 0 0 0 4px var(--papier), var(--ombre); overflow: hidden; animation: flotter 3s ease-in-out infinite; transform-origin: left center; }
.drapeau-mini { width: min(64vw, 260px); border-radius: 8px; box-shadow: 0 0 0 3px var(--papier), var(--ombre); }
@keyframes flotter { 0%, 100% { transform: perspective(600px) rotateY(0deg); } 50% { transform: perspective(600px) rotateY(-8deg) skewY(-1deg); } }

/* ─── Le blind test ─── */
.platine-tubes { display: flex; align-items: center; gap: 22px; justify-content: center; }
.vinyle-tubes { width: 150px; height: 150px; border-radius: 50%; background: repeating-radial-gradient(circle, #111 0 3px, #2a2a2a 3px 5px); box-shadow: var(--ombre); display: grid; place-items: center; animation: tourne 2.2s linear infinite; }
.vinyle-tubes::after { content: ""; width: 46px; height: 46px; border-radius: 50%; background: var(--tournesol); box-shadow: inset 0 0 0 18px var(--tournesol), inset 0 0 0 20px #111; }
.vinyle-tubes.en-attente { animation-duration: 6s; opacity: .6; }
.pochette { width: 180px; height: 180px; border-radius: 14px; box-shadow: var(--ombre); object-fit: cover; }
.etat-extrait { font-size: 1.1rem; color: var(--brume); }
.egaliseur { display: flex; gap: 5px; align-items: flex-end; height: 60px; }
.egaliseur span { width: 10px; background: var(--menthe); border-radius: 4px; animation: egal 0.9s ease-in-out infinite; }
.egaliseur span:nth-child(2) { animation-delay: .15s; background: var(--tournesol); } .egaliseur span:nth-child(3) { animation-delay: .3s; background: var(--corail); }
.egaliseur span:nth-child(4) { animation-delay: .45s; background: var(--lilas); } .egaliseur span:nth-child(5) { animation-delay: .6s; }
@keyframes egal { 0%, 100% { height: 12px; } 50% { height: 58px; } }
.credit-apple { font-size: .9rem; color: var(--brume); }
.credit-apple a { color: var(--brume); }

/* ─── Les contenus en version de poche (téléphones) ─── */
.question-tel { font-family: var(--police-titre); font-size: 1.35rem; line-height: 1.25; text-wrap: balance; margin: 4px 0; }
.zoom-cadre.zoom-cadre-mini { width: min(62vw, 34vh, 260px); border-radius: 18px; box-shadow: var(--ombre), 0 0 0 4px var(--nappe-3); }
.zoom-cadre-mini .zoom-emoji { font-size: min(46vw, 25vh, 190px); }
.encouragement { font-weight: 700; color: var(--tournesol); min-height: 1.4em; }
.explication-tel { width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--nappe-2); border-left: 4px solid var(--tournesol); display: grid; gap: 4px; }
.explication-tel p { margin: 0; color: var(--brume); }
.top-tel { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 6px; }
.top-tel li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--nappe-2); font-weight: 700; }
.top-tel li b { color: var(--tournesol); font-variant-numeric: tabular-nums; }
.commentateur-tel { font-size: 1rem; text-align: left; width: 100%; }
.feuille.feuille-devin { width: min(84vw, 36vh); }
.ordre-hasard { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--trait); background: var(--nappe-2); color: var(--papier); font: inherit; cursor: pointer; }
.ordre-hasard[aria-pressed="true"] { border-color: var(--tournesol); }

/* ─── Le zoom infernal ─── */
.zoom-ligne { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.zoom-cadre { width: min(46vh, 440px); aspect-ratio: 1; border-radius: 26px; overflow: hidden; background: var(--papier); display: grid; place-items: center; box-shadow: var(--ombre), 0 0 0 6px var(--nappe-3); position: relative; }
.zoom-contenu { width: 100%; height: 100%; display: grid; place-items: center; will-change: transform; }
.zoom-emoji { font-size: min(34vh, 320px); line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.zoom-cadre img { width: 100%; height: 100%; object-fit: cover; }
.zoom-revele .zoom-contenu { transition: transform .6s ease-out; }
.reponses-compactes { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .zoom-ligne { grid-template-columns: 1fr; justify-items: center; } }

/* ─── Le tribunal des gages ─── */
.tribunal { margin: auto; max-width: 900px; width: 100%; display: grid; gap: 16px; justify-items: center; text-align: center; }
.tribunal .accuse { display: flex; align-items: center; gap: 18px; }
.tribunal .avatar-geant { font-size: 4.5rem; line-height: 1; animation: rebond 1.4s ease-in-out infinite; }
.tribunal h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); color: var(--tournesol); }
.gage-revele { margin: 0; padding: 18px 26px; border-radius: var(--rayon); background: var(--papier); color: var(--sur-couleur); font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; max-width: 760px; box-shadow: var(--ombre); }
.consigne-vote { font-size: 1.25rem; }
.verdict { display: grid; gap: 4px; padding: 16px 28px; border-radius: var(--rayon); font-family: var(--police-titre); font-size: clamp(1.8rem, 4vw, 2.6rem); animation: monte .35s ease-out; }
.verdict small { font-family: var(--police-texte); font-size: 1.1rem; font-weight: 700; }
.verdict-oui { background: var(--menthe); color: var(--sur-couleur); }
.verdict-non { background: var(--corail); color: var(--sur-couleur); }
.boutons-vote { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.boutons-vote .bouton { font-size: 1.3rem; padding: 22px 10px; }
.vote-oui { background: var(--menthe); color: var(--sur-couleur); }
.vote-non { background: var(--corail); color: var(--sur-couleur); }
.carte-gage { border-color: var(--lilas); }
.carte-gage strong { font-size: 1.15rem; }

/* ─── La partie surprise ─── */
.choix-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.choix-mode .mode { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border-radius: var(--rayon); border: 2px solid var(--trait); background: var(--nappe-2); color: var(--papier); font: inherit; cursor: pointer; }
.choix-mode .mode strong { font-size: 1.15rem; }
.choix-mode .mode span { color: var(--brume); font-size: .95rem; }
.choix-mode .mode[aria-pressed="true"] { border-color: var(--tournesol); background: var(--nappe-3); box-shadow: 0 0 0 3px rgba(255, 201, 60, .2); }
.explication-surprise { display: grid; gap: 14px; padding: 16px 18px; border-radius: var(--rayon); background: var(--nappe-2); border: 1px dashed var(--trait); font-size: 1.05rem; }
.icones-jeux { display: flex; gap: 14px; font-size: 2.2rem; justify-content: center; }
.icones-jeux span { animation: rebond 1.6s ease-in-out infinite; }
.icones-jeux span:nth-child(2) { animation-delay: .2s; } .icones-jeux span:nth-child(3) { animation-delay: .4s; }
.icones-jeux span:nth-child(4) { animation-delay: .6s; } .icones-jeux span:nth-child(5) { animation-delay: .8s; }
.piste { position: relative; display: grid; gap: 4px; padding: 10px 44px 10px 18px; border-radius: var(--rayon); background: var(--nappe-2); border: 1px solid var(--trait); }
.couloir { position: relative; height: 34px; border-bottom: 1px dashed var(--trait); }
.coureur { position: absolute; top: 0; font-size: 1.7rem; line-height: 34px; transition: left .8s ease-out; }

<script>/* moteur/outils.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LA GUERRE DES NEURONES — Boîte à outils
 * ════════════════════════════════════════════════════════════════════
 *
 *  Ce fichier rassemble de petites fonctions utiles partout : mélanger
 *  un paquet de cartes, tirer des éléments au hasard, comparer deux mots
 *  en pardonnant les accents et les fautes de frappe, fabriquer un code
 *  de salle facile à lire…
 *
 *  Une particularité : ce fichier (comme tous ceux du dossier « moteur »)
 *  fonctionne à DEUX endroits. Sur le serveur (Node.js), pour la vraie
 *  partie avec téléphones ; et directement dans le navigateur, pour le
 *  simulateur où tout tourne sur un seul écran. Les quelques lignes
 *  d'emballage ci-dessous s'occupent de cette double vie : elles
 *  regardent si l'on est dans Node (« module » existe) ou dans un
 *  navigateur (on range alors le module dans l'objet global GT).
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) {
    module.exports = fabrique(require);
  } else {
    racine.GT = racine.GT || { modules: {} };
    racine.GT.modules = racine.GT.modules || {};
    racine.GT.modules[nom] = fabrique(function (chemin) {
      // Dans le navigateur, « ../contenus/quiz » devient simplement « contenus/quiz ».
      return racine.GT.modules[chemin.replace(/^(\.\.?\/)+/, '')];
    });
  }
})(this, 'outils', function () {
  'use strict';

  /*
   * Mélange de Fisher-Yates : on parcourt le paquet de la fin vers le
   * début et l'on échange chaque carte avec une carte tirée au sort
   * parmi celles qui restent. Chaque ordre a exactement la même chance
   * d'apparaître : c'est le mélange « honnête » des croupiers.
   * On travaille sur une copie pour ne jamais abîmer la liste d'origine.
   */
  function melanger(liste) {
    const copie = liste.slice();
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }

  /* Tirer « n » éléments différents : on mélange, puis on garde le haut du paquet. */
  function tirer(liste, n) {
    return melanger(liste).slice(0, Math.min(n, liste.length));
  }

  /* Un nombre entier au hasard entre min et max (bornes comprises). */
  function entier(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  /*
   * Le code de salle : quatre lettres, comme « BRIK ». On évite les
   * lettres qui se confondent à l'œil ou à l'oreille (I et L, O et Q…),
   * pour que Mamie comme le petit-fils puissent le recopier sans peine.
   */
  const LETTRES_LISIBLES = 'ABCDEFGHJKMNPRSTUVWXYZ';
  function codeSalle(dejaPris) {
    let code;
    do {
      code = '';
      for (let i = 0; i < 4; i++) code += LETTRES_LISIBLES[entier(0, LETTRES_LISIBLES.length - 1)];
    } while (dejaPris && dejaPris(code));
    return code;
  }

  /* Un identifiant unique et discret pour chaque joueur. */
  function identifiant(prefixe) {
    return (prefixe || 'id') + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }

  /*
   * « Normaliser » un mot, c'est le débarrasser de tout ce qui ne compte
   * pas quand on devine : majuscules, accents, articles, tirets, espaces
   * et le « s » du pluriel. Ainsi « Les Licornes ! », « licorne » et
   * « LICORNE » deviennent tous « licorne ».
   */
  function normaliser(texte) {
    return String(texte || '')
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '') // on retire les accents
      .replace(/^\s*(les|le|la|un|une|des|du)\s+|^\s*l['’]\s*/, '') // on retire l'article du début
      .replace(/[^a-z0-9]/g, '')                        // on ne garde que lettres et chiffres
      .replace(/(s|x)$/, '');                           // on oublie le pluriel
  }

  /*
   * Distance de Levenshtein : le nombre minimal de lettres à ajouter,
   * retirer ou remplacer pour passer d'un mot à l'autre. « girafe » et
   * « giraffe » sont à distance 1 : on pourra dire « Presque ! ».
   */
  function distance(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let precedente = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const ligne = [i];
      for (let j = 1; j <= n; j++) {
        const cout = a[i - 1] === b[j - 1] ? 0 : 1;
        ligne[j] = Math.min(precedente[j] + 1, ligne[j - 1] + 1, precedente[j - 1] + cout);
      }
      precedente = ligne;
    }
    return precedente[n];
  }

  /* On nettoie ce que tapent les joueurs : pas de texte interminable, pas de balises. */
  function nettoyer(texte, longueurMax) {
    return String(texte || '').replace(/[<>]/g, '').trim().slice(0, longueurMax || 40);
  }

  /*
   * LA MÉMOIRE ANTI-RÉPÉTITION. « tirerNeuf » tire comme « tirer », mais
   * en se souvenant de ce qui est déjà sorti, catégorie par catégorie
   * (« quiz-jeunes », « drapeaux », « gages »…). Il pioche d'abord dans
   * ce qui n'a JAMAIS été posé ; quand toute la réserve y est passée, il
   * entame un nouveau tour (sans reprendre ce qu'il vient de choisir).
   * Résultat : on ne revoit une question qu'après avoir vu toutes les
   * autres de sa catégorie. Le serveur enregistre cette mémoire dans un
   * fichier (souvenirs.json) pour qu'elle tienne d'une soirée à l'autre.
   */
  const souvenirs = new Map(); // catégorie → ensemble des éléments déjà sortis
  const cleParDefaut = (x) => (typeof x === 'string' ? x
    : x.question || x.sujet || x.plat || x.amorce || x.pays || (x.titre ? x.titre + ' — ' + x.artiste : JSON.stringify(x)));
  function tirerNeuf(categorie, liste, n, cle) {
    cle = cle || cleParDefaut;
    let vus = souvenirs.get(categorie);
    if (!vus) souvenirs.set(categorie, (vus = new Set()));
    let choisis = tirer(liste.filter((x) => !vus.has(cle(x))), n);
    if (choisis.length < n) {
      vus.clear(); // un tour complet est terminé : on recommence, sans reprendre ce qu'on vient de tirer
      const deja = new Set(choisis.map(cle));
      choisis = choisis.concat(tirer(liste.filter((x) => !deja.has(cle(x))), n - choisis.length));
    }
    choisis.forEach((x) => vus.add(cle(x)));
    memoireModifiee = true;
    return choisis;
  }
  let memoireModifiee = false;
  /* Pour les jeux qui choisissent eux-mêmes : la liste de ce qui n'est jamais sorti (au moins « minimum » éléments)… */
  function nonVus(categorie, liste, minimum, cle) {
    cle = cle || cleParDefaut;
    let vus = souvenirs.get(categorie);
    if (!vus) souvenirs.set(categorie, (vus = new Set()));
    let frais = liste.filter((x) => !vus.has(cle(x)));
    if (frais.length < (minimum || 1)) { vus.clear(); frais = liste.slice(); }
    return frais;
  }
  /* … puis on note ce qui a vraiment été joué. */
  function marquerVus(categorie, elements, cle) {
    cle = cle || cleParDefaut;
    let vus = souvenirs.get(categorie);
    if (!vus) souvenirs.set(categorie, (vus = new Set()));
    elements.forEach((x) => vus.add(cle(x)));
    memoireModifiee = true;
  }
  /* Pour l'enregistrement sur disque (serveur.js). */
  const memoire = {
    exporter() { memoireModifiee = false; const o = {}; souvenirs.forEach((v, k) => { o[k] = Array.from(v); }); return o; },
    importer(o) { Object.entries(o || {}).forEach(([k, v]) => { if (Array.isArray(v)) souvenirs.set(k, new Set(v)); }); },
    modifiee() { return memoireModifiee; },
    oublier() { souvenirs.clear(); }
  };

  return { melanger, tirer, tirerNeuf, nonVus, marquerVus, memoire, entier, codeSalle, identifiant, normaliser, distance, nettoyer };
});

<script>/* moteur/jeux/base.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  LES FONDATIONS COMMUNES À TOUS LES MINI-JEUX
 * ════════════════════════════════════════════════════════════════════
 *
 *  Chaque mini-jeu est une « classe », c'est-à-dire un moule à partir
 *  duquel le moteur fabrique une partie neuve à chaque lancement. Ce
 *  fichier définit deux moules de base dont les vrais jeux héritent :
 *
 *  1. Jeu : le strict minimum. Il sait gérer ses minuteurs (et surtout
 *     les arrêter proprement quand on quitte le jeu, sinon un minuteur
 *     oublié pourrait afficher une question au milieu du jeu suivant !).
 *
 *  2. JeuQCM : le moule des jeux « question à choix multiple ». Le quiz,
 *     le zoom infernal et les pièges du français fonctionnent tous de la
 *     même façon : la tablette pose une question, chaque téléphone
 *     affiche les réponses en grosses touches de couleur, on compte les
 *     points (plus on répond vite, plus on gagne), puis on révèle la
 *     bonne réponse avec une anecdote. Écrire cette mécanique une seule
 *     fois évite de la recopier trois fois… et d'y glisser trois fois
 *     les mêmes erreurs.
 *
 *  LE « CONTEXTE » (ctx) que le moteur confie à chaque jeu
 *  ───────────────────────────────────────────────────────
 *  Un jeu ne parle jamais directement aux appareils : il passe par ce
 *  contexte, une sorte de régisseur de plateau.
 *    ctx.joueurs()                    → la liste des joueurs présents
 *    ctx.joueur(id)                   → un joueur précis
 *    ctx.ecranTablette(type, donnees) → change ce qu'affiche la tablette
 *    ctx.ecranJoueur(id, type, d)     → change l'écran d'un téléphone
 *    ctx.ecranTousJoueurs(type, d)    → change l'écran de tous les téléphones
 *                                       (d peut être une fonction joueur → données,
 *                                        pour personnaliser chaque écran)
 *    ctx.evenementTablette(type, d)   → petite mise à jour sans changer d'écran
 *    ctx.evenementJoueur(id, type, d) → idem pour un téléphone
 *    ctx.ajouterPoints(id, points)    → crédite des points au score général et renvoie
 *                                       le montant réellement crédité (doublé en finale)
 *    ctx.multiplicateur()             → 2 pendant la Grande Finale, 1 sinon
 *    ctx.terminer()                   → « j'ai fini », le moteur affiche le classement
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/base', function (exiger) {
  'use strict';
  const outils = exiger('../outils');

  class Jeu {
    constructor(ctx) {
      this.ctx = ctx;
      this.minuteurs = new Map(); // tous les réveils programmés par ce jeu : minuteur → { tache, echeance }
      this.figeA = null;          // l'heure à laquelle le jeu a été mis en pause (null s'il tourne)
      this.actif = true;          // passe à « faux » dès que le jeu est arrêté
    }

    /*
     * « Dans tant de millisecondes, fais ceci. » On garde une trace de
     * chaque réveil pour pouvoir tous les annuler d'un coup. Et si le jeu
     * a été arrêté entre-temps, la tâche n'est tout simplement pas faite.
     */
    attendre(ms, tache) {
      const minuteur = setTimeout(() => {
        this.minuteurs.delete(minuteur);
        if (this.actif) tache();
      }, ms);
      this.minuteurs.set(minuteur, { tache, echeance: Date.now() + ms });
      return minuteur;
    }

    annulerMinuteurs() {
      this.minuteurs.forEach((v, minuteur) => clearTimeout(minuteur));
      this.minuteurs.clear();
    }

    /*
     * LA PAUSE ⏸ — « figer » arrête tous les réveils en notant combien de
     * temps il leur restait. « relancer » les reprogramme avec ce temps
     * restant, et décale d'autant toutes les heures que le jeu a notées
     * (fin de la question, départ du feu vert…) : pour le jeu, c'est comme
     * si le temps s'était arrêté. Marche pour tous les jeux sans qu'ils
     * aient rien à faire, y compris un jeu qui en contient un autre.
     */
    figer() {
      if (this.figeA) return;
      this.figeA = Date.now();
      this.enAttente = Array.from(this.minuteurs.entries()).map(([minuteur, v]) => { clearTimeout(minuteur); return { tache: v.tache, reste: Math.max(0, v.echeance - this.figeA) }; });
      this.minuteurs.clear();
      if (this.sousJeu && this.sousJeu.figer) this.sousJeu.figer();
    }

    relancer(duree) {
      if (!this.figeA) return 0;
      // La durée de la pause peut être imposée par le moteur, pour que le jeu et les écrans soient décalés d'autant.
      if (typeof duree !== 'number') duree = Date.now() - this.figeA;
      this.figeA = null;
      // Toute heure notée par le jeu (un grand nombre de millisecondes) est décalée de la durée de la pause.
      Object.keys(this).forEach((cle) => { if (typeof this[cle] === 'number' && this[cle] > 1e12) this[cle] += duree; });
      (this.enAttente || []).forEach((r) => this.attendre(r.reste, r.tache));
      this.enAttente = null;
      if (this.sousJeu && this.sousJeu.relancer) this.sousJeu.relancer(duree);
      return duree;
    }

    /* Le moteur appelle « arreter » quand on quitte le jeu, quelle qu'en soit la raison. */
    arreter() {
      this.actif = false;
      this.annulerMinuteurs();
    }

    /* Ce que chaque jeu redéfinit à sa façon : */
    demarrer() {}               // le coup d'envoi
    action(/* joueurId, donnees */) {} // un joueur a touché quelque chose sur son téléphone
    joueurArrive(/* joueurId */) {}    // un joueur arrive (ou revient) en cours de jeu
    joueurParti(/* joueurId */) {}     // un téléphone s'est déconnecté
    passer() { this.ctx.terminer(); }  // l'animateur appuie sur « Passer » sur la tablette
  }

  /* ──────────────────────────────────────────────────────────────── */

  class JeuQCM extends Jeu {
    /*
     * Les réglages possibles :
     *   questions      : la liste des questions, déjà préparées par le jeu
     *   dureeMs        : le temps pour répondre
     *   revelationMs   : le temps pendant lequel la réponse reste affichée
     *   pointsBase     : ce que rapporte une bonne réponse, même à la dernière seconde
     *   bonusVitesse   : le bonus maximal pour une réponse instantanée
     */
    constructor(ctx, reglages) {
      super(ctx);
      this.reglages = Object.assign({ dureeMs: 20000, revelationMs: 9000, pointsBase: 500, bonusVitesse: 500 }, reglages);
      // On mélange l'ordre des réponses de chaque question en retenant où est partie la bonne.
      this.questions = (reglages.questions || []).map((q) => {
        const ordre = outils.melanger(q.choix.map((texte, i) => ({ texte, bonne: i === 0 })));
        return Object.assign({}, q, { choix: ordre.map((c) => c.texte), bonne: ordre.findIndex((c) => c.bonne) });
      });
      this.index = -1;
      this.phase = 'attente';
    }

    demarrer() { this.questionSuivante(); }

    questionSuivante() {
      this.index++;
      if (this.index >= this.questions.length) return this.ctx.terminer();
      const q = this.questions[this.index];
      this.phase = 'question';
      this.reponses = new Map(); // joueurId → { choix, restantMs }
      this.debut = Date.now();
      this.finA = this.debut + this.reglages.dureeMs;
      const commun = { numero: this.index + 1, total: this.questions.length, finA: this.finA, dureeMs: this.reglages.dureeMs };

      // La tablette affiche la question en grand, avec les réponses et le compte à rebours.
      this.ctx.ecranTablette('qcm-question', Object.assign({}, commun, this.vueTablette(q), {
        choix: q.choix, nbRepondu: 0, nbJoueurs: this.ctx.joueurs().length
      }));
      // Les téléphones affichent seulement les touches de couleur : on regarde la tablette, pas son écran.
      // Le téléphone reçoit aussi la question (et l'image du zoom) : on peut jouer sans quitter son écran des yeux.
      this.ctx.ecranTousJoueurs('qcm-choix', Object.assign({}, commun, { choix: q.choix, consigne: this.consigneJoueur(q), vue: this.vueJoueur(q) }));
      this.attendre(this.reglages.dureeMs + 300, () => this.reveler());
    }

    action(joueurId, d) {
      if (!d || d.type !== 'reponse' || this.phase !== 'question') return;
      if (this.reponses.has(joueurId)) return; // une seule réponse par question, pas de repentir !
      const q = this.questions[this.index];
      const choix = Number(d.choix);
      if (!(choix >= 0 && choix < q.choix.length)) return;
      this.reponses.set(joueurId, { choix, restantMs: Math.max(0, this.finA - Date.now()) });
      this.ctx.ecranJoueur(joueurId, 'qcm-attente', { choix, texte: q.choix[choix], finA: this.finA, dureeMs: this.reglages.dureeMs, vue: this.vueJoueur(q) });
      this.ctx.evenementTablette('a-repondu', { joueurId, nbRepondu: this.reponses.size, nbJoueurs: this.ctx.joueurs().length });
      // Si tout le monde a répondu, inutile de faire patienter la tablée.
      if (this.reponses.size >= this.ctx.joueurs().length) this.attendre(600, () => this.reveler());
    }

    reveler() {
      if (this.phase !== 'question') return;
      this.phase = 'revelation';
      this.annulerMinuteurs();
      const q = this.questions[this.index];
      const repartition = q.choix.map(() => 0);
      const gagnants = [];
      const resultats = [];

      this.ctx.joueurs().forEach((j) => {
        const r = this.reponses.get(j.id);
        if (r) repartition[r.choix]++;
        const juste = r && r.choix === q.bonne;
        // Le calcul des points : une base fixe, plus un bonus proportionnel au temps qui restait.
        const bareme = juste ? Math.round(this.reglages.pointsBase + this.reglages.bonusVitesse * (r.restantMs / this.reglages.dureeMs)) : 0;
        // ajouterPoints renvoie ce qui a vraiment été crédité (le double en Grande Finale).
        const points = bareme ? this.ctx.ajouterPoints(j.id, bareme) : 0;
        if (points) {
          gagnants.push({ id: j.id, nom: j.nom, avatar: j.avatar, points });
        }
        resultats.push({ j, juste: !!juste, aRepondu: !!r, points });
      });

      gagnants.sort((a, b) => b.points - a.points);
      // Chaque téléphone reçoit son verdict, l'explication (l'anecdote, la règle de français…)
      // et le trio des plus rapides : tout le contenu de la tablette, en version de poche.
      const explication = this.explication(q);
      const vue = this.vueRevelation(q);
      resultats.forEach(({ j, juste, aRepondu, points }) => {
        const rang = gagnants.findIndex((g) => g.id === j.id);
        this.ctx.ecranJoueur(j.id, 'qcm-resultat', {
          juste, aRepondu, points, bonne: q.bonne, bonneTexte: q.choix[q.bonne], score: j.score,
          intitule: vue.intitule, zoom: vue.zoom || null, illustration: vue.illustration || null, drapeau: vue.drapeau || null, puzzle: vue.puzzle || null, explication, rang: rang >= 0 ? rang + 1 : null,
          plusRapides: gagnants.slice(0, 3).map((g) => ({ nom: g.nom, avatar: g.avatar, points: g.points })),
          numero: this.index + 1, total: this.questions.length
        });
      });
      this.ctx.ecranTablette('qcm-revelation', Object.assign({}, this.vueRevelation(q), {
        numero: this.index + 1, total: this.questions.length,
        choix: q.choix, bonne: q.bonne, repartition, gagnants,
        explication: this.explication(q)
      }));
      this.attendre(this.reglages.revelationMs, () => this.questionSuivante());
    }

    /* Un joueur qui arrive en pleine question peut encore tenter sa chance. */
    joueurArrive(joueurId) {
      if (this.phase !== 'question' || this.reponses.has(joueurId)) return;
      const q = this.questions[this.index];
      this.ctx.ecranJoueur(joueurId, 'qcm-choix', {
        numero: this.index + 1, total: this.questions.length, finA: this.finA, dureeMs: this.reglages.dureeMs,
        choix: q.choix, consigne: this.consigneJoueur(q), vue: this.vueJoueur(q)
      });
    }

    /* « Passer » : pendant la question on révèle tout de suite ; pendant la révélation, on enchaîne. */
    passer() {
      if (this.phase === 'question') this.reveler();
      else { this.annulerMinuteurs(); this.questionSuivante(); }
    }

    /* À personnaliser par chaque jeu : */
    vueTablette(q) { return { intitule: q.question }; }
    // Ce que voient les téléphones pendant la question (par défaut, la même chose que la tablette).
    vueJoueur(q) { return this.vueTablette(q); }
    // Ce que l'on montre au moment de la réponse (par défaut, la même chose que pendant la question).
    vueRevelation(q) { return this.vueTablette(q); }
    consigneJoueur() { return 'Choisis ta réponse'; }
    explication(q) { return { titre: 'Le saviez-vous ?', texte: q.anecdote || '' }; }
  }

  return { Jeu, JeuQCM };
});

<script>/* moteur/jeux/quiz.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU 1 — Le quiz de culture générale
 * ════════════════════════════════════════════════════════════════════
 *
 *  Huit questions, vingt secondes chacune. Le tirage est équilibré :
 *  deux questions « pour les jeunes », deux « pour les aînés », quatre
 *  pour tout le monde. Personne ne reste sur le banc de touche, et
 *  chaque génération aura l'occasion de briller… ou d'être surprise.
 *
 *  Toute la mécanique (affichage, chronomètre, points) vient du moule
 *  JeuQCM : ce fichier ne fait que choisir les questions et décrire
 *  ce que la tablette doit montrer.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/quiz', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { JeuQCM } = exiger('../jeux/base');
  const BANQUE = exiger('../contenus/quiz');

  class Quiz extends JeuQCM {
    constructor(ctx) {
      const parPublic = (p) => BANQUE.filter((q) => q.public === p);
      const selection = outils.melanger([
        ...outils.tirerNeuf('quiz-jeunes', parPublic('jeunes'), 2),
        ...outils.tirerNeuf('quiz-aines', parPublic('aînés'), 2),
        ...outils.tirerNeuf('quiz-tous', parPublic('tous'), 4)
      ]);
      super(ctx, { questions: selection, dureeMs: 20000, revelationMs: 9000 });
    }
    vueTablette(q) {
      const etiquette = q.public === 'jeunes' ? 'Question jeunesse' : q.public === 'aînés' ? 'Question sagesse' : q.theme;
      return { intitule: q.question, surtitre: etiquette };
    }
  }

  /* La « fiche d'identité » du jeu, affichée sur la tablette au moment du choix. */
  Quiz.fiche = {
    id: 'quiz',
    nom: 'Le grand quiz',
    icone: '🧠',
    resume: 'Culture générale, une touche belge, des questions pour chaque génération.',
    regle: 'Lisez la question sur la tablette et touchez la bonne couleur sur votre téléphone. Plus vous êtes rapide, plus vous gagnez de points.'
  };

  return Quiz;
});

</script>
<script>/* moteur/jeux/dessin.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU 2 — Dessine et devine
 * ════════════════════════════════════════════════════════════════════
 *
 *  À tour de rôle, un joueur reçoit un mot secret sur son téléphone et
 *  le dessine du bout du doigt. Chaque trait apparaît en direct sur la
 *  tablette, au centre de la table. Les autres tapent leurs propositions
 *  sur leur propre téléphone.
 *
 *  Le déroulement d'un tour :
 *   1. Le dessinateur découvre son mot (il peut en changer une fois).
 *   2. Il a 75 secondes. À mi-temps puis aux trois quarts, la tablette

      if (!d || this.phase !== 'dessin') return;

      // ─── Ce que peut faire le dessinateur ───

        mot: this.mot, traits: this.traits, trouveurs: this.trouveurs,
        auteur: d ? { nom: d.nom, avatar: d.avatar } : null,
        dernier: this.tour + 1 >= this.dessinateurs.length
      });
      this.ctx.ecranTousJoueurs((j) => ({ type: 'info', donnees: {
        titre: 'C\'était « ' + this.mot + ' »',
        texte: j.id === this.dessinateurId
          ? (this.trouveurs.length ? this.trouveurs.length + ' personne(s) ont trouvé grâce à toi !' : 'Personne n\'a trouvé… l\'art est parfois incompris.')
          : (this.trouveurs.some((t) => t.id === j.id) ? 'Bien joué !' : 'Ce sera pour le prochain dessin.'),

    }

      if (this.phase !== 'dessin') return;
      const d = this.ctx.joueur(this.dessinateurId);

        if (!d || !d.connecte) this.finDuTour();

      else { this.annulerMinuteurs(); this.tourSuivant(); }

    nom: 'Dessine et devine',
    icone: '🎨',
    resume: 'Un joueur dessine sur son téléphone, le dessin apparaît sur la tablette, les autres devinent.',
    regle: 'Quand c\'est votre tour, dessinez le mot secret avec le doigt. Sinon, regardez la tablette et tapez vos idées sur votre téléphone. Les fautes d\'orthographe sont pardonnées !'

<script>/* moteur/jeux/erreurs.js */
/*
 * ════════════════════════════════════════════════════════════════════
 *  MINI-JEU 3 — Les 7 erreurs en 1 minute
 * ════════════════════════════════════════════════════════════════════
 *
 *  Le jeu des différences, version course contre la montre. Chaque
 *  téléphone affiche deux paysages presque identiques ; il faut toucher
 *  les sept différences en moins d'une minute. Tout le monde joue en
 *  même temps, chacun sur son écran, et la tablette montre la course
 *  en direct (« Papy : 5/7, Léa : 6/7… »).
 *
 *  D'où viennent les images ? Elles ne sont pas dessinées à l'avance :
 *  le jeu les COMPOSE à chaque partie. Il place au hasard un soleil,
 *  des nuages, des arbres, une maison, des fleurs… puis fabrique une
 *  copie dans laquelle il glisse sept modifications : un objet qui
 *  change de couleur, un autre qui disparaît, un troisième qui grossit,
 *  un sapin qui remplace un arbre… On ne joue donc jamais deux fois la
 *  même image, et personne ne peut apprendre les réponses par cœur.
 *
 *  Le jeu ne transmet aux téléphones qu'une description (« un arbre
 *  vert, ici, de cette taille ») ; c'est le fichier public/js/scene.js
 *  qui la transforme en dessin. La vérification des touches se fait sur
 *  le serveur : il connaît l'emplacement exact de chaque différence.
 *
 *  Le barème : 100 points par différence trouvée, 15 points de moins par
 *  touche à côté (pour décourager ceux qui tapotent partout au hasard),
 *  et un bonus si l'on trouve les sept : 200 points + 5 par seconde restante.
 */
(function (racine, nom, fabrique) {
  if (typeof module === 'object' && module.exports) module.exports = fabrique(require);
  else { racine.GT = racine.GT || { modules: {} }; racine.GT.modules = racine.GT.modules || {}; racine.GT.modules[nom] = fabrique(function (c) { return racine.GT.modules[c.replace(/^(\.\.?\/)+/, '')]; }); }
})(this, 'jeux/erreurs', function (exiger) {
  'use strict';
  const outils = exiger('../outils');
  const { Jeu } = exiger('../jeux/base');

  const DUREE_MS = 60000;
  const NB_ERREURS = 7;
  const LARGEUR = 400, HAUTEUR = 300;

  /*
   * Le catalogue des objets : où ils peuvent se placer (zone en y),
   * leur encombrement (rayon) et les couleurs qu'ils peuvent prendre.
   * « famille » regroupe les objets interchangeables pour la
   * modification « remplacé par un autre objet ».
   */
  const CATALOGUE = {
    soleil:      { y: [30, 70],   rayon: 34, couleurs: ['#FFC93C', '#FF9F1C'], famille: null },
    nuage:       { y: [30, 130],  rayon: 30, couleurs: ['#FFFFFF', '#D9DEEF', '#FFD6E8'], famille: 'ciel' },
    oiseau:      { y: [40, 150],  rayon: 18, couleurs: ['#2B2F4F', '#E4572E', '#3D5A80'], famille: 'ciel' },
    ballon:      { y: [50, 150],  rayon: 24, couleurs: ['#FF6B5B', '#9B8CFF', '#3DD6B5', '#FFC93C'], famille: 'ciel' },
    cerfvolant:  { y: [40, 140],  rayon: 24, couleurs: ['#FF6B5B', '#9B8CFF', '#3DD6B5', '#FFC93C'], famille: 'ciel' },
    arbre:       { y: [200, 230], rayon: 34, couleurs: ['#3BA55C', '#2E7D4F', '#A3C93A', '#E9A23B'], famille: 'grand' },
    sapin:       { y: [200, 230], rayon: 34, couleurs: ['#1F7A4D', '#2E8B57', '#4A9C6D'], famille: 'grand' },
    maison:      { y: [205, 230], rayon: 36, couleurs: ['#C0392B', '#5D4E8C', '#2C6E8F'], famille: null, mur: ['#F7E1C6', '#FFE3A3', '#F4C7C3'] },
    fleur:       { y: [250, 280], rayon: 18, couleurs: ['#FF6B5B', '#9B8CFF', '#FF8FC7', '#FFFFFF'], famille: 'petit' },
    champignon:  { y: [250, 280], rayon: 20, couleurs: ['#E4572E', '#8D5A3B', '#9B8CFF'], famille: 'petit' }
  };

  /* La recette d'un paysage : combien d'objets de chaque sorte. */
  const RECETTE = { soleil: 1, nuage: 2, oiseau: 2, ballon: 1, cerfvolant: 1, arbre: 2, sapin: 1, maison: 1, fleur: 3, champignon: 2 };

  function autreCouleur(type, actuelle) {
    return outils.tirer(CATALOGUE[type].couleurs.filter((c) => c !== actuelle), 1)[0];
  }

  /*
   * Placer les objets sans qu'ils se chevauchent : on tire une position
   * au hasard, et si elle est trop proche d'un objet déjà posé, on
   * recommence (jusqu'à 300 essais, puis on renonce à cet objet).
   */
  function composerPaysage() {
    const objets = [];
    let numero = 0;
    Object.entries(RECETTE).forEach(([type, combien]) => {
      for (let k = 0; k < combien; k++) {
        const fiche = CATALOGUE[type];
        for (let essai = 0; essai < 300; essai++) {
          const t = Math.round((0.85 + Math.random() * 0.3) * 100) / 100;
          const x = outils.entier(36, LARGEUR - 36);
          const y = outils.entier(fiche.y[0], fiche.y[1]);
          const r = fiche.rayon * t;
          const libre = objets.every((o) => Math.hypot(o.x - x, o.y - y) > r + CATALOGUE[o.type].rayon * o.t - 4);
          if (libre) {

            break;
          }
        }
      }

  }

    const differences = [];

      if (fiche.famille) possibles.push('remplace', 'remplace'); // deux fois : un peu plus probable, c'est la plus amusante
      const modif = outils.tirer(possibles, 1)[0];

        o.type = outils.tirer(cousins, 1)[0];
        o.c = outils.tirer(CATALOGUE[o.type].couleurs, 1)[0];
      }

    return { modifiee: modifiee.filter((o) => !o.cache), differences };
  }

  class Erreurs extends Jeu {
    demarrer() {
      this.originale = composerPaysage();
      const { modifiee, differences } = glisserErreurs(this.originale);
      this.modifiee = modifiee;
      this.differences = differences;
      this.finA = Date.now() + DUREE_MS;
      this.phase = 'jeu';
      // Pour chaque joueur : la liste des différences trouvées, ses touches ratées, et quand il a fini.
      this.fiches = {};
      this.progression = {}; // ce que montre la tablette (transmis « vivant », voir dessin.js)
      this.ctx.joueurs().forEach((j) => this.inscrire(j));

      this.ctx.ecranTablette('erreurs-tableau', {
        originale: this.originale, modifiee: this.modifiee, finA: this.finA, dureeMs: DUREE_MS,
        nbErreurs: NB_ERREURS, progression: this.progression
      });
      this.ctx.joueurs().forEach((j) => this.envoyerEcran(j.id));
      this.attendre(DUREE_MS + 300, () => this.fin());
    }

    inscrire(j) {
      if (this.fiches[j.id]) return;
      this.fiches[j.id] = { trouvees: [], rates: 0, finiA: null };
      this.progression[j.id] = { nom: j.nom, avatar: j.avatar, nb: 0 };
    }

    envoyerEcran(joueurId) {
      const f = this.fiches[joueurId];
      this.ctx.ecranJoueur(joueurId, 'erreurs-jeu', {
        originale: this.originale, modifiee: this.modifiee, finA: this.finA, dureeMs: DUREE_MS,
        nbErreurs: NB_ERREURS,
        trouvees: f.trouvees.map((id) => this.differences.find((d) => d.id === id)),
        fini: !!f.finiA
      });
    }

    action(joueurId, d) {
      if (!d || d.type !== 'touche' || this.phase !== 'jeu') return;
      const f = this.fiches[joueurId];
      if (!f || f.finiA) return;
      const x = +d.x, y = +d.y;
      if (!isFinite(x) || !isFinite(y)) return;

      // Quelle différence non encore trouvée est la plus proche de la touche ?
      const touchee = this.differences
        .filter((diff) => !f.trouvees.includes(diff.id))
        .find((diff) => Math.hypot(diff.x - x, diff.y - y) <= diff.r);

      if (touchee) {
        f.trouvees.push(touchee.id);
        this.progression[joueurId].nb = f.trouvees.length;
        if (f.trouvees.length >= NB_ERREURS) f.finiA = Date.now();
        this.ctx.evenementJoueur(joueurId, 'trouvee', { diff: touchee, nb: f.trouvees.length, fini: !!f.finiA });
        this.ctx.evenementTablette('progression', { joueurId, nb: f.trouvees.length });

        if (Object.values(this.fiches).every((x) => x.finiA)) this.attendre(1500, () => this.fin());
